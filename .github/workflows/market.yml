name: Update the "Right now" numbers
on:
  schedule:
    - cron: '30 11 * * 1-5'   # weekdays, 6:30 or 7:30 a.m. Eastern
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch the numbers from FRED
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: node tools/fetch-market.mjs
      - name: Rebuild the site and check it
        run: |
          node build.mjs
          node tests/units.test.js
          node tests/engine.test.js
          node tests/games.test.js
          node tests/market.test.js
      - name: Publish if anything changed
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Update the Right now numbers"
            git push
          fi
