<title>Finance Recruiting Coach</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="A free coach for finance recruiting: a day-by-day plan to your interview date, a lesson a day, voice practice and mock interviews.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,100..900;1,62..125,100..900&family=IBM+Plex+Mono:wght@400;500;600&family=Source+Serif+4:ital,opsz,wght@0,8..60,400..700;1,8..60,400..700&display=swap">
<style>
:root {
  /* Layout: a working model. Blue = what the student typed, black = what the coach builds,
     green = sessions linked to one of their dates. Sticky header, tabbed views, ledger-ruled day lists. */
  --paper: #F1F4EF;
  --sheet: #FFFFFF;
  --ink: #101C29;
  --ink-2: #485664;
  --ink-3: #5F6C78;
  --rule: #D6DFD4;
  --rule-2: #B4C2B2;
  --input: #1537CF;
  --input-wash: #E8EDFF;
  --link: #15703A;
  --link-wash: #E1F1E6;
  --flag: #8F5300;
  --flag-wash: #FFF0D2;
  --miss: #AE2A20;
  --miss-wash: #FBE7E4;
  --today: #FFF3B0;
  --shadow: 0 1px 2px rgba(16, 28, 41, .06), 0 6px 18px rgba(16, 28, 41, .06);
  --f-ui: "Archivo", "Helvetica Neue", Helvetica, Arial, sans-serif;
  --f-read: "Source Serif 4", "Source Serif Pro", Georgia, "Times New Roman", serif;
  --f-mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --r: 6px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0C131A; --sheet: #131C26; --ink: #E7EDF2; --ink-2: #A9B5C1; --ink-3: #8794A1;
    --rule: #223040; --rule-2: #34475B; --input: #93A8FF; --input-wash: #1B2547;
    --link: #5DCC88; --link-wash: #11301E; --flag: #F2B45A; --flag-wash: #35260C;
    --miss: #FF8E82; --miss-wash: #3B1814; --today: #3A3311;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 6px 20px rgba(0, 0, 0, .25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0C131A; --sheet: #131C26; --ink: #E7EDF2; --ink-2: #A9B5C1; --ink-3: #8794A1;
  --rule: #223040; --rule-2: #34475B; --input: #93A8FF; --input-wash: #1B2547;
  --link: #5DCC88; --link-wash: #11301E; --flag: #F2B45A; --flag-wash: #35260C;
  --miss: #FF8E82; --miss-wash: #3B1814; --today: #3A3311;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 6px 20px rgba(0, 0, 0, .25);
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--paper); color: var(--ink);
  font-family: var(--f-ui); font-size: 15px; line-height: 1.5;
  -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--sheet); }
h1, h2, h3, h4 { margin: 0; text-wrap: balance; }
p { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--input); }
:focus-visible { outline: 2px solid var(--input); outline-offset: 2px; }
.mono { font-family: var(--f-mono); }
.num { font-variant-numeric: tabular-nums; }
.wrap { max-width: 1180px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- header ---------- */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--sheet); border-bottom: 1px solid var(--rule); }
.top-row { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding-block: 12px 4px; }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.brand-mark { flex: none; width: 28px; height: 28px; }
.brand-name { font-weight: 760; font-stretch: 116%; font-size: 17px; letter-spacing: -0.01em; line-height: 1.1; white-space: nowrap; }
.brand-sub { font-family: var(--f-mono); font-size: 11.5px; color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.brand-txt { min-width: 0; }
.count { display: flex; align-items: baseline; gap: 8px; flex: none; text-align: right; }
.count-n { font-weight: 720; font-stretch: 110%; font-size: 26px; line-height: 1; }
.count-l { font-family: var(--f-mono); font-size: 11px; color: var(--ink-3); text-transform: uppercase; letter-spacing: .06em; line-height: 1.25; max-width: 12ch; text-align: left; }
.tabs { display: flex; flex-wrap: wrap; gap: 2px 4px; margin-top: 4px; }
.tab { appearance: none; border: 0; background: none; padding: 9px 10px 8px; font-size: 14px; font-weight: 600; color: var(--ink-2); border-bottom: 2px solid transparent; cursor: pointer; border-radius: 4px 4px 0 0; }
.tab:hover { color: var(--ink); background: var(--paper); }
.tab[aria-current="page"] { color: var(--ink); border-bottom-color: var(--ink); }
.tab[aria-disabled="true"] { color: var(--ink-3); opacity: .55; cursor: not-allowed; background: none; }

main { padding-block: 24px 40px; }
.foot { border-top: 1px solid var(--rule); color: var(--ink-3); font-size: 12.5px; padding-block: 16px 28px; display: flex; flex-wrap: wrap; gap: 6px 18px; }
.foot .warn { color: var(--flag); }
.dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--ink-3); margin-right: 6px; vertical-align: 1px; }
.dot.on { background: var(--link); }
.dot.off { background: var(--flag); }

/* ---------- shared bits ---------- */
.eyebrow { font-family: var(--f-mono); font-size: 11.5px; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-3); }
.h-page { font-size: 28px; font-weight: 740; font-stretch: 112%; letter-spacing: -0.015em; line-height: 1.15; }
.lede { color: var(--ink-2); max-width: 64ch; margin-top: 8px; }
.chip { display: inline-flex; align-items: center; gap: 4px; font-family: var(--f-mono); font-size: 11px; font-weight: 600; letter-spacing: .05em; padding: 2px 6px; border: 1px solid var(--rule-2); border-radius: 4px; color: var(--ink-2); background: var(--sheet); white-space: nowrap; line-height: 1.4; }
.chip.link { color: var(--link); border-color: color-mix(in oklab, var(--link) 45%, transparent); background: var(--link-wash); }
.chip.input { color: var(--input); border-color: color-mix(in oklab, var(--input) 40%, transparent); background: var(--input-wash); }
.chip.flag { color: var(--flag); border-color: color-mix(in oklab, var(--flag) 45%, transparent); background: var(--flag-wash); }
.chip.miss { color: var(--miss); border-color: color-mix(in oklab, var(--miss) 45%, transparent); background: var(--miss-wash); }
.btn { appearance: none; display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 1px solid var(--rule-2); background: var(--sheet); color: var(--ink); padding: 8px 14px; border-radius: var(--r); font-weight: 600; font-size: 14px; cursor: pointer; line-height: 1.25; text-align: center; }
.btn:hover { border-color: var(--ink-2); }
.btn.primary { background: var(--ink); border-color: var(--ink); color: var(--sheet); }
.btn.primary:hover { background: color-mix(in oklab, var(--ink) 86%, var(--input)); }
.btn.ghost { border-color: transparent; background: transparent; color: var(--ink-2); padding-inline: 8px; }
.btn.ghost:hover { color: var(--ink); background: var(--paper); }
.btn.small { padding: 5px 10px; font-size: 13px; }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.btn-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.card { background: var(--sheet); border: 1px solid var(--rule); border-radius: 8px; padding: 18px; }
.note { font-size: 13.5px; color: var(--ink-2); }
.note.warn { color: var(--flag); }
.note.bad { color: var(--miss); }
.empty { padding: 28px; text-align: left; border: 1px dashed var(--rule-2); border-radius: 8px; color: var(--ink-2); background: var(--sheet); }
.empty h2 { font-size: 18px; color: var(--ink); margin-bottom: 6px; }
.empty .btn-row { margin-top: 14px; }
.thinking { display: inline-flex; align-items: center; gap: 10px; color: var(--ink-2); font-size: 14px; }
.pulse { width: 8px; height: 8px; border-radius: 50%; background: var(--input); animation: pulse 1.1s ease-in-out infinite; }
@keyframes pulse { 0%, 100% { opacity: .25; transform: scale(.8); } 50% { opacity: 1; transform: scale(1); } }
.ai-off { display: flex; gap: 12px; align-items: flex-start; padding: 12px 14px; border: 1px solid color-mix(in oklab, var(--flag) 40%, transparent); background: var(--flag-wash); border-radius: var(--r); color: var(--ink); font-size: 14px; margin-bottom: 16px; }
.ai-off strong { color: var(--flag); }

/* ---------- Today ---------- */
.today { display: grid; grid-template-columns: minmax(0, 1fr); gap: 28px; }
@media (min-width: 980px) { .today { grid-template-columns: minmax(0, 1fr) 300px; gap: 40px; } }
.session-head { display: grid; gap: 10px; padding-bottom: 18px; border-bottom: 1px solid var(--rule); }
.session-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.session-title { font-size: clamp(24px, 3.4vw, 34px); font-weight: 740; font-stretch: 108%; letter-spacing: -0.02em; line-height: 1.12; max-width: 30ch; }
.session-link { font-size: 13.5px; color: var(--link); }
.backlink { appearance: none; border: 0; background: none; color: var(--ink-2); font-size: 13.5px; padding: 0; cursor: pointer; margin-bottom: 10px; }
.backlink:hover { color: var(--ink); text-decoration: underline; }
.done-flag { color: var(--link); font-weight: 600; font-size: 13.5px; display: inline-flex; align-items: center; gap: 6px; }

.side { display: grid; gap: 22px; align-content: start; }
.side-block h2 { font-family: var(--f-mono); font-size: 11.5px; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-3); font-weight: 500; margin-bottom: 8px; padding-bottom: 6px; border-bottom: 1px solid var(--rule); }
.mini { list-style: none; margin: 0; padding: 0; }
.mini li { display: grid; grid-template-columns: 74px minmax(0, 1fr) auto; gap: 8px; align-items: baseline; padding: 6px 0; border-bottom: 1px solid var(--rule); font-size: 13.5px; }
.mini li:last-child { border-bottom: 0; }
.mini .d { font-family: var(--f-mono); font-size: 11.5px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.mini .t { min-width: 0; }
.mini .evn { color: var(--input); font-weight: 600; }
.mini .away { font-family: var(--f-mono); font-size: 11.5px; color: var(--ink-2); font-variant-numeric: tabular-nums; white-space: nowrap; }
.mini button.t { appearance: none; border: 0; background: none; padding: 0; text-align: left; cursor: pointer; color: inherit; }
.mini button.t:hover { text-decoration: underline; }
.mini li.is-today { background: var(--today); margin-inline: -6px; padding-inline: 6px; border-radius: 3px; }
.mini .st { font-size: 12px; font-family: var(--f-mono); }
.st-done { color: var(--link); }
.st-miss { color: var(--miss); }
.stats-row { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.stat-sm { background: var(--sheet); border: 1px solid var(--rule); border-radius: var(--r); padding: 10px 12px; }
.stat-sm b { display: block; font-size: 22px; font-weight: 700; line-height: 1.1; }
.stat-sm span { font-size: 12px; color: var(--ink-3); }

.teach { display: grid; gap: 12px; padding: 22px 0 6px; }
.teach p { color: var(--ink-2); max-width: 60ch; }
.lesson-wrap { padding-top: 6px; }
.lesson-bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid var(--rule); margin-bottom: 8px; }
.lesson-bar .note { font-family: var(--f-mono); font-size: 11.5px; }

/* lesson typography */
.lesson { font-family: var(--f-read); font-size: 18px; line-height: 1.62; color: var(--ink); max-width: 70ch; }
.lesson p, .lesson ul, .lesson ol, .lesson blockquote, .lesson .tbl, .lesson pre { margin: 0 0 14px; }
.lesson ul, .lesson ol { padding-left: 1.4em; }
.lesson li { margin: 4px 0; }
.lesson li::marker { font-family: var(--f-mono); font-size: .8em; color: var(--ink-3); }
.lesson strong { font-weight: 650; }
.lesson code { font-family: var(--f-mono); font-size: .82em; background: var(--paper); border: 1px solid var(--rule); padding: 0 4px; border-radius: 3px; }
.lesson pre { background: var(--paper); border: 1px solid var(--rule); border-radius: var(--r); padding: 12px; overflow-x: auto; font-size: 14px; }
.lesson pre code { border: 0; background: none; padding: 0; }
.lesson h4, .lesson h5 { font-family: var(--f-ui); font-size: 16px; font-weight: 700; margin: 18px 0 6px; }
.lesson hr { border: 0; border-top: 1px solid var(--rule); margin: 18px 0; }
.lesson blockquote { position: relative; padding: 2px 0 2px 28px; font-style: italic; color: var(--ink); }
.lesson blockquote::before { content: "\201C"; position: absolute; left: 0; top: -6px; font-size: 40px; line-height: 1; color: var(--ink-3); font-style: normal; }
.lesson blockquote p:last-child { margin-bottom: 0; }
.lesson .tbl { overflow-x: auto; font-family: var(--f-ui); font-size: 14.5px; }
.lesson table { border-collapse: collapse; min-width: 60%; font-variant-numeric: tabular-nums; }
.lesson th, .lesson td { border-bottom: 1px solid var(--rule); padding: 6px 12px 6px 0; text-align: left; vertical-align: top; }
.lesson th { font-weight: 650; border-bottom-color: var(--rule-2); }
.lesson-intro { font-family: var(--f-ui); font-size: 14.5px; color: var(--ink-2); margin-bottom: 4px; }
.lesson-intro p { margin: 0 0 6px; }
.sec { margin-top: 26px; }
.sec-label { display: flex; align-items: center; gap: 12px; font-family: var(--f-mono); font-size: 12px; font-weight: 500; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); margin: 0 0 10px; }
.sec-label::after { content: ""; flex: 1; height: 1px; background: var(--rule); }
.sec-cold .sec-body > p:first-child { font-size: 22px; line-height: 1.4; font-weight: 600; }
.sec-trap .sec-label { color: var(--miss); }
.sec-turn .sec-body > ol > li { margin: 10px 0; }
details.sec { border-top: 1px solid var(--rule); padding-top: 10px; }
details.sec > summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 12px; }
details.sec > summary::-webkit-details-marker { display: none; }
details.sec > summary .sec-label { margin: 0; flex: 1; }
details.sec > summary .reveal { font-family: var(--f-ui); font-size: 13px; font-weight: 600; color: var(--ink); border: 1px solid var(--rule-2); border-radius: 4px; padding: 3px 10px; background: var(--sheet); }
details.sec[open] > summary .reveal::after { content: " ▴"; }
details.sec:not([open]) > summary .reveal::after { content: " ▾"; }
details.sec .sec-body { padding-top: 12px; }
.trunc { font-family: var(--f-ui); font-size: 13.5px; color: var(--flag); }

/* grade box */
.grade { margin-top: 34px; display: grid; gap: 12px; }
.grade h2 { font-size: 19px; font-weight: 700; }
.field { display: grid; gap: 6px; }
.field > label, .lbl { font-size: 13px; font-weight: 600; color: var(--ink-2); }
.hint { font-size: 12.5px; color: var(--ink-3); }
.in, select.in, textarea.in { width: 100%; background: var(--sheet); border: 1px solid var(--rule-2); border-radius: var(--r); padding: 9px 11px; color: var(--input); font-weight: 500; }
.in::placeholder { color: var(--ink-3); font-weight: 400; opacity: 1; }
.in:focus { outline: none; border-color: var(--input); box-shadow: 0 0 0 3px var(--input-wash); }
textarea.in { min-height: 120px; resize: vertical; line-height: 1.5; }
select.in { appearance: auto; color: var(--input); }
.timer { display: inline-flex; align-items: center; gap: 10px; }
.timer-read { font-family: var(--f-mono); font-variant-numeric: tabular-nums; font-size: 15px; min-width: 9ch; }
.timer-read .ph { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); margin-right: 6px; }
.timer-read.answer .ph { color: var(--input); }
.timer-read.over .ph { color: var(--miss); }
.result { border: 1px solid var(--rule); background: var(--sheet); border-radius: 8px; padding: 18px; display: grid; gap: 14px; box-shadow: var(--shadow); }
.result-top { display: flex; gap: 14px; align-items: center; }
.score { flex: none; display: grid; place-items: center; width: 58px; height: 58px; border-radius: 8px; font-weight: 750; font-size: 28px; line-height: 1; border: 1px solid; }
.score small { font-size: 11px; font-weight: 600; font-family: var(--f-mono); }
.score.s-hi { color: var(--link); background: var(--link-wash); border-color: color-mix(in oklab, var(--link) 40%, transparent); }
.score.s-mid { color: var(--flag); background: var(--flag-wash); border-color: color-mix(in oklab, var(--flag) 40%, transparent); }
.score.s-lo { color: var(--miss); background: var(--miss-wash); border-color: color-mix(in oklab, var(--miss) 40%, transparent); }
.verdict { font-weight: 600; font-size: 15.5px; }
.verdict-l { font-family: var(--f-mono); font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); display: block; }
.cols { display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; }
@media (min-width: 700px) { .cols { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); } }
.cols h3 { font-size: 13px; font-weight: 700; margin-bottom: 4px; }
.cols ul, .cols ol { margin: 0; padding-left: 1.2em; font-size: 14.5px; }
.better { font-family: var(--f-read); font-size: 16.5px; line-height: 1.55; border-left: 2px solid var(--rule-2); padding-left: 14px; }
.followup { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; padding-top: 10px; border-top: 1px solid var(--rule); font-size: 14.5px; }
.followup q { font-style: italic; }

/* ---------- Plan ---------- */
.plan-head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 20px; }
.plan-sum { display: flex; flex-wrap: wrap; gap: 6px 18px; color: var(--ink-2); font-size: 14px; margin-top: 8px; }
.plan-sum b { color: var(--ink); font-variant-numeric: tabular-nums; }
.phasebar-wrap { margin: 8px 0 22px; }
.phasebar { position: relative; display: flex; height: 14px; border-radius: 4px; overflow: hidden; gap: 2px; background: var(--sheet); }
.phasebar .seg { min-width: 4px; }
.phasebar-wrap .ticks { position: relative; height: 18px; }
.tick { position: absolute; top: 2px; width: 2px; height: 10px; background: var(--input); transform: translateX(-1px); border-radius: 1px; }
.tick.est { background: var(--flag); }
.nowline { position: absolute; top: -4px; bottom: -4px; width: 2px; background: var(--ink); transform: translateX(-1px); }
.phasebar-outer { position: relative; }
.phase-legend { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 8px 16px; font-size: 13px; }
.phase-legend li { display: grid; grid-template-columns: 12px minmax(0, 1fr); gap: 2px 8px; align-items: baseline; }
.phase-legend .sw { width: 12px; height: 12px; border-radius: 3px; align-self: center; }
.phase-legend b { font-weight: 650; }
.phase-legend span.r { grid-column: 2; font-family: var(--f-mono); font-size: 11.5px; color: var(--ink-3); }
.ph-1 { background: color-mix(in oklab, var(--ink) 16%, var(--sheet)); }
.ph-2 { background: color-mix(in oklab, var(--ink) 34%, var(--sheet)); }
.ph-3 { background: color-mix(in oklab, var(--ink) 56%, var(--sheet)); }
.ph-4 { background: color-mix(in oklab, var(--ink) 78%, var(--sheet)); }
.ph-0 { background: color-mix(in oklab, var(--ink) 40%, var(--sheet)); }
.tick-key { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--ink-2); }
.tick-key i { display: inline-block; width: 2px; height: 10px; background: var(--input); }
.tick-key i.now { background: var(--ink); width: 2px; height: 12px; }
.tick-key i.est { background: var(--flag); }
.week { border-top: 1px solid var(--rule-2); }
.week > summary { list-style: none; cursor: pointer; display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 14px; padding: 12px 0; }
.week > summary::-webkit-details-marker { display: none; }
.week > summary::before { content: "▸"; font-size: 11px; color: var(--ink-3); width: 10px; }
.week[open] > summary::before { content: "▾"; }
.wk-n { font-family: var(--f-mono); font-size: 12px; letter-spacing: .07em; text-transform: uppercase; font-weight: 600; }
.wk-r { font-size: 14px; color: var(--ink-2); }
.wk-m { font-family: var(--f-mono); font-size: 11.5px; color: var(--ink-3); margin-left: auto; font-variant-numeric: tabular-nums; }
.wk-now { font-family: var(--f-mono); font-size: 11px; background: var(--today); color: var(--ink); padding: 1px 6px; border-radius: 3px; }
.days { list-style: none; margin: 0 0 12px; padding: 0; }
.days li { border-top: 1px solid var(--rule); }
.row { display: grid; grid-template-columns: 92px 56px minmax(0, 1fr) auto; gap: 10px; align-items: baseline; width: 100%; padding: 9px 6px; text-align: left; appearance: none; border: 0; background: none; cursor: pointer; color: var(--ink); font-size: 14.5px; }
.row:hover { background: var(--sheet); }

const QA = {"Walk me through your resume.":{"a":"**Tell it as a story, not a list, in 60 to 90 seconds.** Go roughly in order: where you started, the two or three experiences that pulled you toward finance, what you did and learned in each, and why this role is the logical next step. Connect each step with *why* you moved on.\n\n**Sample:** \"I grew up in a small town where my parents ran a hardware store, and doing the inventory counts with them got me interested in how businesses make money. At school I'm studying economics, and I joined the investment club in my first semester. I've since pitched two stocks, one of which the fund bought. Last summer I worked for a local wealth management firm, where I built the quarterly review decks for clients. I liked the analysis but realized I wanted to be closer to how companies are valued and financed, which is why I'm excited about this role.\"\n\n- Pick the experiences that show skills the job needs: analysis, teamwork, drive\n- Have one detail ready to expand on for every line of your resume\n- End on why this role, today","f":"Which experience on your resume taught you the most, and why?"},"Tell me about yourself.":{"a":"**Use present, past, future in 60 to 90 seconds.** Present: who you are now (school, major, one hook). Past: two or three experiences that led you to finance, each with a result. Future: why this role and firm are the next step.\n\n**Sample:** \"I'm a sophomore studying economics. I first got hooked on finance keeping the books for my family's restaurant in high school, where I saw how a few cents on food costs decided whether we had a good month. At school I joined the investment club and led a pitch on a regional bank that the fund bought, and last summer I interned at a wealth management firm, building client review decks. The analytical work is what I've enjoyed most, which is why I'm excited about investment banking: it's the most intense way to learn how businesses are valued and financed.\"\n\nAvoid reading your resume line by line, starting in childhood, or mentioning anything you can't expand on.","f":"What's one thing about you that isn't on your resume?"},"Why finance?":{"a":"**Give a specific, personal answer with evidence, not a generic one.** One origin moment, what you've done since to test the interest, and what about the work itself appeals to you.\n\n**Sample:** \"The summer my uncle sold his landscaping business, I watched how much the price depended on how the buyer modeled his future cash flows, and I wanted to understand that side of the table. Since then I've taken corporate finance, joined the investment club and built a DCF on a company I follow. What draws me in is that finance sits at the center of big decisions: whether a company gets funded, sold or rescued. And I like work where you're measured on being right.\"\n\nAvoid answers anyone could give: \"I like numbers,\" \"it's fast-paced,\" or the money.","f":"Why not consulting or a corporate finance role instead?"},"Why {seat}?":{"a":"**Tie three things together:** what the job actually involves, what you've done that shows you'd enjoy it, and how it fits where you want to go. Show you know the day-to-day work, not just the prestige.\n\n**Sample (investment banking):** \"I want to learn how companies are valued and financed from the inside. In my investment club, the valuation work was my favorite part, building the comps and arguing about the multiple, and in banking you do that every day on real deals. I also do my best work as part of a team under deadlines, which is how deals run. And the training in modeling and in working with clients is the best foundation I could ask for.\"\n\n**Adapt it to the seat:**\n- **Sales and trading:** fast decisions, live markets every day, measured by results\n- **Asset management, equity research or hedge funds:** deep research on companies, being judged on whether your views are right over time\n- **Wealth management:** people, long-term relationships, solving a family's whole financial picture\n- **Private equity or venture capital:** owning the decision to invest, and helping companies grow after the deal\n- **Corporate finance or commercial banking:** understanding one business, or many borrowers, deeply, and managing risk","f":"What do you think will be the hardest part of the job for you?"},"Why {firm}?":{"a":"**Give two or three reasons that fit this firm specifically, with proof you did the homework.** The best evidence is people you've spoken with, a recent deal or strategic move, how the firm is structured, and how all of that matches your goals.\n\n**Structure:** \"Two reasons. First, [a specific strength or recent deal], which matters to me because [link to your interest]. Second, when I spoke with [name, role], she told me [a specific detail about the culture or training], and that's the environment where I do my best work.\"\n\nAvoid reasons that apply to every firm (\"great reputation,\" \"smart people\") and anything you could only have read on the careers page.","f":"Who have you spoken with here, and what did you learn from them?"},"What do you think a first-year {role} does day to day?":{"a":"**Show you know the real job, not the movie version:** the tasks, who you work with and the hours, then say which part appeals to you.\n\n- **Investment banking:** building models and comps, updating pitch books, pulling research, coordinating due diligence and checking numbers, for associates and VPs; long, unpredictable hours.\n- **Sales and trading:** in before the market opens, preparing morning notes and data, booking trades, supporting senior traders or salespeople and learning the products; the day follows the market.\n- **Asset management, equity research or hedge funds:** researching companies and industries, updating models, reading filings, listening to earnings calls and writing up views for portfolio managers or clients.\n- **Wealth management:** preparing client reviews and portfolio reports, researching investments, and supporting advisors with planning and service.\n- **Private equity or venture capital:** screening companies, building models for potential deals, due diligence and market research, and monitoring portfolio companies.\n- **Corporate finance or credit:** budgets, forecasts and variance analysis, or analyzing borrowers' financials and writing credit memos.\n\nIf you've talked to someone in the role, quote what they told you.","f":"Which part of that do you think you'd find hardest?"},"Where do you see yourself in five years?":{"a":"**Show ambition that fits the path and commitment to the role you're interviewing for.** You don't need a fixed plan, just a believable direction.\n\n**Sample:** \"In five years I want to be really good at the core of this job: the person who can be trusted with a live model or an important client, taking on more responsibility, ideally at the next level up. I'd like to know one or two industries deeply by then. Longer term I'm open, but I want to be somewhere I'm still learning fast, and from what I've heard, that's here.\"\n\nAvoid saying you plan to leave quickly for business school or another industry, or anything that sounds like you're using the job as a stepping stone.","f":"What skills do you want to build in your first two years?"},"What's a business or market story you've followed closely lately?":{"a":"**Pick one story you genuinely understand, and tell it in about a minute:** what happened, why it matters (with a number or two), your view, and what you're watching next. Choose something from the last few weeks, ideally related to the role.\n\n**Structure:** \"I've been following [deal or event]. [What happened, with one or two numbers.] It matters because [the effect on companies, investors or the economy]. My view is [your opinion], because [your reason]. What I'm watching next is [the next catalyst].\"\n\nInterviewers will push, so know the key numbers, the strongest argument against your view, and how the story connects to their firm.","f":"What's the strongest argument against your view?"},"Tell me about a time you failed.":{"a":"**Pick a real failure with real stakes, own it, and spend most of the answer on what you changed.** Use STAR: the situation in a sentence or two, what you did and why it failed, what you learned, and how you've applied it since.\n\n**Sample:** \"I ran for treasurer of my club and lost, because I assumed my record would speak for itself and never asked members what they wanted. Afterward I asked a few people, and they'd wanted someone who would fix how we collected dues, which I'd never mentioned. Since then I start projects by asking the people affected what they need. When I organized our spring trip, I surveyed members first, and we had our highest turnout.\"\n\nAvoid fake failures (\"I worked too hard\"), blaming others, and failures with no lesson.","f":"What would you do differently if it happened again tomorrow?"},"Tell me about a time you led a team.":{"a":"**Show how you led, not just that you had a title.** Use STAR with one hard moment, like a deadline, a disagreement or someone not pulling their weight, and explain what you specifically did and the result.\n\n**Sample:** \"I led a four-person team in a case competition. Two weeks out, our analysis was solid but our story was a mess, and two teammates disagreed on the recommendation. I ran a 30-minute session where each side had to argue the other's position, which got us to a combined recommendation. Then I split the deck so each person owned a section, with a shared deadline two days early. We placed second out of 20 teams, and the judges singled out our recommendation.\"\n\nAdd one thing you'd do differently; good leaders reflect.","f":"What did you do when someone on the team wasn't pulling their weight?"},"Tell me about a conflict with a teammate and how you handled it.":{"a":"**Show that you listen, address the problem directly and respectfully, and keep the focus on the shared goal.** Use STAR, and don't make the other person a villain.\n\n**Sample:** \"On a group project, one teammate kept missing deadlines, and the rest of us were quietly redoing his work. Instead of calling him out in the group chat, I asked him to grab coffee. It turned out he was working 25 hours a week, and our meetings clashed with his shifts. We moved meetings to evenings and gave him the data section, which he could do on his own schedule. He delivered on time for the rest of the project, and we got an A.\"\n\nThe takeaway they want: you assume good intent, deal with problems early, and fix the cause, not just the symptom.","f":"What would you have done if he still hadn't delivered?"},"What's your greatest weakness?":{"a":"**Name a real weakness that matters at work, show evidence you're fixing it, and don't pick one that disqualifies you.** Skip the humble-brags (\"I'm a perfectionist\") and core skills of the job, like attention to detail for banking.\n\n**Sample:** \"When I'm new to something, I've tended to hold off on asking questions because I want to figure it out myself. In my first internship, I lost most of a day on a task that a two-minute question would have solved. Now I give myself a limit: if I'm stuck for 20 minutes, I write down what I've tried and ask. It's made me faster, and my manager said my questions were easy to answer because they were specific.\"\n\nStructure: the weakness, a concrete time it cost you, the system you built, and evidence it's working.","f":"When did that weakness last show up?"},"Tell me about a time you worked under real pressure.":{"a":"**Show that you stay calm, prioritize and still deliver quality work.** Use STAR with a concrete deadline and real stakes, and explain how you decided what to do first.\n\n**Sample:** \"During finals, my investment club moved our pitch up a week, so I had a stock pitch and two exams in the same three days. I listed everything that was due, worked out what only I could do, and asked a teammate to take over the comps while I finished the valuation. I blocked my days in two-hour chunks and cut everything that wasn't essential. We delivered the pitch on time, the fund bought the stock, and I did well on both exams.\"\n\nShow judgment and communication, not just long hours; interviewers want to know you won't fall apart on a deal deadline.","f":"How do you decide what to drop when you can't finish everything?"},"What's an accomplishment you're proud of?":{"a":"**Pick something that shows qualities the job needs, like drive, analytical skill, persistence or teamwork, and explain why it mattered to you.** Use STAR, make the challenge clear and put a number on the result.\n\n**Sample:** \"I'm proudest of rebuilding my club's portfolio tracker. It was a messy spreadsheet nobody trusted, so performance reports took a week. Over winter break I taught myself enough Excel and Python to rebuild it so it pulled prices automatically and reconciled to the brokerage statements. Reporting went from a week to an hour, and our faculty advisor now uses it for the annual report.\"\n\nThe strongest answers show you set the bar yourself and that the result helped other people.","f":"What would you do differently if you did it again?"},"Tell me about a time you had to persuade someone.":{"a":"**Show that you understood the other person's view, used evidence and adapted your approach, rather than just pushing harder.** Use STAR.\n\n**Sample:** \"Our club's portfolio manager wanted to sell a stock after a bad quarter. I thought the drop came from a one-time inventory problem. Instead of arguing in the meeting, I asked what would change his mind, and he said proof that the margin hit was temporary. I pulled three years of quarterly margins and showed the same pattern after a similar write-down a few years earlier, followed by a full recovery. He agreed to hold for two more quarters, and margins recovered as I'd expected.\"\n\nEvidence, empathy and a result are what count, and it's fine if you only partly won.","f":"Tell me about a time you couldn't persuade someone. What happened?"},"Tell me about a time you made a mistake on the details. What happened next?":{"a":"**Own it quickly, explain how you fixed it, and focus on the system you built so it doesn't happen again.** This question tests whether you'll catch errors before a client does.\n\n**Sample:** \"In my internship, I sent my manager a client report with last quarter's returns in one table, because I'd copied an old template. She caught it before it went out. I fixed it within the hour, then checked every report I'd made that week and found the same problem in one more. Since then I use a checklist for every deliverable: tie each number to its source, check dates and labels, and reread the final version as if I were the client. I haven't sent a similar error since.\"\n\nNever blame the template or the person who reviewed your work, and don't pick a mistake that seriously hurt a client.","f":"How do you check your work when you're short on time?"},"How do you handle critical feedback? Give me an example.":{"a":"**Show that you look for feedback, don't get defensive and change your behavior.** Give a specific example with a before and an after.\n\n**Sample:** \"After my first stock pitch, a senior member told me it was all description and no argument: I spent five minutes on what the company did and one on why it was mispriced. It stung, but he was right. I asked him to review my next outline, restructured it around the thesis and practiced it in two minutes. My next pitch was approved, and now I give new members the same advice.\"\n\nThe ideal answer shows you thanked the person, asked clarifying questions, applied the feedback and followed up.","f":"Tell me about feedback you disagreed with. What did you do?"},"Tell me about a time you took initiative without being asked.":{"a":"**Show that you spotted a problem or an opportunity, acted on it responsibly and produced a result.** Use STAR, and explain how you got buy-in from the right people.\n\n**Sample:** \"At my summer job at a bank branch, I noticed customers kept asking tellers the same five questions about mobile deposits, which slowed down the line. I wrote a one-page guide, showed it to my manager, and with her approval we put it at the counter and on the branch's web page. Friday wait times dropped noticeably, and two other branches started using it.\"\n\nGood initiative is checked with your manager first; avoid examples where you went around someone.","f":"How did you make sure you weren't overstepping?"},"Tell me about a time you had to learn something difficult quickly.":{"a":"**Show how you learn: the plan you made, the resources you used, how you tested yourself and the result.** Finance jobs start with a flood of new material, and this question asks whether you'll get up to speed.\n\n**Sample:** \"I joined my school's investment fund without having taken accounting, and my first pitch was three weeks away. I worked through an online accounting course for an hour every night, read the annual report of the company I was pitching alongside it, and asked an upperclassman to quiz me on how the statements link. By the pitch, I could walk through the company's cash flow statement and handle the accounting questions, and the pitch was approved.\"\n\nThe best answers mention asking for help and testing yourself, not just reading.","f":"What's something you're learning right now?"},"Walk me through the three financial statements.":{"a":"The **income statement** shows revenue and expenses over a period, ending in net income. The **balance sheet** is a snapshot, at one point in time, of what the company owns (assets) and what it owes (liabilities), plus shareholders' equity, and assets always equal liabilities plus equity. The **cash flow statement** starts with net income, adjusts for non-cash items like depreciation and for changes in working capital to get cash from operations, then adds cash from investing (like capital expenditures) and financing (like borrowing, repaying debt and dividends) to show the change in cash.\n\nThey link together: net income flows into retained earnings on the balance sheet and is the first line of the cash flow statement, and ending cash on the cash flow statement becomes cash on the balance sheet.","f":"If you could use only one of the three statements to judge a company, which would you pick?"},"How do the three financial statements link together?":{"a":"**Net income** from the income statement is the first line of the cash flow statement, and it also flows into **retained earnings** on the balance sheet, minus any dividends. The cash flow statement then adjusts net income for **non-cash items**, like adding back depreciation, which also reduces PP&E on the balance sheet, and for **changes in working capital**, which come from balance sheet items like receivables, inventory and payables. Cash from investing ties to changes in long-term assets like PP&E, and cash from financing ties to changes in debt and equity. Finally, the **net change in cash** plus the starting cash gives the cash balance on the balance sheet, which is what makes the balance sheet balance.","f":"Depreciation goes up by $10. Walk me through the three statements."},"Depreciation goes up by $10. Walk me through the three statements. Assume a 25% tax rate.":{"a":"**Income statement:** operating income falls by $10. With a 25% tax rate, taxes fall by $2.50, so net income falls by $7.50.\n\n**Cash flow statement:** net income is down $7.50, but depreciation is a non-cash expense, so you add back the $10. Cash from operations rises by $2.50, which is the tax saving. Cash is up $2.50.\n\n**Balance sheet:** cash is up $2.50 and PP&E is down $10, so total assets fall by $7.50. Retained earnings fall by $7.50 with net income. Both sides are down $7.50, so it balances.","f":"Why does cash go up when an expense went up?"},"If you could use only one financial statement to judge a company, which would you pick and why?":{"a":"**The cash flow statement**, because cash is the hardest number to manipulate, and it shows whether the business actually generates money. It starts with net income, so you still see profitability, then shows how much cash operations really produce after working capital, how much the company reinvests through capital expenditures, and how it's financed. That gives you free cash flow, the closest thing to a company's true earning power.\n\nAcknowledge the trade-offs: for a bank or a company in distress, where solvency matters most, the balance sheet could be the better pick. And if you could have two, take the income statement and the balance sheet, because you can build the cash flow statement from them.","f":"What if you could pick two?"},"What's the difference between cash-basis and accrual accounting?":{"a":"**Cash-basis accounting** records revenue when cash comes in and expenses when cash goes out. **Accrual accounting** records revenue when it's earned, when the product or service is delivered, and expenses when they're incurred, matched to the revenue they help produce, whenever the cash moves.\n\nExample: you deliver $1,000 of consulting in December and get paid in February. Under accrual accounting, that's December revenue, with an account receivable until the cash arrives; under cash-basis accounting, it's February revenue. U.S. public companies must use accrual accounting under GAAP because it shows performance in each period more accurately, and that's exactly why the cash flow statement exists: to show how accrual profits turn into cash.","f":"Give me an example of a company whose profit and cash flow look very different."},"A company buys $100 of inventory with cash. Walk me through the statements. Then it sells that inventory for $150. Walk me through again with a 25% tax rate.":{"a":"**Buying the inventory:** nothing changes on the income statement. On the cash flow statement, the increase in inventory reduces cash from operations by $100. On the balance sheet, cash falls $100 and inventory rises $100, so total assets don't change.\n\n**Selling it for $150, for cash:** on the income statement, revenue rises $150 and cost of goods sold rises $100, so pre-tax income rises $50; taxes rise $12.50 and net income rises $37.50. On the cash flow statement, net income is up $37.50 and the $100 decrease in inventory adds $100, so cash rises $137.50. On the balance sheet, cash is up $137.50 and inventory is down $100, so assets rise $37.50, and retained earnings rise $37.50. It balances.\n\n(If the taxes haven't been paid yet, cash is up $150 and taxes payable is up $12.50. It still balances.)","f":"What changes if the customer buys on credit instead of paying cash?"},"What is working capital, and how can a growing company run out of cash even when it's profitable?":{"a":"**Working capital** is current assets minus current liabilities. In operating terms, it's mostly receivables plus inventory minus payables: the cash tied up in running the business day to day.\n\nA growing company can be profitable on paper but short of cash because it has to buy more inventory and wait to be paid by customers before it collects anything. Imagine a company growing sales from $10 million to $15 million that gives customers 60 days to pay and holds three months of inventory, but pays its suppliers in 30 days. Every extra dollar of sales ties up more cash in receivables and inventory. The profit shows up on the income statement, but the cash is stuck on the balance sheet. If the company can't borrow or raise equity to cover the gap, it can run out of cash while reporting record profits. That's why lenders watch the cash conversion cycle, and why fast growth can be dangerous.","f":"How could the company fix that cash crunch without slowing its growth?"},"What's the difference between net income and free cash flow?":{"a":"**Net income** is accounting profit: revenue minus all expenses, including non-cash ones like depreciation, under accrual rules. **Free cash flow** is the cash the business actually generates after investing to maintain and grow itself: cash from operations minus capital expenditures.\n\nTo get from net income to free cash flow, add back non-cash expenses like depreciation and stock-based compensation, subtract increases in working capital, and subtract capital expenditures. The two can be far apart: a fast-growing company investing heavily can have positive net income but negative free cash flow, while a mature company with little to reinvest can generate free cash flow well above its net income. Investors often trust free cash flow more because it's harder to manipulate.","f":"Which matters more when you value a company, and why?"},"How does stock-based compensation show up on the three statements?":{"a":"**Income statement:** it's an operating expense, spread across lines like R&D and sales and marketing, so it lowers operating income and net income. It's generally tax-deductible, though the timing can differ.\n\n**Cash flow statement:** it's a non-cash expense, so it's added back in cash from operations, like depreciation.\n\n**Balance sheet:** with $10 of stock-based compensation and a 25% tax rate, net income falls $7.50 and the $10 add-back means cash rises $2.50. On the other side, retained earnings fall $7.50 while paid-in capital rises $10, so equity rises $2.50. It balances.\n\nThe debate: adding it back makes cash flow look stronger, but it's a real cost to shareholders, paid through dilution. Many analysts subtract it when they calculate free cash flow, or at least use the fully diluted share count.","f":"Should you add back stock-based compensation when calculating EBITDA or free cash flow?"},"What is goodwill, and when is it created?":{"a":"**Goodwill** is created when one company buys another for more than the fair value of its identifiable net assets. It represents things that aren't recorded separately, like the assembled workforce, reputation and expected synergies.\n\nExample: a buyer pays $1 billion for a company whose identifiable assets are worth $700 million at fair value, with $100 million of liabilities. Net identifiable assets are $600 million, so goodwill is $400 million. In practice, part of the excess first goes to identifiable intangible assets like customer relationships or patents, which are amortized.\n\nUnder U.S. GAAP, public companies don't amortize goodwill. They test it for impairment at least once a year, and if the acquired business is worth less than its value on the books, they record a write-down: a non-cash expense that reduces net income.","f":"What happens on the three statements when goodwill is impaired?"},"A company raises $100 of debt and uses it to buy PP&E. Walk me through the statements at the moment of purchase.":{"a":"**Income statement:** nothing changes yet. There's no interest or depreciation at the moment of purchase.\n\n**Cash flow statement:** cash from financing is +$100 from the debt, and cash from investing is −$100 for the capital expenditure, so the net change in cash is zero.\n\n**Balance sheet:** PP&E rises $100 on the assets side and debt rises $100 on the liabilities side; cash doesn't change. Both sides rise $100, so it balances.\n\nOver the following year, interest expense and depreciation would reduce net income, depreciation would be added back on the cash flow statement, and any debt repayment would show up in financing.","f":"Now take it to the end of year one, with 10% interest, 10-year straight-line depreciation and a 25% tax rate."},"Why is EBITDA so widely used, and what are its flaws?":{"a":"**Why it's used:** EBITDA, earnings before interest, taxes, depreciation and amortization, is a rough proxy for operating cash flow that isn't affected by how a company is financed, its tax situation or its depreciation policies, so it makes companies easier to compare. It pairs with enterprise value in EV/EBITDA, and lenders use it in leverage ratios like debt to EBITDA.\n\n**Its flaws:**\n- It ignores capital expenditures, which can be huge for capital-intensive businesses. Warren Buffett once asked whether management thinks \"the tooth fairy pays for capital expenditures.\"\n- It ignores changes in working capital.\n- It ignores interest and taxes, which are real cash costs.\n- \"Adjusted EBITDA\" often strips out recurring costs like stock-based compensation or \"one-time\" restructuring charges, which can flatter results.\n- It isn't defined under GAAP, so companies calculate it differently.","f":"For what kind of company would EBITDA be most misleading?"},"A company writes down $50 of inventory. Walk me through the statements with a 25% tax rate.":{"a":"**Income statement:** the write-down is an expense, often recorded in cost of goods sold, so pre-tax income falls $50. Taxes fall $12.50, so net income falls $37.50.\n\n**Cash flow statement:** net income is down $37.50, but the write-down is non-cash, so you add back $50. Cash from operations rises $12.50, from the tax saving.\n\n**Balance sheet:** cash rises $12.50 and inventory falls $50, so assets fall $37.50. Retained earnings fall $37.50 with net income, so it balances.\n\nIt follows the same pattern as an increase in depreciation: a non-cash expense that saves taxes.","f":"Why would a company write down inventory, and what might it signal to investors?"},"What is deferred revenue, and why might a fast-growing subscription company have a lot of it?":{"a":"**Deferred revenue** is cash a company has collected for products or services it hasn't delivered yet. It's a liability, because the company still owes the customer the service, and it turns into revenue as the service is delivered.\n\nExample: a software company bills a customer $1,200 upfront for a one-year subscription. It gets the cash on day one, records $1,200 of deferred revenue, and recognizes $100 of revenue each month.\n\nA fast-growing subscription company builds up a lot of it because it keeps signing new annual contracts that are paid upfront, so cash arrives ahead of revenue. That's a strong position: customers are effectively financing the business, so cash flow can run well ahead of reported profit. A growing deferred revenue balance is also a sign of revenue already locked in for the future.","f":"How does an increase in deferred revenue show up on the cash flow statement?"},"Walk me through a DCF.":{"a":"A DCF values a company based on the present value of its future cash flows.\n\n1. **Project unlevered free cash flow** for five to ten years: revenue growth and margins to get operating income, then subtract taxes, add back depreciation, and subtract capital expenditures and the investment in working capital.\n2. **Calculate a terminal value** for the years after that, using the perpetuity growth method or an exit multiple of EBITDA.\n3. **Discount** the cash flows and the terminal value back to today at the weighted average cost of capital (WACC), with the cost of equity from CAPM and the after-tax cost of debt.\n4. **Add them up** to get enterprise value.\n5. **Bridge to equity value** by subtracting net debt and other claims, then divide by diluted shares for an implied share price.\n6. **Run sensitivity tables** on the discount rate and the terminal value assumptions.\n\nAim to say it in under 60 seconds.","f":"What happens to the valuation if interest rates rise?"},"What's the difference between equity value and enterprise value?":{"a":"**Equity value** is the value of a company's shares: the share price times diluted shares outstanding, the part that belongs to shareholders. **Enterprise value** is the value of the company's core operations to all of its capital providers: equity value plus debt, preferred stock and noncontrolling interests, minus cash.\n\nThink of a house worth $500,000 with a $400,000 mortgage: the owner's equity is $100,000, but the house itself is worth $500,000. We use enterprise value to compare companies with different amounts of debt, and we pair it with metrics that belong to all investors, like revenue or EBITDA. Equity value pairs with metrics that belong only to shareholders, like net income.","f":"Can enterprise value be lower than equity value?"},"Why do you add debt and subtract cash to get from equity value to enterprise value?":{"a":"Enterprise value is the value of the core business to everyone with a claim on it. If you bought the whole company, you'd pay the shareholders the equity value, but you'd also have to take on or repay its debt, so you add debt, along with other investor claims like preferred stock and noncontrolling interests.\n\nYou subtract cash because it isn't part of the operating business, and you'd get it along with the company: you could use it to pay down the debt, so it reduces your real cost. That's also why enterprise value doesn't change when a company borrows money and holds it as cash: debt and cash rise by the same amount.","f":"A company borrows $100 and holds it as cash. What happens to enterprise value?"},"What are the main ways to value a company, and which usually gives the highest value?":{"a":"There are three main methods, plus a couple used in specific situations:\n\n- **Comparable companies (comps):** apply the multiples that similar public companies trade at.\n- **Precedent transactions:** apply the multiples paid in past acquisitions of similar companies.\n- **Discounted cash flow (DCF):** the present value of projected free cash flows plus a terminal value.\n- **LBO analysis:** what a private equity firm could pay and still earn its target return; it often sets a floor.\n- **Sum of the parts:** valuing each division separately, for companies with distinct businesses.\n\n**Precedent transactions usually give the highest value**, because buyers pay a control premium, often 20% to 40% over the share price, for control and synergies. A DCF can come out higher or lower depending on its assumptions, and it usually has the widest range. Comps reflect today's market prices, with no premium. Bankers show the methods side by side in a \"football field\" chart.","f":"Why might a DCF give a very different value from comps?"},"How do you calculate WACC, and why is the cost of equity usually higher than the cost of debt?":{"a":"WACC is the weighted average of what each type of investor requires: the cost of equity times equity's share of total capital, plus the after-tax cost of debt times debt's share, using market values for the weights.\n\nThe cost of equity usually comes from CAPM: the risk-free rate, typically the 10-year Treasury yield, plus beta times the equity risk premium. The cost of debt is what the company pays to borrow, multiplied by one minus the tax rate, because interest is tax-deductible. Example: a 10% cost of equity, a 4.5% after-tax cost of debt and a 70/30 mix give a WACC of 8.35%.\n\nEquity costs more than debt because shareholders are paid last and have no guaranteed return, so they demand more, and the tax deduction makes debt cheaper still. That's also why adding debt lowers WACC only up to a point: past that, lenders and shareholders both see more risk and raise their required returns.","f":"What happens to WACC as a company takes on more debt?"},"What's the difference between levered and unlevered free cash flow, and which discount rate goes with each?":{"a":"**Unlevered free cash flow** is the cash the business generates before any payments to lenders: EBIT × (1 − tax rate) + depreciation and amortization − capital expenditures − the increase in working capital. It belongs to all capital providers, so you discount it at **WACC**, and the result is **enterprise value**.\n\n**Levered free cash flow** is what's left for shareholders after interest and required debt repayments: start from net income, which is already after interest, add back depreciation, subtract capital expenditures and the working capital investment, and subtract mandatory debt repayments. It belongs to shareholders, so you discount it at the **cost of equity**, and the result is **equity value**.\n\nThe rule: match the cash flow to the investors it belongs to, and the discount rate to what those investors require. Unlevered DCFs are more common because they don't depend on how the company happens to be financed.","f":"Why do bankers usually use unlevered free cash flow?"},"How would you value a company that has no earnings yet?":{"a":"Use measures that exist before profits do, and anchor on where the business is heading:\n\n- **Revenue multiples:** EV/Revenue or EV/gross profit against comparable companies, adjusted for growth; for software, recurring revenue.\n- **Operating metrics:** value per user, subscriber or customer, if peers trade on those.\n- **A DCF with a longer projection period:** project until margins mature, often ten years, then add a terminal value, with heavy sensitivity analysis, since most of the value is far in the future.\n- **Precedent transactions and recent funding rounds** in the same space.\n- **The venture capital method:** estimate what the company could sell for in five to seven years, then discount that back at a high target return, like 30% to 50%.\n\nAlso look at unit economics, like what it costs to win a customer compared with what that customer is worth over time, and at cash runway, since a company with no earnings has to fund itself until it gets there.","f":"Which of those methods would you trust most for an early-stage software company, and why?"},"What is terminal value, and what are the two ways to calculate it?":{"a":"Terminal value captures the value of all the cash flows after the projection period, since a company doesn't stop operating after five or ten years.\n\n- **Perpetuity growth method:** take the final year's free cash flow, grow it one more year at a long-term growth rate, and divide by the discount rate minus that growth rate. The growth rate should be modest, usually 2% to 3%, below long-run economic growth.\n- **Exit multiple method:** apply a multiple, like EV/EBITDA from comparable companies, to the final year's EBITDA.\n\nEither way, you then discount the terminal value back to today. It often makes up well over half of a DCF's value, so analysts cross-check the two methods (what multiple does the perpetuity value imply?) and run sensitivity tables on the growth rate, the multiple and the discount rate.","f":"Which method do you prefer, and how do you sanity-check the result?"},"Walk me through a basic LBO.":{"a":"In a leveraged buyout, a private equity firm buys a company using a large amount of borrowed money, often half or more of the price, plus its own equity, then aims to sell it in three to seven years.\n\n1. **Purchase:** set the price, usually as a multiple of EBITDA, and the sources and uses of funds: debt, the sponsor's equity and fees.\n2. **Projections:** project revenue, EBITDA and free cash flow over the holding period.\n3. **Debt paydown:** use the free cash flow to pay interest and repay debt each year.\n4. **Exit:** assume a sale, typically at an EBITDA multiple, to get the enterprise value at exit, then subtract the remaining net debt to get the equity value.\n5. **Returns:** compare the exit equity with the equity invested to get the multiple of money (MOIC) and the IRR. Firms often target IRRs of 20% or more, or roughly 2.5 times their money over five years.\n\nReturns come from three places: EBITDA growth, debt paydown and a higher exit multiple. The debt magnifies the return on the equity, in both directions.","f":"Why does using more debt increase the returns, and what's the risk?"},"What makes a company a good LBO candidate?":{"a":"A good LBO candidate can carry a lot of debt safely and grow its equity value:\n\n- **Stable, predictable cash flows** to pay interest and repay debt\n- **Low capital expenditure needs** and modest working capital requirements, so cash is free for debt payments\n- **A strong market position** with steady demand, often in a mature industry\n- **Little existing debt**, and ideally assets that can serve as collateral\n- **Room to improve:** cutting costs, raising margins or buying smaller competitors\n- **A strong management team**\n- **A sensible purchase price** and a realistic exit: a sale to a company, another firm or an IPO\n\nA fast-growing startup burning cash is usually a poor candidate; a steady business services company with recurring revenue is a classic one.","f":"Would a cyclical company, like an automaker, be a good LBO candidate? Why or why not?"},"A company with a P/E of 20 buys a company with a P/E of 10 using all stock. Is the deal accretive or dilutive, and why?":{"a":"**Accretive**, ignoring any premium, fees and synergies. In an all-stock deal, the buyer pays with its own shares, and the \"cost\" of those shares is its earnings yield: 1 ÷ 20 = 5%. It's buying earnings at an earnings yield of 1 ÷ 10 = 10%. Since it's buying earnings more cheaply than the earnings each new share gives up, earnings per share rise.\n\nQuick proof: the buyer has 100 shares at $20 and $100 of earnings (EPS of $1, P/E of 20). The target has $50 of earnings and is worth $500 (P/E of 10). The buyer issues 25 shares ($500 ÷ $20). New EPS = $150 ÷ 125 shares = $1.20, up 20%.\n\nRule of thumb: in an all-stock deal, if the buyer's P/E is higher than the P/E it pays for the target, the deal is accretive. In practice, the premium, fees and synergies all change the answer.","f":"What if the buyer paid a 50% premium?"},"Why do acquirers usually pay a premium over the current share price?":{"a":"Because they're buying **control**, and shareholders won't sell for less than they could get in the market.\n\n- **Control:** owning 100% lets the buyer change the strategy, management, capital structure and how cash is used, which is worth more than a minority stake.\n- **Synergies:** cost savings or extra revenue from combining the businesses, part of which the buyer shares with the seller to win the deal.\n- **Persuasion:** the price has to beat what shareholders and the board think the stock is worth on its own, and fend off rival bidders.\n\nPremiums of roughly 20% to 40% over the undisturbed share price are common, which is why precedent transactions usually imply higher values than trading comps. The risk is overpaying: if the synergies don't show up, the premium destroys value for the buyer's shareholders.","f":"How would you decide how much of the expected synergies to pay away in the premium?"},"What are the limits of the P/E ratio?":{"a":"- **Useless when earnings are negative or tiny,** which rules out many young companies and cyclical ones at the bottom of their cycle.\n- **Distorted by capital structure:** net income is after interest, so two identical businesses with different amounts of debt have different P/Es. EV/EBITDA avoids that.\n- **Affected by accounting choices and one-time items,** like write-downs, gains on asset sales, tax quirks and depreciation policies.\n- **Says nothing about growth or risk on its own:** a high P/E can be cheap if growth is fast. The PEG ratio, P/E divided by growth, tries to adjust for that.\n- **Misleading for cyclical companies:** they often look cheapest on P/E at the peak of the cycle, just before earnings fall.\n- **Ignores cash flow:** earnings aren't cash, especially with heavy capital spending or working capital needs.\n\nThat's why analysts use it alongside EV/EBITDA, free cash flow yield and a DCF.","f":"When would P/E be the best multiple to use?"},"Company A trades at 10x EBITDA and Company B at 15x. What could explain the gap?":{"a":"A higher multiple means investors expect more or worry less. Company B might have:\n\n- **Faster expected growth** in revenue and earnings\n- **Higher or more stable margins,** or more recurring revenue\n- **Better returns on capital and lower capital spending needs,** so more of its EBITDA becomes free cash flow\n- **Lower risk:** less cyclical demand, less debt, a stronger competitive position or management\n- **A different business mix,** with part of it in a more highly valued segment\n\nOr the gap could be temporary: A's EBITDA might be inflated by a one-time boost, or B's temporarily depressed, or B might be the subject of takeover talk or simply in fashion.\n\nTo check, compare growth forecasts, margins, capital spending relative to EBITDA, debt and free cash flow conversion. If the gap isn't justified, that's a potential investment idea.","f":"How would you decide whether A is a bargain or deserves the lower multiple?"},"If interest rates rise, what happens to a DCF valuation, and why?":{"a":"The valuation usually **falls**. Higher rates raise the risk-free rate, which raises the cost of equity through CAPM, and they raise the cost of debt, so WACC rises. Future cash flows are discounted more heavily, and the terminal value falls the most, because it's furthest away and very sensitive to the gap between WACC and the growth rate.\n\nCompanies whose value lies far in the future, like high-growth technology companies, are hit hardest, which is a big part of why growth stocks fell so sharply in 2022. A complete answer adds the second-order effects: higher rates can slow the economy and cut the cash flow projections themselves, raise interest costs and lower exit multiples. The partial offset: if rates rise because growth and inflation are strong, nominal cash flows may grow faster too.","f":"Which companies would be hurt most, and which might benefit?"},"Paper LBO: you buy a company with $100M of EBITDA at 10x using 60% debt. Five years later EBITDA is $150M, you exit at 10x, and $200M of debt has been paid down. What are the MOIC and the rough IRR?":{"a":"**Entry:** 10 × $100M = a $1,000M purchase price, funded with $600M of debt and $400M of equity.\n\n**Exit:** 10 × $150M = $1,500M of enterprise value. Debt is down to $600M − $200M = $400M, so the equity is worth $1,500M − $400M = $1,100M.\n\n**MOIC:** $1,100M ÷ $400M = **2.75x**.\n\n**IRR:** about **22%**. Shortcut: over five years, 2x is roughly 15%, 2.5x roughly 20% and 3x roughly 25%, so 2.75x lands around 22% to 23%. (Exactly, 2.75 to the power of 1/5, minus 1, is about 22.4%.)\n\nWhere the return came from: EBITDA growth added $500M of value and debt paydown $200M, with no help from the multiple. This ignores fees and any cash paid out along the way.","f":"What's the IRR if you exit at 9x instead?"},"What's going on in the markets right now?":{"a":"**Keep a 60-second answer ready and update it every week.** Build it around three things: what the Fed and interest rates are doing, what inflation and the job market show, and how stocks and bonds have moved, plus one story you can go deeper on.\n\n**Structure:** \"The big story is [the Fed and rates]: the target range is [X], and markets expect [the next move]. That's because [the latest inflation or jobs data]. Stocks are [up or down X% this year], led by [a sector or theme], and the 10-year Treasury yields about [X%]. What I'm watching most closely is [one theme], because [why it matters for this firm or role].\"\n\nKnow these before every interview: the S&P 500's level and year-to-date move, the 10-year Treasury yield, the fed funds target range, the latest CPI reading, and one or two current deals or earnings stories. Then have an opinion, and know the other side of it.","f":"What's one thing the market might be getting wrong right now?"},"How do interest rates affect stock prices?":{"a":"Higher rates hurt stock prices through three channels.\n\n1. **Valuation:** interest rates are the base of the discount rate, so when they rise, future profits are worth less today. Companies whose profits are far in the future, like high-growth tech, get hit hardest.\n2. **Competition:** when safe Treasuries pay more, investors demand a higher expected return from stocks, and prices fall until they offer it.\n3. **The economy:** higher borrowing costs slow consumer spending and business investment and raise companies' interest expense, which cuts into earnings.\n\nBut it depends on why rates are moving and what was expected. If rates rise because growth is strong, stocks can still do fine, and markets react to the expected path of rates more than to any single decision. Banks can even benefit, while utilities and real estate, which behave like bonds, usually suffer.","f":"Why did growth stocks fall so much more than value stocks in 2022?"},"What's the relationship between bond prices and yields? Explain it with an example.":{"a":"They move in opposite directions, because a bond's payments are fixed. If I own a bond with a 4% coupon, paying $40 a year on $1,000, and market rates rise to 5%, new buyers can get 5% on newly issued bonds. They'll only buy mine at a discount, low enough that the fixed $40 a year plus the gain back to $1,000 adds up to a 5% return. For a 10-year bond, that's a price of about $923. If rates fall to 3%, the reverse happens, and the same bond is worth about $1,085.\n\nThe effect is bigger for longer bonds, because more of their cash flows are far in the future. That's what duration measures: a bond with a duration of about 8 loses roughly 8% of its value for a one-point rise in rates.","f":"If you expect rates to fall, would you rather own a 2-year or a 30-year bond?"},"What does an inverted yield curve signal, and how reliable has that signal been?":{"a":"The yield curve plots Treasury yields across maturities. Normally it slopes upward, because investors want extra yield for lending for longer. It inverts when short-term yields rise above long-term ones, which usually happens when the Fed has raised short-term rates to fight inflation while investors expect growth to slow and rates to come down later.\n\n**What it signals:** markets expect the Fed to cut, usually because of a slowdown, and it squeezes banks, which borrow short and lend long, so credit can tighten.\n\n**How reliable:** before 2022, an inversion had come before every U.S. recession since the 1950s, with one false alarm in the mid-1960s, usually six months to two years ahead. But it's a signal, not a cause or a timer. The 10-year minus 2-year spread inverted in July 2022 and stayed inverted for about two years, yet the economy kept growing through 2023 and 2024. Some blame pandemic-era distortions and the Fed's bond buying; others note that recessions often begin after the curve turns positive again.","f":"Why might the signal have failed, or been delayed, this time?"},"What does the Fed do, and how does a rate cut ripple through markets?":{"a":"The Federal Reserve is the U.S. central bank, with a dual mandate from Congress: maximum employment and stable prices, which it defines as 2% inflation. Its main tool is the federal funds rate, which the FOMC sets as a target range at eight meetings a year. It can also buy or shrink its holdings of bonds and use forward guidance.\n\n**When it cuts:**\n- Short-term rates fall right away: Treasury bills, savings accounts, credit cards and floating-rate loans.\n- Longer-term rates often fall too, if markets expect more cuts, lowering mortgage and corporate borrowing costs.\n- Stocks often rise, because future cash flows are worth more and borrowing is cheaper, especially growth stocks and rate-sensitive sectors like real estate.\n- The dollar tends to weaken.\n- Over time, cheaper credit supports spending, hiring and investment.\n\nThe caveat: markets move on expectations. A cut that's already priced in may do little, and a cut paired with a signal of fewer cuts ahead can send stocks down, as on December 18, 2024.","f":"Why might the 10-year Treasury yield rise even after the Fed cuts?"},"If inflation comes in hotter than expected, what happens to stocks, bonds and the dollar?":{"a":"The typical first reaction:\n\n- **Bonds fall and yields rise,** especially short-term yields, because markets expect the Fed to keep rates higher for longer, or even raise them.\n- **Stocks fall,** because higher expected rates raise discount rates and threaten growth. Growth and tech stocks and rate-sensitive sectors usually fall most, while energy and commodity producers may hold up better.\n- **The dollar rises,** because higher expected U.S. interest rates attract money from abroad.\n\nThe key word is *expected*: markets react to the surprise compared with forecasts, not the level itself. The details matter too. A hot number driven by volatile items may be shrugged off, while hot core or services inflation worries the Fed more. In 2022, repeated inflation surprises drove stocks and bonds down together.","f":"Which assets might do well if inflation stays high for years?"},"Where do you think the S&P 500 will be in a year, and why?":{"a":"**Nobody expects you to be right; they want a reasoned view built on a framework.** Use earnings and the multiple: price = expected earnings × P/E.\n\n**Structure:** \"Analysts expect S&P 500 earnings of about $[X] over the next 12 months, and the index trades at about [Y] times that, compared with a 10-year average of about 19. I think earnings growth of about [X%] is reasonable because [the main driver]. If the multiple holds, that points to roughly [level], about [X%] higher. The upside case is [lower rates or stronger growth]; the downside is [a recession cutting earnings, or higher rates squeezing the multiple]. So I'd say [a range], leaning [direction].\"\n\nNumbers to know: the index level, the forward P/E (FactSet's weekly Earnings Insight report has it), expected earnings growth and the 10-year Treasury yield. Give a range, explain the drivers and the risks, and commit to a view.","f":"What's the biggest risk to that view?"},"Why does the 10-year Treasury yield matter so much?":{"a":"It's the benchmark long-term interest rate for the whole economy.\n\n- **Borrowing costs:** 30-year mortgage rates track it closely, and corporate bonds are priced as a spread over Treasuries.\n- **Valuation:** it's the usual risk-free rate in the cost of equity and WACC, so it sets the starting point for discount rates. When it rises, the present value of future cash flows falls.\n- **Signals:** it reflects markets' expectations for growth, inflation and Fed policy, and its gap with the 2-year yield is the slope of the yield curve.\n- **Global money flows:** it's the reference rate for the world's largest bond market, so it moves the dollar and markets abroad.\n\nUnlike the fed funds rate, the Fed doesn't set it; markets do. Know its level before any interview.","f":"Why might the 10-year yield rise even while the Fed is cutting rates?"},"What would make you worried about a recession right now?":{"a":"**Name the indicators you'd watch and the readings that would worry you, then apply them to today.**\n\n- **Jobs:** unemployment rising quickly (the Sahm rule flags a rise of half a point in the three-month average from its low of the past year), falling payrolls, rising weekly jobless claims\n- **The yield curve:** an inversion, and especially the curve steepening again as the Fed starts cutting quickly\n- **Consumers:** falling real incomes, rising credit card and auto loan delinquencies, weaker spending\n- **Businesses:** purchasing managers' surveys below 50, weaker investment plans, falling earnings estimates\n- **Credit markets:** widening high-yield spreads, banks tightening lending standards\n- **Shocks:** an oil price spike, a financial accident or a policy shock\n\nThen say which are flashing now and which aren't, and give your view. That shows judgment rather than a memorized list.","f":"Which single indicator would you trust most, and why?"},"How does a strong dollar affect a U.S. company that sells mostly overseas?":{"a":"It usually **hurts reported results.** The company earns revenue in euros, yen or other currencies, and when the dollar strengthens, each unit of foreign currency converts into fewer dollars. Reported revenue and earnings fall even if sales haven't changed in local currency. It can also hurt competitiveness: if the company makes products in the U.S. and prices them in dollars, they get more expensive for foreign customers.\n\nExample: a company sells €100 million of products in Europe. At $1.10 per euro, that's $110 million; if the dollar strengthens to $1.00 per euro, it's $100 million, a 9% drop in reported revenue with no change in the business.\n\nThe offsets: if many of its costs are also in foreign currencies, margins are partly protected, and many companies hedge their currency exposure. That's why companies report growth in \"constant currency,\" and analysts watch it to see the underlying trend.","f":"How could the company protect itself against currency swings?"},"Pitch me a stock.":{"a":"**A pitch is an argument, not a company profile.** In about two minutes:\n\n1. **Recommendation:** buy or sell, today's price, your price target and the time frame.\n2. **Thesis:** two or three reasons the market is mispricing it, ideally a view most investors don't share.\n3. **Catalysts:** events that will make the market see it, like an earnings report or a product launch.\n4. **Valuation:** how you got the target, usually a multiple of next year's earnings, checked against peers.\n5. **Risks:** what would prove you wrong, and the signal that would change your mind.\n\n**Sample, with an imaginary company:** \"I'd buy Harbor Fitness, a mid-sized gym chain at $40, with a 12-month target of about $52, roughly 30% upside. It trades at about 11 times next year's earnings, below peers at 15 to 17 times, because the market fears new locations will steal members from existing ones. I think that's wrong: new gyms are breaking even within 18 months, and a recent price increase stuck without members leaving. The catalyst is next quarter's report, when results for the newer locations become visible. At 15 times next year's earnings of $3.50, it's worth about $52. The main risks are a recess
