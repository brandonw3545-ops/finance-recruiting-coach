 is the Fed's target for overnight lending between banks; the 10-year yield is set by investors and reflects expectations for growth, inflation and rates over ten years.","Rewind":"A spark (a specific moment), a follow-through (what you did about it) and a fit (why the work of the seat suits you).","Brain teaser":"It ends 25% below where it started: 100 rises to 150, then falls 50% to 75."}},"car-how-finance-recruiting-works-clubs-timelines-ear":{"title":"How finance recruiting works: clubs, timelines, early programs and superdays","cat":"car","slug":"how-finance-recruiting-works-clubs-timelines-early-programs","md":"# How finance recruiting works: clubs, timelines, early programs and superdays\n*Comes up in:* Every recruiting conversation, as \"Where are you in the process?\" and \"What else are you applying to?\" Timing is where most students lose out.\n\n## Cold open\n\"Walk me through where you are in recruiting and what you're applying to.\"\n\nAnswer it out loud before you read on.\n\n## The big idea\nFinance recruiting runs earlier than almost any other field. At many large banks, the junior-year summer internship, which is the main route to a full-time offer, gets filled more than a year before it starts. So freshman and sophomore years are when you build what you'll be judged on: club experience, technical skills, a network and good stories. It's like a sports season where tryouts happen a year before the first game.\n\n## How it works\nHere's the typical path for investment banking. Other seats are similar but often later, and every firm is different.\n\n| When | What happens | What to do |\n|---|---|---|\n| Freshman fall | Finance clubs recruit, often with applications and interviews | Get into one or two clubs and start learning technicals |\n| Freshman spring to sophomore fall | Early insight, discovery and sophomore programs open | Apply widely and start talking to alumni |\n| Sophomore winter to spring | Junior-summer applications open at many large banks | Be interview-ready on fit and technicals |\n| Junior summer | The internship itself | Perform well and earn the return offer |\n\nA typical process has five stages: an application (resume, sometimes a cover letter), an online test or recorded video interview, a first round of about 30 minutes with fit and technical questions, a **superday** of three to six back-to-back interviews, and an offer, often with a short deadline to accept.\n\n## In the real world\nThe calendar has moved earlier over the past decade, which people call recruiting creep. In recent cycles, several of the largest banks opened junior-summer internship applications in the winter or early spring of sophomore year, roughly 15 to 18 months before the internship started. Private equity firms have also pulled their own recruiting earlier, which pushes banks to lock in analysts sooner. The exact dates change every year, so put your career center's calendar and the careers pages of your target firms on a weekly check, and set alerts where firms offer them.\n\n## The interview trap\nThe trap is either not knowing your own timeline or sounding scattered, applying to everything with no focus. Interviewers want to see a plan.\n\n> I'm a sophomore focused on asset and wealth management. Right now I'm applying to sophomore and early insight programs at a few firms, and I'm getting ready for junior-summer applications, which open as early as this winter at some banks. In parallel, I'm on the research team of my school's investment club, where I've pitched two stocks, and I've had coffee chats with five alumni to learn how the seat works at different firms. My goal is to be fully interview-ready on technicals by early next year, so I'm working through accounting and valuation now.\n\n## Your line\n\"In finance, the calendar is a skill: the students who land offers usually started a year earlier than they thought they needed to.\" **Follow-up you'll get:** \"What other industries are you recruiting for?\" Be honest, but make finance your clear focus. **The other side:** Some seats, including wealth management, corporate finance and many smaller firms, hire on a normal timeline, so a late start isn't fatal.\n\n## Your turn\n1. **Say it out loud:** Answer \"Where are you in recruiting?\" for yourself in 45 seconds.\n2. **Rapid fire:**\n   a. What's a superday?\n   b. What's usually the main route to a full-time offer at a bank?\n   c. Name two things you can do as a freshman that recruiters will notice later.\n3. **Rewind:** What are the four steps of a 60-second markets answer?\n4. **Brain teaser:** How many gas stations are there in the United States? Walk through an estimate.\n\n## Answers\n- **Say it out loud:** A strong answer gives your class year and target seat, what you're applying to now and when the next windows open, concrete preparation (a club role, technical study, a number of alumni conversations), and sounds calm and specific.\n- **a.** The final round: several back-to-back interviews in one day, usually three to six, mixing fit and technical questions.\n- **b.** A return offer after the junior-year summer internship.\n- **c.** Any two of: getting into and contributing to a finance club, an early insight program, a relevant job or project, steady technical study, and real conversations with alumni.\n- **Rewind:** The theme, the driver with numbers, the implication for prices, and what you're watching next with your view.\n- **Brain teaser:** One path: about 250 million vehicles, each filling up about once a week, is about 35 million fill-ups a day. If a station handles about 250 fill-ups a day, that's roughly 140,000 stations. The commonly cited figure is around 145,000 to 150,000, but the clear logic matters more than the exact number.\n","answers":{"Cold open":"I'm a sophomore focused on asset and wealth management. Right now I'm applying to sophomore and early insight programs at a few firms, and I'm getting ready for junior-summer applications, which open as early as this winter at some banks. In parallel, I'm on the research team of my school's investment club, where I've pitched two stocks, and I've had coffee chats with five alumni to learn how the seat works at different firms. My goal is to be fully interview-ready on technicals by early next year, so I'm working through accounting and valuation now.","Say it out loud":"A strong answer gives your class year and target seat, what you're applying to now and when the next windows open, concrete preparation (a club role, technical study, a number of alumni conversations), and sounds calm and specific.","Rapid fire a":"The final round: several back-to-back interviews in one day, usually three to six, mixing fit and technical questions.","Rapid fire b":"A return offer after the junior-year summer internship.","Rapid fire c":"Any two of: getting into and contributing to a finance club, an early insight program, a relevant job or project, steady technical study, and real conversations with alumni.","Rewind":"The theme, the driver with numbers, the implication for prices, and what you're watching next with your view.","Brain teaser":"One path: about 250 million vehicles, each filling up about once a week, is about 35 million fill-ups a day. If a station handles about 250 fill-ups a day, that's roughly 140,000 stations. The commonly cited figure is around 145,000 to 150,000, but the clear logic matters more than the exact number."}},"car-investment-banking-what-bankers-do-and-bulge-bra":{"title":"Investment banking: what bankers do, and bulge brackets vs. elite boutiques vs. middle market","cat":"car","slug":"investment-banking-what-bankers-do-and-bulge-brackets-vs","md":"# Investment banking: what bankers do, and bulge brackets vs. elite boutiques vs. middle market\n*Comes up in:* Every banking interview (\"Why banking?\", \"Why a boutique over a bulge bracket?\") and useful context for any seat.\n\n## Cold open\n\"What does an investment banker actually do?\"\n\nAnswer it out loud before you read on.\n\n## The big idea\nInvestment bankers advise companies, and sometimes governments and investment funds, on their biggest financial decisions. They help clients buy or sell businesses, which is mergers and acquisitions (M&A), and they help them raise money by selling stock or bonds to investors, which is capital markets. Think of a real estate agent and a mortgage broker rolled into one, except the property is an entire company.\n\n## How it works\nBanks are split into **industry groups** (healthcare, technology, financial institutions and so on) and **product groups** (M&A, equity capital markets, debt capital markets, leveraged finance, restructuring). A deal moves through roughly the same steps: pitch the client, get hired, do due diligence, build the valuation and models, market the deal to buyers or investors, and close.\n\nAs an analyst, you'd build the financial models and valuation work (comparable companies, discounted cash flow, precedent transactions), make the pitch books, and keep the deal organized. Associates check and manage that work; vice presidents and managing directors run the client relationships. Banks are paid fees, mostly when a deal closes: an advisory fee on M&A, and an underwriting fee on stock and bond offerings.\n\n| Type | Examples | What sets them apart |\n|---|---|---|\n| Bulge bracket | Goldman Sachs, Morgan Stanley, JPMorgan, Bank of America, Citi | Full service and global: advisory, capital markets, trading and lending |\n| Elite boutique | Evercore, Lazard, Centerview, PJT Partners, Moelis | Advisory only, senior-led teams, many large M&A and restructuring deals, no lending |\n| Middle market | Houlihan Lokey, William Blair, Baird, Harris Williams | Smaller deals, often selling privately owned companies |\n\nThe typical path: a two-year analyst program, then promotion to associate or a move to private equity, a hedge fund, corporate development or growth investing.\n\n## In the real world\nWhen Microsoft agreed to buy Activision Blizzard for about $69 billion in January 2022, the press release listed the advisers: Goldman Sachs advised Microsoft, and Allen & Company, a boutique known for media and technology deals, advised Activision. The deal didn't close until October 2023, after months of antitrust review in the U.S., the U.K. and Europe, which is a reminder that a signed deal isn't a closed deal and that bankers often wait many months to be paid. To follow banking today, read deal announcements, which name the advisers, and check the quarterly M&A league tables.\n\n## The interview trap\nThe trap is saying bankers \"invest money\" or \"pick stocks.\" They don't; they advise and raise capital. The second trap is trashing a type of bank to flatter the one interviewing you.\n\n> Investment bankers advise companies on their biggest financial decisions and help them raise capital. On the advisory side, that's mergers and acquisitions: helping a company buy another business or sell itself, which means valuing it, running the process and negotiating. On the capital markets side, banks help companies raise money by issuing stock, as in an IPO, or bonds, and they find the investors to buy them. As an analyst, you'd build the models and valuation work behind those decisions, like comparable companies and DCFs, and put together the materials clients see. Banks are mostly paid fees when deals close, which is why the job is so deal-driven and the hours follow the deals.\n\n## Your line\n\"Bulge brackets win on breadth and balance sheet; elite boutiques win on senior attention and independence.\" **Follow-up you'll get:** \"So why do you want to start at a boutique, or at a bulge bracket?\" **The other side:** Boutique analysts often get more responsibility on each deal, while bulge bracket analysts see more products and build a bigger network.\n\n## Your turn\n1. **Say it out loud:** Explain the difference between a bulge bracket and an elite boutique, and say which you'd rather start at and why.\n2. **Rapid fire:**\n   a. What's the difference between ECM and DCM?\n   b. When does a bank usually get paid an M&A advisory fee?\n   c. Name two common next steps after a banking analyst program.\n3. **Rewind:** Is investment banking on the buy side or the sell side, and how does it get paid?\n4. **Brain teaser:** What's the sum of the whole numbers from 1 to 100?\n\n## Answers\n- **Say it out loud:** A strong answer says bulge brackets are full-service global banks with lending, trading and every product, while elite boutiques focus on advisory with senior-led teams and no lending; then gives an honest preference tied to what you want to learn, without trashing either.\n- **a.** Equity capital markets helps companies raise money by selling stock, such as IPOs; debt capital markets helps them raise money by issuing bonds.\n- **b.** Mostly when the deal closes, as a success fee, sometimes with a smaller retainer along the way.\n- **c.** Any two of: private equity, hedge funds, corporate development, growth equity or venture capital, or promotion to associate.\n- **Rewind:** The sell side; it earns advisory and underwriting fees on deals.\n- **Brain teaser:** 5,050. Pair 1 with 100, 2 with 99 and so on: 50 pairs that each sum to 101.\n","answers":{"Cold open":"Investment bankers advise companies on their biggest financial decisions and help them raise capital. On the advisory side, that's mergers and acquisitions: helping a company buy another business or sell itself, which means valuing it, running the process and negotiating. On the capital markets side, banks help companies raise money by issuing stock, as in an IPO, or bonds, and they find the investors to buy them. As an analyst, you'd build the models and valuation work behind those decisions, like comparable companies and DCFs, and put together the materials clients see. Banks are mostly paid fees when deals close, which is why the job is so deal-driven and the hours follow the deals.","Say it out loud":"A strong answer says bulge brackets are full-service global banks with lending, trading and every product, while elite boutiques focus on advisory with senior-led teams and no lending; then gives an honest preference tied to what you want to learn, without trashing either.","Rapid fire a":"Equity capital markets helps companies raise money by selling stock, such as IPOs; debt capital markets helps them raise money by issuing bonds.","Rapid fire b":"Mostly when the deal closes, as a success fee, sometimes with a smaller retainer along the way.","Rapid fire c":"Any two of: private equity, hedge funds, corporate development, growth equity or venture capital, or promotion to associate.","Rewind":"The sell side; it earns advisory and underwriting fees on deals.","Brain teaser":"5,050. Pair 1 with 100, 2 with 99 and so on: 50 pairs that each sum to 101."}},"car-telling-stories-that-prove-it-the-star-method-an":{"title":"Telling stories that prove it: the STAR method and your story bank","cat":"car","slug":"telling-stories-that-prove-it-the-star-method-and-your","md":"# Telling stories that prove it: the STAR method and your story bank\n*Comes up in:* Every behavioral question (\"Tell me about a time...\") in every seat, usually one to three per interview.\n\n## Cold open\n\"Tell me about a time you led a team through a challenge.\"\n\nAnswer it out loud before you read on.\n\n## The big idea\nA behavioral question is a request for evidence: prove you have this trait. **STAR** keeps the proof tight: Situation, Task, Action, Result. A **story bank** of six to eight prepared stories lets you answer almost any behavioral question by picking the right story instead of inventing one on the spot. Think of it as a deck of cards you deal from, rather than a hand you have to make up every time.\n\n## How it works\nGive each part of STAR a time budget, about 60 to 90 seconds in total.\n\n| Part | What it covers | Time |\n|---|---|---|\n| Situation | The context, in one or two sentences | About 10 seconds |\n| Task | Your responsibility or the goal | About 10 seconds |\n| Action | What you did, with \"I\" not \"we,\" in two or three specific steps | About 40 seconds |\n| Result | The outcome with a number, plus what you learned | About 15 seconds |\n\nTo build the bank, list your stories down the side of a page and common themes across the top: leadership, teamwork, conflict, failure, pressure, initiative, persuasion and attention to detail. Check the boxes each story covers. A good story covers two or three themes, and every theme should have at least one story.\n\nHere's a fictional example. Situation: our investment club's pitch competition was two weeks away and our model had errors. Task: as team lead, I had to get us to a pitch we could defend. Action: I split the model into sections with an owner for each, set two check-ins, and rebuilt the revenue forecast myself with one teammate. Result: we placed second of twelve teams, and I learned to set check-ins early instead of assuming work was on track.\n\n## In the real world\nBig employers say outright that they want this structure. Amazon's interview guidance tells candidates to answer behavioral questions using the STAR method, and banks and consulting firms use the same kind of structured \"tell me about a time\" questions in first rounds and superdays. The format exists because interviewers compare candidates on the same traits, and specific stories are far easier to compare than general claims. Start your bank today: whenever something hard happens in a job, club or team, write three lines about it while you still remember the details.\n\n## The interview trap\nThe traps are spending most of the time on the situation, saying \"we\" so the interviewer can't tell what you did, and stopping without a result.\n\n> Our investment club's pitch competition was two weeks away, and our team's model had errors that would have sunk us in the Q&A. As team lead, my job was to get us to a pitch we could defend. I split the model into four sections with one owner each, set check-ins for day three and day eight so problems surfaced early, and rebuilt the revenue forecast myself with one teammate, since that's where most of the errors were. We fixed every issue a day before the deadline and placed second out of twelve teams. The lesson I took was to set check-ins at the start instead of assuming work is on track, and I've done that on every project since.\n\n## Your line\n\"A good behavioral answer spends most of its time on what I did, and ends with a number and a lesson.\" **Follow-up you'll get:** \"What would you do differently next time?\" **The other side:** Over-rehearsed STAR stories can sound robotic. Know the beats, not a script.\n\n## Your turn\n1. **Say it out loud:** Tell your best leadership story in STAR format in under 90 seconds.\n2. **Rapid fire:**\n   a. Which part of STAR should take the most time?\n   b. Why say \"I\" instead of \"we\"?\n   c. How many stories should a story bank have?\n3. **Rewind:** What should the last sentence of your \"tell me about yourself\" do?\n4. **Brain teaser:** What's the probability of rolling at least one six in two rolls of a fair die?\n\n## Answers\n- **Say it out loud:** A strong answer sets up the situation briefly, makes your personal role clear, describes specific actions in the first person, gives a measurable result and one honest lesson, and finishes in under 90 seconds.\n- **a.** The Action.\n- **b.** The interviewer is evaluating you, and \"we\" hides what you personally contributed.\n- **c.** About six to eight, each covering two or three themes.\n- **Rewind:** Say why this seat and firm are your logical next step, which hands the interview back to them.\n- **Brain teaser:** 11/36, or about 31%. The chance of no six in two rolls is (5/6)² = 25/36, so the chance of at least one is 1 − 25/36.\n","answers":{"Cold open":"Our investment club's pitch competition was two weeks away, and our team's model had errors that would have sunk us in the Q&A. As team lead, my job was to get us to a pitch we could defend. I split the model into four sections with one owner each, set check-ins for day three and day eight so problems surfaced early, and rebuilt the revenue forecast myself with one teammate, since that's where most of the errors were. We fixed every issue a day before the deadline and placed second out of twelve teams. The lesson I took was to set check-ins at the start instead of assuming work is on track, and I've done that on every project since.","Say it out loud":"A strong answer sets up the situation briefly, makes your personal role clear, describes specific actions in the first person, gives a measurable result and one honest lesson, and finishes in under 90 seconds.","Rapid fire a":"The Action.","Rapid fire b":"The interviewer is evaluating you, and \"we\" hides what you personally contributed.","Rapid fire c":"About six to eight, each covering two or three themes.","Rewind":"Say why this seat and firm are your logical next step, which hands the interview back to them.","Brain teaser":"11/36, or about 31%. The chance of no six in two rolls is (5/6)² = 25/36, so the chance of at least one is 1 − 25/36."}},"car-behaviorals-part-1-strengths-weaknesses-and-tell":{"title":"Behaviorals, part 1: strengths, weaknesses and \"tell me about a failure\"","cat":"car","slug":"behaviorals-part-1-strengths-weaknesses-and-tell-me-about-a","md":"# Behaviorals, part 1: strengths, weaknesses and \"tell me about a failure\"\n*Comes up in:* Most first rounds and superdays. \"Greatest weakness\" and \"tell me about a failure\" are among the most common questions in any interview.\n\n## Cold open\n\"What's your greatest weakness?\"\n\nAnswer it out loud before you read on.\n\n## The big idea\nThese questions test self-awareness and honesty, not perfection. A good weakness is real, relevant but not fatal to the job, and paired with what you're doing about it. A good failure story has a real miss, clear ownership and a change in how you work. Think of it as writing a scouting report on yourself: an honest view of what you do well and what you're working on.\n\n## How it works\n**Strengths:** pick two or three the job actually needs, such as attention to detail, work ethic, clear communication or analytical ability, and back each one with a short example.\n\n**Weakness formula:** name it, give an example of when it showed up, explain what you're doing about it, and show evidence it's improving. Avoid fatal weaknesses (\"I'm not great with numbers\" in a banking interview) and fake ones (\"I work too hard,\" \"I'm a perfectionist\").\n\n| Weakness | Why it works | How to show progress |\n|---|---|---|\n| Taking on too much myself instead of delegating | Real and common in strong students | \"Now I set owners and a mid-point check-in\" |\n| Speaking up in large groups | Real, and fixable | \"I prepare one point before every meeting\" |\n| Saying yes to too many commitments | Real | \"I keep a weekly priority list and say no earlier\" |\n\n**Failure formula:** use STAR, let the result be honestly negative, then add the lesson and what you did differently the next time. A failure where nothing actually went wrong is a humblebrag, and interviewers notice.\n\n## In the real world\nGreat investors talk openly about their mistakes. Warren Buffett has called buying Berkshire Hathaway itself, then a struggling textile company, one of his biggest mistakes; in a 2010 CNBC interview he estimated it had cost him about $200 billion compared with putting the money into a better business. He writes about errors in his annual letters too. The lesson for an interview: owning a real mistake and explaining what changed sounds stronger than claiming you've never made one. Reading a few years of Berkshire's shareholder letters is also good preparation for asset management interviews.\n\n## The interview trap\nThe trap is the fake weakness or the failure where nothing went wrong. Both tell the interviewer you either lack self-awareness or won't be straight with them.\n\n> I tend to take on too much myself instead of delegating. Last year, leading a group project for my investment club, I rewrote parts of other people's sections the night before because I didn't trust they'd be done, and I ended up exhausted while the team felt sidelined. Since then I set clear owners at the start and a check-in halfway through, and I give feedback early instead of redoing work. On our last pitch, I didn't touch anyone else's section and we finished a day early. It's still something I watch, but I've gotten much better at it.\n\n## Your line\n\"The point of a weakness answer is to show I notice my own patterns and fix them.\" **Follow-up you'll get:** \"How would that weakness show up in this job?\" **The other side:** Some interviewers prefer a skill gap, like Excel speed, over a personality trait, because training fixes it quickly.\n\n## Your turn\n1. **Say it out loud:** Answer \"Tell me about a time you failed\" in 60 to 90 seconds, including what you'd do differently.\n2. **Rapid fire:**\n   a. Why is \"I'm a perfectionist\" a weak answer?\n   b. What are the four parts of a good weakness answer?\n   c. Name one weakness you should never give in a banking interview.\n3. **Rewind:** What does each letter in STAR stand for?\n4. **Brain teaser:** What's the angle between the hands of a clock at 3:15?\n\n## Answers\n- **Say it out loud:** A strong answer describes a real failure with stakes, takes clear ownership with no blaming, says what you learned, and gives a later example of acting differently, in a calm tone.\n- **a.** Interviewers have heard it constantly, and it dodges the question instead of answering it.\n- **b.** Name it, give an example, explain what you're doing about it, and show evidence of progress.\n- **c.** Anything fatal to the job, such as poor attention to detail, discomfort with numbers or missing deadlines.\n- **Rewind:** Situation, Task, Action, Result.\n- **Brain teaser:** 7.5 degrees. At 3:15 the minute hand points at the 3 (90 degrees); the hour hand has moved a quarter of the way from 3 to 4, which is another 7.5 degrees, putting it at 97.5 degrees.\n","answers":{"Cold open":"I tend to take on too much myself instead of delegating. Last year, leading a group project for my investment club, I rewrote parts of other people's sections the night before because I didn't trust they'd be done, and I ended up exhausted while the team felt sidelined. Since then I set clear owners at the start and a check-in halfway through, and I give feedback early instead of redoing work. On our last pitch, I didn't touch anyone else's section and we finished a day early. It's still something I watch, but I've gotten much better at it.","Say it out loud":"A strong answer describes a real failure with stakes, takes clear ownership with no blaming, says what you learned, and gives a later example of acting differently, in a calm tone.","Rapid fire a":"Interviewers have heard it constantly, and it dodges the question instead of answering it.","Rapid fire b":"Name it, give an example, explain what you're doing about it, and show evidence of progress.","Rapid fire c":"Anything fatal to the job, such as poor attention to detail, discomfort with numbers or missing deadlines.","Rewind":"Situation, Task, Action, Result.","Brain teaser":"7.5 degrees. At 3:15 the minute hand points at the 3 (90 degrees); the hour hand has moved a quarter of the way from 3 to 4, which is another 7.5 degrees, putting it at 97.5 degrees."}},"acc-the-three-financial-statements-what-each-one-tel":{"title":"The three financial statements: what each one tells you","cat":"acc","slug":"the-three-financial-statements-what-each-one-tells-you","md":"# The three financial statements: what each one tells you\n*Comes up in:* Nearly every technical first round, as \"Walk me through the three financial statements.\"\n\n## Cold open\n\"Walk me through the three financial statements.\"\n\nAnswer it out loud before you read on.\n\n## The big idea\nEvery public company reports three statements, and each answers a different question. The **income statement** shows performance over a period: revenue minus expenses equals net income. The **balance sheet** is a snapshot at one moment: what the company owns (assets) and how it paid for them (liabilities and equity). The **cash flow statement** shows the cash that actually came in and went out over the period. Think of your own money: the income statement is your pay minus your bills for the year, the balance sheet is what you own and owe today, and the cash flow statement is what actually happened in your bank account.\n\n## How it works\nHere's a simple company, Coffee Co., for one year.\n\n| Income statement | | Cash flow statement | |\n|---|---|---|---|\n| Revenue | 1,000 | Net income | 150 |\n| Cost of goods sold | (400) | + Depreciation | 50 |\n| Operating expenses | (300) | − Increase in working capital | (30) |\n| Depreciation | (50) | Cash flow from operations | 170 |\n| Operating income | 250 | Capital expenditures | (100) |\n| Interest | (50) | Debt repaid and dividends | (30) |\n| Taxes at 25% | (50) | **Net change in cash** | **40** |\n| **Net income** | **150** | | |\n\nThe balance sheet at year end lists assets (cash, receivables, inventory, property and equipment), liabilities (payables, debt) and shareholders' equity (money shareholders put in plus profits kept over time). Assets always equal liabilities plus equity.\n\nWhat each one is best for: the income statement shows profitability; the balance sheet shows financial health, like how much debt there is and whether the company can pay its bills; the cash flow statement shows whether profits turn into real cash, which makes it the hardest statement to dress up.\n\n## In the real world\nAmazon is the classic example of why you need all three. For years it reported thin profits, yet its operating cash flow ran far ahead of its net income, because it collects cash from customers within days but pays its suppliers weeks later. An investor who read only the income statement missed that the business was funding its own growth. The reverse also happens: a company can report rising profits while its cash flow shrinks, which is often an early warning. Next earnings season, pick a company you follow and compare its net income with its cash flow from operations.\n\n## The interview trap\nThe trap is describing each statement but never saying how they connect, or saying the cash flow statement shows \"profit.\" It shows cash.\n\n> The income statement shows a company's revenue, expenses and profit over a period, ending in net income. The balance sheet is a snapshot at a point in time of the company's assets, liabilities and shareholders' equity, and assets always equal liabilities plus equity. The cash flow statement starts with net income, adjusts for non-cash items like depreciation and for changes in working capital to get cash flow from operations, then adds cash flow from investing, like capital expenditures, and from financing, like issuing debt or paying dividends, to show the net change in cash. They link together because net income flows into retained earnings on the balance sheet and to the top of the cash flow statement, and the ending cash on the cash flow statement becomes the cash balance on the balance sheet.\n\n## Your line\n\"Profit is an opinion; cash is a fact.\" **Follow-up you'll get:** \"If you could only look at one statement, which would you pick?\" **The other side:** Cash flow can be managed too. Paying suppliers later makes operating cash flow look better for a while, so check whether payables are ballooning.\n\n## Your turn\n1. **Say it out loud:** If you could use only one financial statement to judge a company, which would you pick and why?\n2. **Rapid fire:**\n   a. Which statement is a snapshot at a single point in time?\n   b. What are the three sections of the cash flow statement?\n   c. Where does net income show up on the balance sheet?\n3. **Rewind:** In one sentence, what's the difference between the sell side and the buy side?\n4. **Brain teaser:** What's 0.6 divided by 0.08?\n\n## Answers\n- **Say it out loud:** Most strong answers pick the cash flow statement, because it shows whether the company really generates cash and is the hardest to manipulate, then note you'd still want the balance sheet to check debt. Picking the balance sheet for a bank or another asset-heavy business is also defensible if you explain why.\n- **a.** The balance sheet.\n- **b.** Operating activities, investing activities and financing activities.\n- **c.** In retained earnings, inside shareholders' equity: net income adds to it and dividends reduce it.\n- **Rewind:** The sell side gets paid for transactions and services; the buy side gets paid for managing money and how it performs.\n- **Brain teaser:** 7.5. Multiply both by 100: 60 divided by 8.\n","answers":{"Cold open":"The income statement shows a company's revenue, expenses and profit over a period, ending in net income. The balance sheet is a snapshot at a point in time of the company's assets, liabilities and shareholders' equity, and assets always equal liabilities plus equity. The cash flow statement starts with net income, adjusts for non-cash items like depreciation and for changes in working capital to get cash flow from operations, then adds cash flow from investing, like capital expenditures, and from financing, like issuing debt or paying dividends, to show the net change in cash. They link together because net income flows into retained earnings on the balance sheet and to the top of the cash flow statement, and the ending cash on the cash flow statement becomes the cash balance on the balance sheet.","Say it out loud":"Most strong answers pick the cash flow statement, because it shows whether the company really generates cash and is the hardest to manipulate, then note you'd still want the balance sheet to check debt. Picking the balance sheet for a bank or another asset-heavy business is also defensible if you explain why.","Rapid fire a":"The balance sheet.","Rapid fire b":"Operating activities, investing activities and financing activities.","Rapid fire c":"In retained earnings, inside shareholders' equity: net income adds to it and dividends reduce it.","Rewind":"The sell side gets paid for transactions and services; the buy side gets paid for managing money and how it performs.","Brain teaser":"7.5. Multiply both by 100: 60 divided by 8."}},"acc-the-income-statement-line-by-line":{"title":"The income statement, line by line","cat":"acc","slug":"the-income-statement-line-by-line","md":"# The income statement, line by line\n*Comes up in:* Accounting technicals in every seat, and any time you discuss a company's earnings.\n\n## Cold open\n\"Walk me through the income statement.\"\n\nAnswer it out loud before you read on.\n\n## The big idea\nThe income statement starts with revenue (the top line) and subtracts costs in layers, showing profit at each level until it reaches net income (the bottom line). Each layer answers a question. Is the product profitable? Is the business profitable? What's left after paying lenders? What's left after taxes? Think of peeling an onion: you start with every dollar of sales and peel away costs until you reach what belongs to shareholders.\n\n## How it works\nHere's Coffee Co. for one year.\n\n| Line | Amount | What it tells you |\n|---|---|---|\n| Revenue | 1,000 | Sales earned in the period, not cash collected |\n| − Cost of goods sold | (400) | The direct cost of what was sold |\n| **= Gross profit** | **600** | A 60% gross margin: how profitable the product is |\n| − Selling, general and administrative | (250) | Salaries, rent, marketing |\n| − Research and development | (50) | Spending on new products |\n| − Depreciation and amortization | (50) | The cost of long-lived assets, spread over time |\n| **= Operating income (EBIT)** | **250** | A 25% operating margin: the core business |\n| − Interest expense | (50) | The cost of debt |\n| **= Pre-tax income** | **200** | |\n| − Taxes at 25% | (50) | |\n| **= Net income** | **150** | A 15% net margin: what belongs to shareholders |\n\nEarnings per share (EPS) is net income divided by shares outstanding: with 100 shares, Coffee Co. earns $1.50 a share. EBITDA, which you'll hear constantly, is operating income plus depreciation and amortization: 300 here.\n\nTwo rules matter. The statement is prepared on an **accrual** basis: revenue is recorded when it's earned and expenses when they're incurred, regardless of when cash moves. And companies often present depreciation inside cost of goods sold or operating expenses rather than on its own line, so read the notes.\n\n## In the real world\nMargins tell you what kind of business you're looking at. Costco marks up its goods so little that its gross margin is only about 11%. The real profit engine is membership fees: about $4.6 billion in fiscal 2023, equal to most of the company's net income of about $6.3 billion. Software companies are the opposite, often with gross margins above 70%, because selling one more copy costs almost nothing. In the next earnings release you read, find the gross margin and operating margin and compare them with a year earlier.\n\n## The interview trap\nThe trap is listing line items without saying what each level means, or mixing up the order of interest and taxes.\n\n> The income statement shows a company's profitability over a period. It starts with revenue, then subtracts cost of goods sold to get gross profit, which shows how profitable the product itself is. Then you subtract operating expenses like SG&A, R&D and depreciation to get operating income, or EBIT, the profit from the core business. Then you subtract interest expense to get pre-tax income, and taxes to get net income, the bottom line that belongs to shareholders. It's prepared on an accrual basis, so revenue is recorded when it's earned, not when the cash comes in, and expenses are matched to the period they relate to.\n\n## Your line\n\"Each level of the income statement answers a question: is the product profitable, is the business profitable, and what's left after lenders and taxes?\" **Follow-up you'll get:** \"Why can a company with rising revenue have falling net income?\" **The other side:** Net income can be distorted by one-time items, so analysts often look at operating income or adjusted figures, and then check what was adjusted.\n\n## Your turn\n1. **Say it out loud:** Why can a company with growing revenue still have shrinking profits?\n2. **Rapid fire:**\n   a. What's the difference between gross profit and operating income?\n   b. Coffee Co. has revenue of 1,000 and operating income of 250. What's its operating margin?\n   c. What is EPS?\n3. **Rewind:** In one sentence each, what do the three financial statements show?\n4. **Brain teaser:** What's 7% of 250?\n\n## Answers\n- **Say it out loud:** Costs can grow faster than revenue: lower gross margins from discounts or higher input costs, rising SG&A or R&D, more depreciation from new investment, higher interest expense or taxes, or one-time charges. A strong answer names where on the statement each one hits.\n- **a.** Gross profit is revenue minus cost of goods sold; operating income also subtracts operating expenses such as SG&A, R&D and depreciation.\n- **b.** 25%.\n- **c.** Earnings per share: net income divided by shares outstanding.\n- **Rewind:** The income statement shows performance over a period, the balance sheet shows assets, liabilities and equity at a point in time, and the cash flow statement shows the actual cash in and out.\n- **Brain teaser:** 17.5. One percent of 250 is 2.5, and 7 × 2.5 = 17.5.\n","answers":{"Cold open":"The income statement shows a company's profitability over a period. It starts with revenue, then subtracts cost of goods sold to get gross profit, which shows how profitable the product itself is. Then you subtract operating expenses like SG&A, R&D and depreciation to get operating income, or EBIT, the profit from the core business. Then you subtract interest expense to get pre-tax income, and taxes to get net income, the bottom line that belongs to shareholders. It's prepared on an accrual basis, so revenue is recorded when it's earned, not when the cash comes in, and expenses are matched to the period they relate to.","Say it out loud":"Costs can grow faster than revenue: lower gross margins from discounts or higher input costs, rising SG&A or R&D, more depreciation from new investment, higher interest expense or taxes, or one-time charges. A strong answer names where on the statement each one hits.","Rapid fire a":"Gross profit is revenue minus cost of goods sold; operating income also subtracts operating expenses such as SG&A, R&D and depreciation.","Rapid fire b":"25%.","Rapid fire c":"Earnings per share: net income divided by shares outstanding.","Rewind":"The income statement shows performance over a period, the balance sheet shows assets, liabilities and equity at a point in time, and the cash flow statement shows the actual cash in and out.","Brain teaser":"17.5. One percent of 250 is 2.5, and 7 × 2.5 = 17.5."}},"acc-the-balance-sheet-why-assets-always-equal-liabil":{"title":"The balance sheet: why assets always equal liabilities plus equity","cat":"acc","slug":"the-balance-sheet-why-assets-always-equal-liabilities-plus","md":"# The balance sheet: why assets always equal liabilities plus equity\n*Comes up in:* Accounting technicals, and any interview about a bank, an insurer or a company with heavy debt.\n\n## Cold open\n\"Why does the balance sheet always balance?\"\n\nAnswer it out loud before you read on.\n\n## The big idea\nEverything a company owns had to be paid for somehow: either with borrowed money (liabilities) or with owners' money (equity, including the profits the company has kept). So assets equal liabilities plus equity by definition. Accounting is double-entry, which means every transaction touches at least two accounts in a way that keeps the two sides equal. Think of a house worth $500,000 with a $400,000 mortgage: the house is the asset, the mortgage is the liability, and your $100,000 of equity is the difference.\n\n## How it works\nThe structure runs from most liquid to least.\n\n- **Assets.** Current: cash, accounts receivable (money customers owe), inventory, prepaid expenses. Long-term: property, plant and equipment (PP&E), intangible assets, goodwill.\n- **Liabilities.** Current: accounts payable (money owed to suppliers), accrued expenses, deferred revenue, short-term debt. Long-term: long-term debt, lease obligations.\n- **Equity.** The money shareholders invested, plus retained earnings (all past net income minus dividends), minus any shares the company has bought back.\n\nWatch both sides move with each transaction:\n\n| Transaction | Assets | Liabilities | Equity |\n|---|---|---|---|\n| Borrow $100 | Cash +100 | Debt +100 | |\n| Buy $40 of inventory with cash | Cash −40, inventory +40 | | |\n| Sell that inventory for $60 cash, ignoring taxes | Cash +60, inventory −40 | | Retained earnings +20 |\n| Issue $50 of new stock | Cash +50 | | Common stock +50 |\n\nEvery row balances. In the third row, assets rise by 20 and equity rises by 20, because the $20 profit belongs to the owners.\n\n## In the real world\nMcDonald's has reported negative shareholders' equity for years. That isn't a sign of a failing business: it borrowed heavily to buy back shares and pay dividends, which shrank equity below zero, while its restaurants kept producing strong cash flow. The balance sheet still balances, because liabilities are larger than assets. The lesson is that book equity is an accounting record of what was invested and kept, not what a company is worth. To see this for yourself, open a 10-K, find total liabilities and shareholders' equity, and check what has been driving equity up or down.\n\n## The interview trap\nThe trap is saying \"because accountants make it balance,\" or not knowing what retained earnings is.\n\n> The balance sheet balances because every asset a company has must have been paid for somehow: either by borrowing, which is a liability, or by its owners, which is equity. Equity includes the money shareholders put in plus the profits the company has kept over time, called retained earnings. Accounting is double-entry, so every transaction hits at least two accounts in a way that keeps both sides equal. For example, if a company borrows $100, cash goes up by $100 on the asset side and debt goes up by $100 on the liability side. If it then earns a $20 profit in cash, cash goes up by $20 and retained earnings goes up by $20.\n\n## Your line\n\"Every asset was paid for by someone: a lender or an owner.\" **Follow-up you'll get:** \"Can shareholders' equity be negative? What would that mean?\" **The other side:** Many assets sit on the balance sheet at historical cost, so book value can be far from what the assets are worth today.\n\n## Your turn\n1. **Say it out loud:** A company borrows $100 and uses it to buy equipment. Walk me through what happens to the balance sheet.\n2. **Rapid fire:**\n   a. Name two current assets and two current liabilities.\n   b. What is retained earnings?\n   c. A company has $500 of assets and $350 of liabilities. What's its equity?\n3. **Rewind:** What's the difference between gross profit and operating income?\n4. **Brain teaser:** You have a 3-gallon jug and a 5-gallon jug. How do you measure exactly 4 gallons?\n\n## Answers\n- **Say it out loud:** Borrowing raises cash by $100 and debt by $100. Buying the equipment lowers cash by $100 and raises PP&E by $100. The net result is PP&E up $100 and debt up $100, so the balance sheet balances, with no effect on the income statement until depreciation starts.\n- **a.** Current assets: cash, accounts receivable, inventory, prepaid expenses. Current liabilities: accounts payable, accrued expenses, deferred revenue, short-term debt.\n- **b.** All the net income a company has earned over its life, minus the dividends it has paid.\n- **c.** $150.\n- **Rewind:** Gross profit is revenue minus cost of goods sold; operating income also subtracts operating expenses like SG&A, R&D and depreciation.\n- **Brain teaser:** Fill the 5-gallon jug and pour it into the 3-gallon jug, leaving 2 gallons. Empty the 3, pour the 2 gallons into it, fill the 5 again, and top off the 3 (which takes 1 gallon). Exactly 4 gallons are left in the 5-gallon jug.\n","answers":{"Cold open":"The balance sheet balances because every asset a company has must have been paid for somehow: either by borrowing, which is a liability, or by its owners, which is equity. Equity includes the money shareholders put in plus the profits the company has kept over time, called retained earnings. Accounting is double-entry, so every transaction hits at least two accounts in a way that keeps both sides equal. For example, if a company borrows $100, cash goes up by $100 on the asset side and debt goes up by $100 on the liability side. If it then earns a $20 profit in cash, cash goes up by $20 and retained earnings goes up by $20.","Say it out loud":"Borrowing raises cash by $100 and debt by $100. Buying the equipment lowers cash by $100 and raises PP&E by $100. The net result is PP&E up $100 and debt up $100, so the balance sheet balances, with no effect on the income statement until depreciation starts.","Rapid fire a":"Current assets: cash, accounts receivable, inventory, prepaid expenses. Current liabilities: accounts payable, accrued expenses, deferred revenue, short-term debt.","Rapid fire b":"All the net income a company has earned over its life, minus the dividends it has paid.","Rapid fire c":"$150.","Rewind":"Gross profit is revenue minus cost of goods sold; operating income also subtracts operating expenses like SG&A, R&D and depreciation.","Brain teaser":"Fill the 5-gallon jug and pour it into the 3-gallon jug, leaving 2 gallons. Empty the 3, pour the 2 gallons into it, fill the 5 again, and top off the 3 (which takes 1 gallon). Exactly 4 gallons are left in the 5-gallon jug."}},"acc-the-cash-flow-statement-why-profit-isn-t-the-sam":{"title":"The cash flow statement: why profit isn't the same as cash","cat":"acc","slug":"the-cash-flow-statement-why-profit-isn-t-the-same-as-cash","md":"# The cash flow statement: why profit isn't the same as cash\n*Comes up in:* Accounting technicals in every seat, and especially in asset management and credit interviews.\n\n## Cold open\n\"Why isn't net income the same as cash flow?\"\n\nAnswer it out loud before you read on.\n\n## The big idea\nThe income statement records revenue when it's earned and expenses when they're incurred, and it includes expenses that never use cash, like depreciation. The cash flow statement tracks the cash itself, in three sections: operating, investing and financing. Think of earning a paycheck that won't land in your account until next month: you earned the money this month, but your bank balance doesn't know that yet.\n\n## How it works\nMost companies use the indirect method: start with net income and adjust it to cash. Here's Coffee Co.\n\n| Line | Amount | Why |\n|---|---|---|\n| Net income | 150 | From the income statement |\n| + Depreciation | 50 | An expense that used no cash |\n| − Increase in accounts receivable | (40) | Sales booked but not yet collected |\n| − Increase in inventory | (20) | Cash spent on goods not yet sold |\n| + Increase in accounts payable | 30 | Bills received but not yet paid |\n| **= Cash flow from operations** | **170** | |\n| − Capital expenditures | (100) | Investing: buying equipment |\n| **= Cash flow from investing** | **(100)** | |\n| − Debt repaid | (20) | Financing |\n| − Dividends paid | (10) | Financing |\n| **= Cash flow from financing** | **(30)** | |\n| **Net change in cash** | **40** | 170 − 100 − 30 |\n\nThe rule of thumb for working capital: when an asset like receivables or inventory goes up, cash goes down; when a liability like payables goes up, cash goes up. Free cash flow, in its simplest form, is cash from operations minus capital expenditures: 70 here.\n\n## In the real world\nThe textbook warning is W.T. Grant, once one of the largest U.S. retailers. For most of the decade before its 1975 bankruptcy, it reported positive net income while cash flow from operations was negative, as receivables and inventory piled up. A 1980 study of the case by Largay and Stickney became a standard reading on why analysts should look past earnings to cash. Today the same check takes a minute: for a company you follow, compare net income with cash flow from operations over the last few years and see whether they move together.\n\n## The interview trap\nThe trap is saying depreciation \"generates cash.\" It doesn't: it's added back because it never used cash in the first place. The only real cash effect of depreciation is that it lowers taxes.\n\n> Net income is calculated on an accrual basis, so it includes non-cash items and timing differences. Depreciation reduces net income but doesn't use any cash, so it gets added back. Working capital matters too: if a company sells on credit, it records revenue before collecting the cash, so a rise in accounts receivable reduces cash flow, and buying inventory uses cash before the expense shows up. Some uses of cash, like capital expenditures and debt repayment, don't hit net income at all. The cash flow statement reconciles all of that: it starts with net income, adjusts for non-cash items and working capital to get operating cash flow, then adds investing and financing flows to get the actual change in cash.\n\n## Your line\n\"A growing company can be profitable and still run out of cash if customers pay slowly and inventory piles up.\" **Follow-up you'll get:** \"Which matters more to you, net income or cash flow from operations?\" **The other side:** Operating cash flow can be flattered by stretching payments to suppliers, so check whether payables are growing much faster than sales.\n\n## Your turn\n1. **Say it out loud:** A company's net income rose 20%, but its cash flow from operations fell. What could explain that?\n2. **Rapid fire:**\n   a. In which section of the cash flow statement does capex appear?\n   b. Accounts receivable rose by 30. Does that raise or lower cash flow from operations?\n   c. Where do dividends show up on the cash flow statement?\n3. **Rewind:** Why does the balance sheet always balance?\n4. **Brain teaser:** What's the probability of flipping three heads in a row with a fair coin?\n\n## Answers\n- **Say it out loud:** Working capital building up (receivables or inventory growing faster than sales, or paying suppliers faster), a gain included in net income that isn't operating cash (like selling an asset, whose cash shows up in investing), lower non-cash add-backs, or a one-time cash payment such as taxes. A strong answer names the specific line.\n- **a.** Investing activities, as a negative number.\n- **b.** It lowers it by 30, because the revenue was recorded but the cash wasn't collected.\n- **c.** In financing activities.\n- **Rewind:** Every asset is funded by liabilities or equity, and double-entry accounting keeps both sides equal with every transaction.\n- **Brain teaser:** 1/8, or 12.5%: 1/2 × 1/2 × 1/2.\n","answers":{"Cold open":"Net income is calculated on an accrual basis, so it includes non-cash items and timing differences. Depreciation reduces net income but doesn't use any cash, so it gets added back. Working capital matters too: if a company sells on credit, it records revenue before collecting the cash, so a rise in accounts receivable reduces cash flow, and buying inventory uses cash before the expense shows up. Some uses of cash, like capital expenditures and debt repayment, don't hit net income at all. The cash flow statement reconciles all of that: it starts with net income, adjusts for non-cash items and working capital to get operating cash flow, then adds investing and financing flows to get the actual change in cash.","Say it out loud":"Working capital building up (receivables or inventory growing faster than sales, or paying suppliers faster), a gain included in net income that isn't operating cash (like selling an asset, whose cash shows up in investing), lower non-cash add-backs, or a one-time cash payment such as taxes. A strong answer names the specific line.","Rapid fire a":"Investing activities, as a negative number.","Rapid fire b":"It lowers it by 30, because the revenue was recorded but the cash wasn't collected.","Rapid fire c":"In financing activities.","Rewind":"Every asset is funded by liabilities or equity, and double-entry accounting keeps both sides equal with every transaction.","Brain teaser":"1/8, or 12.5%: 1/2 × 1/2 × 1/2."}},"acc-how-the-three-statements-link-together":{"title":"How the three statements link together","cat":"acc","slug":"how-the-three-statements-link-together","md":"# How the three statements link together\n*Comes up in:* Banking and private equity technicals, and every financial modeling test.\n\n## Cold open\n\"How do the three financial statements link together?\"\n\nAnswer it out loud before you read on.\n\n## The big idea\nNet income from the income statement is the thread. It starts the cash flow statement and adds to retained earnings on the balance sheet. The cash flow statement then explains why each balance sheet account changed, ending with the change in cash. Think of the income statement as the movie of the year, the balance sheet as a photo taken at the end, and the cash flow statement as the explanation of how cash got from the first photo to the second.\n\n## How it works\nSix links do almost all the work:\n\n1. **Net income** starts the cash flow statement and, minus dividends, adds to retained earnings.\n2. **Depreciation** is added back on the cash flow statement and reduces PP&E on the balance sheet.\n3. **Capital expenditures** appear under investing and increase PP&E.\n4. **Working capital changes** on the cash flow statement match the changes in receivables, inventory and payables on the balance sheet.\n5. **Financing flows** (borrowing, repaying debt, issuing or buying back stock, dividends) match the changes in debt and equity.\n6. **The net change in cash**, added to beginning cash, gives the ending cash on the balance sheet.\n\nThose links work as \"roll-forwards,\" where each balance carries from one year to the next. Here they are for Coffee Co.:\n\n| Account | Beginning | Plus | Minus | Ending |\n|---|---|---|---|---|\n| Cash | 100 | Net change in cash +40 | | 140 |\n| Retained earnings | 500 | Net income +150 | Dividends 10 | 640 |\n| PP&E | 800 | Capex +100 | Depreciation 50 | 850 |\n\n## In the real world\nEvery banking model is built on these links, and every good one has a \"balance check\" row that flags an error the moment assets stop equaling liabilities plus equity. Checks exist because spreadsheet mistakes are expensive. JPMorgan's 2013 internal report on its \"London Whale\" trading losses, which ran to about $6 billion, found that a key risk model ran on spreadsheets with manual copy-and-paste steps and a formula error that understated risk. If you build a model in a club or a training course, add the balance check first and never hard-code a number to force it to balance.\n\n## The interview trap\nThe trap is saying \"they're all connected\" without naming the links, or forgetting the cash link that makes the balance sheet balance.\n\n> Net income at the bottom of the income statement flows to the top of the cash flow statement, and into retained earnings on the balance sheet after subtracting any dividends. On the cash flow statement, you adjust net income for non-cash items like depreciation and for changes in working capital, and those adjustments line up with changes in balance sheet accounts like PP&E, receivables, inventory and payables. Investing activities like capex change PP&E, and financing activities like borrowing or buying back stock change debt and equity. Finally, the net change in cash at the bottom of the cash flow statement, added to the beginning cash balance, gives the ending cash on the balance sheet, which is what makes it balance.\n\n## Your line\n\"If you know the six links, you can walk any change through all three statements.\" **Follow-up you'll get:** \"Depreciation goes up by $10. Walk me through it.\" **The other side:** In real filings, a few items, such as foreign currency translation, change equity without passing through net income, through what's called other comprehensive income.\n\n## Your turn\n1. **Say it out loud:** A company issues $100 of new stock for cash. Walk me through the three statements.\n2. **Rapid fire:**\n   a. Beginning PP&E is 800, capex is 100 and depreciation is 50. What's ending PP&E?\n   b. Where do dividends show up on each of the three statements?\n   c. In a model, which link makes the balance sheet balance?\n3. **Rewind:** Why does a rise in accounts receivable reduce operating cash flow?\n4. **Brain teaser:** What's 1.1 × 1.1 × 1.1?\n\n## Answers\n- **Say it out loud:** No effect on the income statement. On the cash flow statement, cash from financing rises by $100, so cash rises by $100. On the balance sheet, cash is up $100 and common stock (or additional paid-in capital) is up $100, so it balances.\n- **a.** 850.\n- **b.** Not on the income statement. On the cash flow statement, as a financing outflow. On the balance sheet, cash goes down and retained earnings goes down.\n- **c.** The net change in cash from the cash flow statement, added to beginning cash, becomes ending cash on the balance sheet.\n- **Rewind:** The revenue was recorded, but the customer hasn't paid yet, so the cash hasn't come in.\n- **Brain teaser:** 1.331. 1.1 × 1.1 = 1.21, and 1.21 × 1.1 = 1.331.\n","answers":{"Cold open":"Net income at the bottom of the income statement flows to the top of the cash flow statement, and into retained earnings on the balance sheet after subtracting any dividends. On the cash flow statement, you adjust net income for non-cash items like depreciation and for changes in working capital, and those adjustments line up with changes in balance sheet accounts like PP&E, receivables, inventory and payables. Investing activities like capex change PP&E, and financing activities like borrowing or buying back stock change debt and equity. Finally, the net change in cash at the bottom of the cash flow statement, added to the beginning cash balance, gives the ending cash on the balance sheet, which is what makes it balance.","Say it out loud":"No effect on the income statement. On the cash flow statement, cash from financing rises by $100, so cash rises by $100. On the balance sheet, cash is up $100 and common stock (or additional paid-in capital) is up $100, so it balances.","Rapid fire a":"850.","Rapid fire b":"Not on the income statement. On the cash flow statement, as a financing outflow. On the balance sheet, cash goes down and retained earnings goes down.","Rapid fire c":"The net change in cash from the cash flow statement, added to beginning cash, becomes ending cash on the balance sheet.","Rewind":"The revenue was recorded, but the customer hasn't paid yet, so the cash hasn't come in.","Brain teaser":"1.331. 1.1 × 1.1 = 1.21, and 1.21 × 1.1 = 1.331."}},"acc-pp-and-e-capex-and-depreciation":{"title":"PP&E, capex and depreciation","cat":"acc","slug":"pp-and-e-capex-and-depreciation","md":"# PP&E, capex and depreciation\n*Comes up in:* Accounting technicals, and any discussion of capital-heavy businesses, from airlines to the companies building AI data centers.\n\n## Cold open\n\"What's the difference between capex and depreciation?\"\n\nAnswer it out loud before you read on.\n\n## The big idea\nWhen a company buys a long-lived asset, like a building, a machine or a server, it pays cash up front. That's **capital expenditure (capex)**. But the asset helps produce revenue for years, so accounting spreads its cost across those years as **depreciation**. Think of a $3,000 laptop you'll use for three years: you paid the full $3,000 today, but you \"use up\" about $1,000 of it each year.\n\n## How it works\nWhere each one shows up:\n\n- **Capex:** the cash flow statement, under investing, and an increase in PP&E on the balance sheet. It never hits the income statement directly.\n- **Depreciation:** an expense on the income statement that lowers operating income and taxes. It uses no cash, so it's added back on the cash flow statement, and it reduces PP&E on the balance sheet.\n\nStraight-line depreciation is the cost minus any salvage value, divided by the useful life. A $100 machine with a five-year life and no salvage value depreciates $20 a year:\n\n| Year | Depreciation | Net PP&E at year end |\n|---|---|---|\n| 1 | 20 | 80 |\n| 2 | 20 | 60 |\n| 3 | 20 | 40 |\n| 4 | 20 | 20 |\n| 5 | 20 | 0 |\n\nIn year one, with a 25% tax rate: depreciation of 20 lowers pre-tax income by 20 and net income by 15. On the cash flow statement, net income is down 15, depreciation adds back 20, and capex is −100. Over five years, total depreciation equals the $100 paid. **Amortization** is the same idea for intangible assets, like patents.\n\nTwo more terms: **maintenance capex** keeps existing assets running, and **growth capex** adds capacity. When capex runs well above depreciation, a company is growing its asset base; when it runs below for long, it may be underinvesting.\n\n## In the real world\nThe AI build-out has made this lesson front-page news. In 2024, Microsoft, Alphabet, Amazon and Meta together spent more than $200 billion on capex, mostly data centers and chips. That cash went out right away, but the depreciation will hit their income statements for years, which is why investors watch both. Useful life matters too: in 2022 Microsoft extended the estimated life of its servers from four years to six, which cut annual depreciation and raised reported operating income by billions of dollars without changing its cash at all. On the next Big Tech earnings call, listen for capex guidance and any mention of depreciation.\n\n## The interview trap\nThe trap is calling depreciation a cash expense, or saying capex hits the income statement right away.\n\n> Capex is the cash a company spends to buy or upgrade long-lived assets like buildings and equipment. It shows up on the cash flow statement under investing and adds to PP&E on the balance sheet, but it doesn't hit the income statement right away. Depreciation is how that cost gets expensed over the asset's useful life: it reduces operating income and taxes each year, but it's a non-cash expense, so it's added back on the cash flow statement. Over an asset's life, total depreciation equals what the company paid, minus any salvage value. Comparing the two is useful too: if capex runs well above depreciation, the company is growing its asset base; if it's below, it may be underinvesting.\n\n## Your line\n\"Capex is when you pay; depreciation is when you expense it.\" **Follow-up you'll get:** \"What happens to earnings if a company extends the useful life of its assets?\" **The other side:** Some argue depreciation understates true costs during inflation, because replacing an asset costs more than its historical price.\n\n## Your turn\n1. **Say it out loud:** A company buys a $100 machine with cash. What happens on the three statements on the day it buys it?\n2. **Rapid fire:**\n   a. What's the annual straight-line depreciation on a $50 asset with a five-year life and no salvage value?\n   b. What's the difference between maintenance capex and growth capex?\n   c. How is amortization different from depreciation?\n3. **Rewind:** How does net income link to the balance sheet?\n4. **Brain teaser:** How many times a day do the hour and minute hands of a clock overlap?\n\n## Answers\n- **Say it out loud:** On the day of purchase, there's no income statement effect. On the cash flow statement, capex of −100 appears under investing. On the balance sheet, cash falls by 100 and PP&E rises by 100, so total assets don't change. Depreciation starts afterward.\n- **a.** $10 a year.\n- **b.** Maintenance capex keeps existing assets running; growth capex adds new capacity.\n- **c.** It's the same idea applied to intangible assets, like patents or acquired customer relationships.\n- **Rewind:** Net income, minus dividends, adds to retained earnings in shareholders' equity.\n- **Brain teaser:** 22 times: 11 times in each 12-hour period, because the hands meet every 12/11 of an hour.\n","answers":{"Cold open":"Capex is the cash a company spends to buy or upgrade long-lived assets like buildings and equipment. It shows up on the cash flow statement under investing and adds to PP&E on the balance sheet, but it doesn't hit the income statement right away. Depreciation is how that cost gets expensed over the asset's useful life: it reduces operating income and taxes each year, but it's a non-cash expense, so it's added back on the cash flow statement. Over an asset's life, total depreciation equals what the company paid, minus any salvage value. Comparing the two is useful too: if capex runs well above depreciation, the company is growing its asset base; if it's below, it may be underinvesting.","Say it out loud":"On the day of purchase, there's no income statement effect. On the cash flow statement, capex of −100 appears under investing. On the balance sheet, cash falls by 100 and PP&E rises by 100, so total assets don't change. Depreciation starts afterward.","Rapid fire a":"$10 a year.","Rapid fire b":"Maintenance capex keeps existing assets running; growth capex adds new capacity.","Rapid fire c":"It's the same idea applied to intangible assets, like patents or acquired customer relationships.","Rewind":"Net income, minus dividends, adds to retained earnings in shareholders' equity.","Brain teaser":"22 times: 11 times in each 12-hour period, because the hands meet every 12/11 of an hour."}},"acc-the-classic-depreciation-goes-up-by-10-walk-me-t":{"title":"The classic: \"Depreciation goes up by $10. Walk me through the three statements.\"","cat":"acc","slug":"the-classic-depreciation-goes-up-by-10-walk-me-through-the","md":"# The classic: \"Depreciation goes up by $10. Walk me through the three statements.\"\n*Comes up in:* Possibly the single most-asked accounting question in banking and private equity first rounds.\n\n## Cold open\n\"Depreciation goes up by $10. Walk me through the three statements. Assume a 25% tax rate.\"\n\nAnswer it out loud before you read on.\n\n## The big idea\nDepreciation is an expense that uses no cash but does lower taxes. So when it rises, net income falls by the after-tax amount, cash actually rises by the tax saved, PP&E falls by the full amount, and equity falls by the drop in net income. Both sides of the balance sheet fall by the same amount. Think of it as a $10 deduction that costs you nothing in cash today but cuts your tax bill by $2.50.\n\n## How it works\nGo statement by statement, always in the same order: income statement, cash flow statement, balance sheet.\n\n| Statement | Line | Change |\n|---|---|---|\n| Income statement | Depreciation | +10 |\n| | Pre-tax income | −10 |\n| | Taxes (25%) | −2.50 |\n| | **Net income** | **−7.50** |\n| Cash flow statement | Net income | −7.50 |\n| | Add back depreciation | +10 |\n| | **Cash flow from operations and net change in cash** | **+2.50** |\n| Balance sheet: assets | Cash | +2.50 |\n| | PP&E | −10 |\n| | **Total assets** | **−7.50** |\n| Balance sheet: liabilities and equity | Retained earnings | −7.50 |\n| | **Total liabilities and equity** | **−7.50** |\n\nCheck it with a different tax rate. At 40%, net income falls by $6, cash rises by $4, assets fall by $6 and equity falls by $6. The pattern never changes: net income falls by the change times (1 − tax rate), and cash rises by the change times the tax rate. Amortization works exactly the same way.\n\n## In the real world\nThe tax shield from depreciation is real money, and Congress uses it as a policy lever. The 2017 Tax Cuts and Jobs Act let companies deduct the full cost of many equipment purchases in the first year, called 100% bonus depreciation, which pulled tax savings forward and encouraged investment. The rules have changed since, so check current law before you quote them. In practice, companies keep two sets of depreciation, one for financial reporting and one for taxes, and the gap between them creates deferred taxes, a topic for later.\n\n## The interview trap\nThe traps are forgetting taxes (saying net income falls by $10), saying cash goes down, or getting lost because you didn't go statement by statement.\n\n> On the income statement, depreciation goes up by $10, so pre-tax income falls by $10, and with a 25% tax rate, net income falls by $7.50. On the cash flow statement, net income is down $7.50, but depreciation is a non-cash expense, so you add back the $10, and cash flow from operations is up $2.50; that's the tax savings. On the balance sheet, cash is up $2.50 and PP&E is down $10 from the extra depreciation, so total assets are down $7.50. On the other side, retained earnings is down $7.50 because of the lower net income, so liabilities and equity are also down $7.50, and the balance sheet balances.\n\n## Your line\n\"Depreciation doesn't cost cash; it saves taxes.\" **Follow-up you'll get:** \"What changes if the tax rate is 40%?\" **The other side:** In real life, book and tax depreciation often differ, so the cash tax savings may not match the expense on the income statement in the same year.\n\n## Your turn\n1. **Say it out loud:** Walk me through a $20 increase in depreciation with a 40% tax rate.\n2. **Rapid fire:**\n   a. Why does cash go up when depreciation increases?\n   b. With a 25% tax rate, what happens to net income if amortization rises by $40?\n   c. In the standard answer, do liabilities change?\n3. **Rewind:** What's the difference between capex and depreciation?\n4. **Brain teaser:** What's 12.5% of 64?\n\n## Answers\n- **Say it out loud:** Income statement: pre-tax income falls by $20, taxes fall by $8, net income falls by $12. Cash flow statement: net income −12, add back depreciation +20, so cash is up $8. Balance sheet: cash +8 and PP&E −20, so assets are down $12; retained earnings is down $12, so it balances.\n- **a.** Depreciation lowers taxable income, so the company pays less tax, and the expense itself uses no cash.\n- **b.** It falls by $30.\n- **c.** No. Liabilities would only change if you were modeling taxes payable or deferred taxes.\n- **Rewind:** Capex is the cash spent to buy long-lived assets, shown under investing and added to PP&E; depreciation spreads that cost over the asset's life on the income statement, as a non-cash expense that gets added back.\n- **Brain teaser:** 8. 12.5% is one-eighth, and 64 ÷ 8 = 8.\n","answers":{"Cold open":"On the income statement, depreciation goes up by $10, so pre-tax income falls by $10, and with a 25% tax rate, net income falls by $7.50. On the cash flow statement, net income is down $7.50, but depreciation is a non-cash expense, so you add back the $10, and cash flow from operations is up $2.50; that's the tax savings. On the balance sheet, cash is up $2.50 and PP&E is down $10 from the extra depreciation, so total assets are down $7.50. On the other side, retained earnings is down $7.50 because of the lower net income, so liabilities and equity are also down $7.50, and the balance sheet balances.","Say it out loud":"Income statement: pre-tax income falls by $20, taxes fall by $8, net income falls by $12. Cash flow statement: net income −12, add back depreciation +20, so cash is up $8. Balance sheet: cash +8 and PP&E −20, so assets are down $12; retained earnings is down $12, so it balances.","Rapid fire a":"Depreciation lowers taxable income, so the company pays less tax, and the expense itself uses no cash.","Rapid fire b":"It falls by $30.","Rapid fire c":"No. Liabilities would only change if you were modeling taxes payable or deferred taxes.","Rewind":"Capex is the cash spent to buy long-lived assets, shown under investing and added to PP&E; depreciation spreads that cost over the asset's life on the income statement, as a non-cash expense that gets added back.","Brain teaser":"8. 12.5% is one-eighth, and 64 ÷ 8 = 8."}},"acc-working-capital-why-fast-growing-companies-can-r":{"title":"Working capital: why fast-growing companies can run out of cash","cat":"acc","slug":"working-capital-why-fast-growing-companies-can-run-out-of","md":"# Working capital: why fast-growing companies can run out of cash\n*Comes up in:* Accounting technicals, credit and private equity interviews, and any question about why a growing company needs money.\n\n## Cold open\n\"What is working capital, and how can a growing company run out of cash even when it's profitable?\"\n\nAnswer it out loud before you read on.\n\n## The big idea\nWorking capital is current assets minus current liabilities. The part that matters for running the business is **receivables plus inventory minus payables**: the cash tied up in day-to-day operations. To grow, a company usually has to buy more inventory and give customers time to pay before the cash comes in. If customers pay slowly and suppliers want cash quickly, growth eats cash. Think of a lemonade stand that has to buy lemons today but won't get paid by its biggest customer until next month.\n\n## How it works\nSay a company's sales grow from 1,000 to 1,500. It keeps receivables at 20% of sales, inventory at 15% and payables at 10%.\n\n| | Year 1 | Year 2 | Change | Cash effect |\n|---|---|---|---|---|\n| Sales | 1,000 | 1,500 | | |\n| Accounts receivable | 200 | 300 | +100 | −100 |\n| Inventory | 150 | 225 | +75 | −75 |\n| Accounts payable | 100 | 150 | +50 | +50 |\n| **Net working capital** | **250** | **375** | **+125** | **−125** |\n\nIf year-two net income is 100 and depreciation is 20, cash flow from operations is 100 + 20 − 125 = −5. The company is profitable and still burning cash, and the faster it grows, the bigger the gap.\n\nThe **cash conversion cycle** measures how long cash is tied up: days sales outstanding (how long customers take to pay) plus days inventory outstanding, minus days payables outstanding (how long the company takes to pay suppliers). A shorter cycle means growth needs less cash.\n\n## In the real world\nAmazon runs the opposite model, with a negative cash conversion cycle: it collects from customers within days but pays many suppliers weeks later. Every extra dollar of sales brings cash in before the bills come due, so its growth helped fund itself. Subscription businesses can work the same way, because customers pay up front. The danger runs the other way for a company whose receivables grow faster than its revenue: customers are paying more slowly, and that cash has to come from somewhere. In the next earnings report you read, compare the growth in receivables with the growth in revenue.\n\n## The interview trap\nThe trap is defining working capital correctly but never explaining the cash mechanism, or saying working capital \"is cash.\"\n\n> Working capital is current assets minus current liabilities. For operations, the part that matters is receivables plus inventory minus payables: the cash tied up in running the business. When a company grows, it usually has to build inventory and give customers credit before it gets paid, while suppliers expect to be paid on their own schedule, so more sales means more cash tied up. Net income can be positive, but if the increase in working capital is bigger than net income plus non-cash expenses, operating cash flow turns negative. If the company can't fund that gap with debt or equity, it can run out of cash while still profitable on paper. Businesses with negative working capital, like Amazon, are the opposite: customers pay before suppliers do, so growth actually brings in cash.\n\n## Your line\n\"Growth costs cash before it makes cash, unless your customers pay you first.\" **Follow-up you'll get:** \"How would you fix a working capital problem?\" **The other side:** Stretching supplier payments improves cash flow, but pushed too far it strains relationships, and some companies use supply chain financing that can make cash flow look stronger than it is.\n\n## Your turn\n1. **Say it out loud:** How can a company improve its operating cash flow without increasing sales?\n2. **Rapid fire:**\n   a. What's the formula for the cash conversion cycle?\n   b. Receivables rise by $50 and payables rise by $20. What's the net effect on operating cash flow?\n   c. Why do subscription businesses often have negative working capital?\n3. **Rewind:** Depreciation goes up by $10 with a 25% tax rate. What happens to cash?\n4. **Brain teaser:** Estimate the annual revenue of a coffee shop near your campus.\n\n## Answers\n- **Say it out loud:** Collect receivables faster, hold less inventory, negotiate longer payment terms with suppliers, cut costs, or sell assets it doesn't need. A strong answer mentions the trade-offs, like losing customers by tightening credit or straining suppliers.\n- **a.** Days sales outstanding plus days inventory outstanding minus days payables outstanding.\n- **b.** It falls by $30.\n- **c.** Customers pay up front, which creates deferred revenue, before the company has delivered the service or paid many of its costs.\n- **Rewind:** Cash goes up by $2.50, the tax saved.\n- **Brain teaser:** One approach: about 300 customers a day at an average of $6 is $1,800 a day; times about 360 days is roughly $650,000 a year. A strong answer states its
