    const by = {}; rows.forEach(rw => { by[rw.id] = rw; });
    for (let i = 0; i <= upTo; i++) {
      const q = liveQuestion(seed, mix, i), a = (answers && answers[i]) || {};
      Object.keys(a).forEach(id => {
        const rw = by[id], v = a[id];
        if (!rw || !v || typeof v.c !== 'number') return;
        const pts = livePoints(v.c === q.correct, +v.ms || 0, secs * 1000);
        rw.s += pts; if (pts) rw.right++; if (i === upTo) rw.last = pts;
      });
    }
    return rows.sort((a, b) => b.s - a.s || a.n.localeCompare(b.n));
  }

  /* ---------- names, challenge links, share text ---------- */
  function cleanName(s) {
    return String(s == null ? '' : s).replace(/[\u0000-\u001f<>&"'`\\]/g, '').replace(/\s+/g, ' ').trim().slice(0, 16);
  }
  const GAMES = { sprint: { name: 'Mental Math Sprint', unit: 'right in 60 seconds' }, flows: { name: 'Statement Flows', unit: 'of 45 lines right' } };
  function challengeHash(c) {
    const p = ['g=' + c.g, 's=' + encodeURIComponent(c.seed)];
    if (Number.isFinite(c.score)) p.push('p=' + Math.round(c.score));
    if (c.name) p.push('n=' + encodeURIComponent(cleanName(c.name)));
    return '#' + p.join('&');
  }
  function parseChallenge(hash) {
    const m = {};
    String(hash || '').replace(/^#/, '').split('&').forEach(kv => { const k = kv.indexOf('='); if (k > 0) { try { m[kv.slice(0, k)] = decodeURIComponent(kv.slice(k + 1)); } catch (e) { /* skip a malformed value */ } } });
    if (!GAMES[m.g] || !/^[A-Z0-9]{3,12}$/.test(m.s || '')) return null;
    const score = /^\d{1,3}$/.test(m.p || '') ? +m.p : null;
    return { g: m.g, seed: m.s, score, name: cleanName(m.n) };
  }
  function shareText(c, url) {
    const g = GAMES[c.g];
    return g.name + ': ' + c.score + ' ' + g.unit + '. Same questions, your turn: ' + url;
  }

  /* ---------- progress: streak and readiness ---------- */
  function addDaysISO(iso, n) {
    const [y, m, d] = iso.split('-').map(Number);
    const dt = new Date(y, m - 1, d + n, 12);
    return dt.getFullYear() + '-' + String(dt.getMonth() + 1).padStart(2, '0') + '-' + String(dt.getDate()).padStart(2, '0');
  }
  // days in a row with any practice. Today not done yet doesn't break it; a missed yesterday does.
  function streak(days, today) {
    const has = d => (days instanceof Set ? days.has(d) : !!days[d]);
    let cur = has(today) ? today : addDaysISO(today, -1), n = 0;
    while (has(cur)) { n++; cur = addDaysISO(cur, -1); }
    return { n, today: has(today) };
  }
  // every day with a graded answer, a finished session, a mock or a game
  function activeDays(app, play) {
    const days = new Set();
    const ok = d => { if (typeof d === 'string' && /^\d{4}-\d{2}-\d{2}/.test(d)) days.add(d.slice(0, 10)); };
    if (app) {
      (app.answers || []).forEach(a => ok(a.date));
      Object.keys(app.done || {}).forEach(k => ok(app.done[k]));
      (app.mocks || []).forEach(m => ok(m.date));
    }
    if (play) (play.runs || []).forEach(rn => ok(rn.date));
    return days;
  }
  const SPRINT_TARGET = 20;      // right answers in 60 seconds this site treats as ready (a house target, not an industry rule)
  const AREAS = [
    { k: 'acc', name: 'Accounting', cats: ['acc'], game: 'flows', next: 'Play Statement Flows, then drill accounting questions out loud.' },
    { k: 'val', name: 'Valuation', cats: ['val'], next: 'Drill valuation questions out loud in Practice.' },
    { k: 'mkt', name: 'Markets', cats: ['mkt', 'trd', 'inv'], next: 'Drill markets questions and practice your 60-second markets answer.' },
    { k: 'awm', name: 'Asset & wealth mgmt', cats: ['awm'], seats: ['wm', 'am'], next: 'Drill asset and wealth management questions in Practice.' },
    { k: 'story', name: 'Story & fit', cats: ['fit', 'beh', 'car', 'prep', 'firm'], next: 'Record your "tell me about yourself" and one behavioral story.' },
    { k: 'math', name: 'Mental math', cats: ['teaser'], game: 'sprint', next: 'Run the Mental Math Sprint until you clear ' + SPRINT_TARGET + ' in a minute.' },
  ];
  /* A rough, honest estimate from what you've actually done, never from what you've read:
     graded answers (last 12 per area, on the 1-5 scale), Statement Flows accuracy and Sprint scores.
     An area needs about six graded answers or three game rounds before it counts in full. */
  function readiness(input) {
    const answers = input.answers || [], runs = (input.play && input.play.runs) || [], seats = input.seats || [];
    const gameRuns = g => runs.filter(rn => rn.g === g).slice(-5);
    const areas = AREAS.filter(a => !a.seats || a.seats.some(s => seats.includes(s))).map(a => {
      const parts = [];
      const arr = answers.filter(x => a.cats.includes(x.cat)).slice(-12);
      if (arr.length) {
        const avg = arr.reduce((s, x) => s + (+x.score || 0), 0) / arr.length;
        parts.push({ w: 0.6, v: Math.max(0, Math.min(1, (avg - 1) / 4)) * Math.min(1, arr.length / 6) });
      }
      if (a.game === 'flows') {
        const g = gameRuns('flows');
        if (g.length) parts.push({ w: 0.4, v: g.reduce((s, rn) => s + rn.score / (rn.total || 45), 0) / g.length * Math.min(1, g.length / 3) });
      }
      if (a.game === 'sprint') {
        const g = gameRuns('sprint');
        if (g.length) parts.push({ w: 1, v: Math.min(1, g.reduce((s, rn) => s + rn.score, 0) / g.length / SPRINT_TARGET) * Math.min(1, g.length / 3) });
      }
      const wsum = parts.reduce((s, p) => s + p.w, 0);
      const pct = wsum ? Math.round(parts.reduce((s, p) => s + p.w * p.v, 0) / wsum * 100) : 0;
      return { k: a.k, name: a.name, pct, seen: arr.length + (a.game ? gameRuns(a.game).length : 0), next: a.next, game: a.game || '' };
    });
    const overall = areas.length ? Math.round(areas.reduce((s, a) => s + a.pct, 0) / areas.length) : 0;
    const out = { overall, areas, weakest: areas.slice().sort((a, b) => a.pct - b.pct)[0] || null, expected: null, status: '', daysLeft: null, next: null };
    const pl = input.plan, t = input.today;
    if (pl && pl.start && pl.ready && t) {
      const span = Math.max(1, dayDiff(pl.start, pl.ready));
      const el = Math.max(0, Math.min(1, dayDiff(pl.start, t) / span));
      out.expected = Math.round(el * 100);
      out.daysLeft = dayDiff(t, pl.ready);
      out.status = overall >= out.expected - 10 ? 'on pace' : 'behind pace';
      const ev = (pl.events || []).filter(e => e.date >= t).sort((a, b) => (a.date < b.date ? -1 : 1))[0];
      if (ev) out.next = { name: ev.name, date: ev.date, days: dayDiff(t, ev.date) };
    }
    return out;
  }
  function dayDiff(a, b) {
    const f = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d, 12); };
    return Math.round((f(b) - f(a)) / 86400000);
  }

  return {
    rng, shuffle, newSeed, dailySeed, roomCode, fmtNum, fmtAnswer, UNIT_HINT, parseTyped, checkTyped, distract,
    KINDS, KIND_NAMES, mathQ, sprintRound, mathChoices,
    FLOW_ROWS, STMT_NAME, SCENARIOS, flowCalc, flowScenario, flowsRound, flowScore, flowChoices, acct, moveWords,
    LIVE_MIXES, liveQuestion, livePoints, liveBoard,
    cleanName, GAMES, challengeHash, parseChallenge, shareText,
    streak, activeDays, readiness, AREAS, SPRINT_TARGET, addDaysISO, dayDiff,
  };
})();
if (typeof module !== 'undefined' && module.exports) module.exports = Games;

</script>
<script>
/* ==========================================================================
   Finance Recruiting Coach: the coach's prompts
   Every call to Claude is memoryless, so each prompt carries the rules,
   the student's profile and the exact output format.
   ========================================================================== */
const Prompts = (() => {
  'use strict';
  const E = Engine;

  const RULES = [
    'You are a finance recruiting coach for one college student. Teach like a sharp second-year analyst who still remembers learning this: plain English first, then the precise version interviewers expect. Be direct when an answer is weak and specific about how to fix it.',
    '',
    'Ground rules:',
    "- Accuracy first. If you aren't sure of a figure, date or detail, leave it out or flag it as something to check. Never invent statistics, deals, quotes, people or news.",
    "- You can't browse the web and your knowledge has a cutoff. Never present anything as this week's news. When current events matter, tell the student exactly what to look up (the latest CPI release, a company's last earnings call) instead of guessing.",
    "- Don't invent facts about the student's school (clubs, programs, deadlines, alumni). When something depends on their school, tell them what to ask and whom to ask.",
    "- Pitch everything at the student's level and target seats.",
    '- American English. No emoji. No filler openers like "Great question".',
  ].join('\n');

  const LV = { new: 'brand new', some: 'some exposure', solid: 'solid' };
  const WORDS = { 10: 550, 20: 900, 30: 1300 };

  function longDate(isoStr) { return E.fmt(isoStr, { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' }); }

  /* ctx: { plan, item, today, weak: [{topic, score, q}], recent: [titles] } */
  function profileBlock(p, ctx, opts) {
    ctx = ctx || {};
    opts = opts || {};
    const L = [];
    const seats = p.seats.map(s => E.SEATS[s].label + (s === p.primary && p.seats.length > 1 ? ' (primary)' : '')).join(', ');
    L.push('Student: ' + (p.name || 'the student') + ', ' + p.year.toLowerCase() + ' at ' + p.school + (p.major ? ', studying ' + p.major : '') + '.');
    L.push('Target seats: ' + seats + '.');
    L.push('Firms on their list: ' + (p.firmList.length ? p.firmList.join(', ') : 'none chosen yet') + '.');
    if (p.goalList && p.goalList.length) L.push('Their goals: ' + p.goalList.join('; ') + '.');
    L.push('Self-rated starting level: accounting ' + LV[p.levels.acc] + ', valuation ' + LV[p.levels.val] + ', markets ' + LV[p.levels.mkt] + '.');
    if (p.interests) L.push('Markets and sectors they follow: ' + p.interests + '.');
    if (p.why) L.push('Why finance, in their words: ' + p.why.replace(/\s+/g, ' ').trim());
    if (p.experiences) L.push('Experiences they can draw on: ' + p.experiences.split(/\n+/).map(s => s.trim()).filter(Boolean).join('; ') + '.');
    if (opts.static) return L.join('\n');
    const today = ctx.today || E.todayISO();
    L.push('Today: ' + longDate(today) + '.');
    const plan = ctx.plan;
    if (plan && !plan.error) {
      const away = E.daysBetween(today, plan.ready);
      L.push('Interview-ready target: ' + longDate(plan.ready) + (away >= 0 ? ' (' + away + ' days away).' : ' (already passed).'));
      if (ctx.item) {
        const ph = plan.phases.find(x => x.n === ctx.item.phase);
        L.push('This session: day ' + ctx.item.day + ' of ' + plan.total + (ph ? ', phase "' + ph.name + '"' : '') + '.');
      }
      const up = plan.events.filter(e => e.date >= today).slice(0, 3);
      if (up.length) L.push('Coming up: ' + up.map(e => e.name + ' (' + E.EVENT_TYPES[e.type].toLowerCase() + ') on ' + E.fmt(e.date, { month: 'short', day: 'numeric' }) + ', ' + E.daysBetween(today, e.date) + ' days away' + (e.est ? ', date is an estimate' : '')).join('; ') + '.');
    }
    if (ctx.weak && ctx.weak.length) L.push('Weak spots to revisit (latest score out of 5): ' + ctx.weak.slice(0, 5).map(w => w.topic + ' (' + w.score + ')').join('; ') + '.');
    else L.push('Weak spots to revisit: none logged yet.');
    if (ctx.recent && ctx.recent.length) L.push('Recent lessons: ' + ctx.recent.slice(0, 5).join('; ') + '.');
    return L.join('\n');
  }

  /* ---------------- lessons ---------------- */
  function standardFormat(title, words, teaser, extra) {
    return [
      'Write today\'s lesson: "' + title + '".',
      extra || '',
      'Aim for about ' + words + ' words before the Answers section. Use Markdown with exactly these headings, in this order:',
      '',
      '# ' + title,
      '*Comes up in:* one line on how often this shows up in first-round interviews for the student\'s target seats.',
      '',
      '## Cold open',
      'One interview question on this topic, phrased the way an interviewer would ask it. Then one line telling the student to answer it out loud before reading on.',
      '',
      '## The big idea',
      'Two to four sentences in plain English, with one analogy.',
      '',
      '## How it works',
      'The mechanics, with a short worked example using simple numbers. Use a small table if it helps.',
      '',
      '## In the real world',
      'One real, well-documented example this concept explains (historical is fine). No invented current events. End with one line on what to watch in the news to see it live.',
      '',
      '## The interview trap',
      'The mistake most candidates make. Then a model answer they could say in about 60 seconds, as a blockquote.',
      '',
      '## Your line',
      'One sentence the student could drop into a "what\'s going on in the markets" or "why this matters" answer, the follow-up an interviewer would ask next, and the strongest counterargument.',
      '',
      '## Your turn',
      '1. **Say it out loud:** one question to answer in 60 seconds, after 30 seconds to think.',
      '2. **Rapid fire:** three short questions, labeled a, b and c.',
      '3. **Rewind:** one question on a weak spot or earlier lesson listed above. If none are listed, use a fundamental from an earlier topic.',
      '4. **Brain teaser:** one ' + teaser + ' mental math, probability, market sizing or logic question.',
      '',
      '## Answers',
      'Short answers to the rapid fire, the rewind and the brain teaser.',
      '',
      'Make it specific to this student: use their seats, interests and background where they genuinely fit. Start directly with the heading. No preamble, no sign-off.',
    ].filter(x => x !== null).join('\n');
  }

  const DRILL_SET = {
    car: 'Four numbered behavioral questions this student is likely to face. Under each, a STAR skeleton (situation, task, action, result) built from the experiences they listed, with [brackets] where they need specifics. If they listed no experiences, give the skeleton with prompts for what to fill in.',
    mkt: 'First, a fill-in-the-blanks 60-second markets answer with [brackets] for the live numbers. Then six numbered follow-up questions an interviewer might ask after it, easiest to hardest.',
    awm: 'Six numbered client scenarios (age, goal, situation and one twist), each ending with "What would you recommend, and why?"',
    inv: 'Six numbered pushback questions an interviewer would throw at a stock pitch, easiest to hardest. If the student follows a sector, frame them around a well-known company in it.',
    sto: 'Six numbered rapid questions on famous market events (what happened, why, and what it teaches), each answerable in 30 seconds.',
  };
  const DRILL_WARM = {
    mkt: "The five things to check before giving a markets answer today, and where to find each. Don't quote any figures from memory.",
  };

  function drillFormat(item, words) {
    const set = DRILL_SET[item.cat] || 'Six numbered interview questions for the student\'s target seats, easiest to hardest. Mix "walk me through" questions with short calculations and one curveball. No answers here.';
    const warm = DRILL_WARM[item.cat] || 'One quick question to get going.';
    return [
      'Write today\'s drill: "' + item.title + '". Focus: ' + (item.focus || (E.DRILLS[item.cat] || {}).focus || 'interview reps') + '.',
      'No new theory: this is interview practice at speed. Vary the questions from earlier rounds. Aim for about ' + words + ' words before the Answers section. Use Markdown with exactly these headings:',
      '',
      '# ' + item.title,
      '*Drill day:* one line on what today trains and how long a strong answer should take.',
      '',
      '## Warm-up',
      warm,
      '',
      '## The set',
      set,
      '',
      '## Stretch',
      'One harder question a top interviewer might use to separate candidates.',
      '',
      '## Your turn',
      'Tell the student to answer two questions from the set out loud with a 60-second timer, then get them graded.',
      '',
      '## Answers',
      'For the warm-up, every question in the set and the stretch: a concise model answer and the most common mistake.',
      '',
      'Start directly with the heading. No preamble, no sign-off.',
    ].join('\n');
  }

  function prepFormat(item, today) {
    const e = item.event;
    const away = E.daysBetween(today, e.date);
    const when = longDate(e.date) + (away > 0 ? ' (' + away + ' days away)' : away === 0 ? ' (today)' : ' (already passed)') + (e.est ? '. The date is an estimate, so the first task is to confirm it' : '');
    const note = e.note ? '\nThe student\'s note on it: ' + e.note : '';
    const F = {
      app: [
        'This is an application-prep session for "' + e.name + '", due ' + when + '.' + note,
        'Use Markdown with these headings, in order:',
        '# Application prep: ' + e.name,
        '## What they screen for',
        "What programs like this usually look for in an applicant like this student, and what makes an application forgettable. Where details depend on this specific program, say exactly what to check on its page.",
        '## Your angle',
        "Two or three specific ways the student's background maps to what they want. Name the experience you're drawing on.",
        '## The checklist',
        'A dated checklist from today to the deadline: resume, short answers or cover letter, who to ask for a review, when to submit. Use real dates.',
        '## Questions they might ask',
        'Four likely questions (behavioral and technical for this seat), one line each on how to approach them.',
        '## Your turn',
        'Two tasks to do today, each under 30 minutes.',
      ],
      int: [
        'This is interview prep for "' + e.name + '" on ' + when + '.' + note,
        'Use Markdown with these headings, in order:',
        '# Interview prep: ' + e.name,
        '## Know the seat',
        "What this role does day to day and what interviewers for it test. Where facts depend on the specific firm, say what to look up and where (the firm's site, recent press releases, alumni on LinkedIn).",
        "## The ten questions you'll most likely get",
        'Five behavioral and five technical questions for this seat, numbered, each with a one-line approach.',
        '## Your "why this firm" skeleton',
        "A fill-in-the-blanks answer built from the student's background, with [brackets] for firm facts they still need to research.",
        '## Questions to ask them',
        'Four sharp questions, and two to avoid.',
        '## Your turn',
        'Answer two of the ten questions out loud tonight, then get them graded.',
      ],
      net: [
        'This is prep for "' + e.name + '" on ' + when + ', a networking event or info session.' + note,
        'Use Markdown with these headings, in order:',
        '# Get ready for ' + e.name,
        '## Your 30-second intro',
        "Drafted from the student's background, in first person, ready to say out loud.",
        '## Three questions worth asking',
        'Specific, non-generic questions for people at this kind of event, and why each one lands.',
        '## Working the room',
        'How to start and end a conversation, and what to write down right after.',
        '## The follow-up',
        'A short follow-up email template with [brackets] for names and details.',
        '## Your turn',
        'Two things to do before the event.',
      ],
      club: [
        'This is prep for "' + e.name + '" on ' + when + ', a student club application or interview.' + note,
        'Use Markdown with these headings, in order:',
        '# Club prep: ' + e.name,
        '## What finance clubs look for',
        "What selective student finance clubs usually screen for, and the questions they commonly ask (often \"why us\", a basic technical and a stock pitch). Don't invent details about this club; say what to ask current members.",
        '## Your angle',
        "How the student's background fits, and which experience to lead with.",
        '## A two-minute stock pitch',
        'A skeleton they can fill in tonight, using a sector they follow if they listed one.',
        '## Likely questions',
        'Five questions, one line each on how to approach them.',
        '## Your turn',
        'Two tasks for today.',
      ],
      other: [
        'This is prep for "' + e.name + '" on ' + when + '.' + note,
        'Use Markdown with these headings, in order:',
        '# Get ready: ' + e.name,
        '## What it is and why it matters',
        '## How to prepare',
        'Concrete steps, dated where it helps.',
        '## Your turn',
        'Two tasks for today.',
      ],
      day: [
        'Today is interview day: "' + e.name + '".' + note + ' Keep it short and steady. This is a warm-up, not new material.',
        'Use Markdown with these headings, in order:',
        '# Interview day: ' + e.name,
        '## Ten-minute warm-up',
        'Three quick technical questions for the seat, each followed right away by its answer, plus one mental-math rep.',
        '## Your three stories',
        "Leadership, failure and teamwork: one line each, drawn from the student's listed experiences.",
        '## Your why',
        'A two-sentence "why this seat, why this firm" skeleton with [brackets].',
        '## Checklist',
        'Logistics for in-person or video (camera, mic, link, arriving early, water), and two questions to ask.',
        '## After',
        'What to write down right after, and a short thank-you note template.',
      ],
    };
    return (F[item.sub] || F.other).join('\n') + '\n\nMake it specific to this student. Start directly with the heading. No preamble, no sign-off.';
  }

  function firmFormat(item) {
    const f = item.firm;
    return [
      'This is a firm deep-dive on ' + f + ', to help the student answer "Why ' + f + '?".',
      'Use Markdown with these headings, in order:',
      '# Why ' + f + '?',
      "## What they're known for",
      'Only well-established facts: business lines, how they make money, what kind of firm they are. Flag anything that may have changed recently and should be checked (leadership, recent deals, rankings).',
      '## Research them in 30 minutes',
      "The exact places to look (latest annual report or shareholder letter, press releases, recent deal announcements, alumni from the student's school on LinkedIn) and what to pull from each.",
      '## Your answer, drafted',
      'A 45-second "Why ' + f + '?" answer for this student, built from their background, with [brackets] where they need facts from their own research.',
      '## Questions to ask them',
      'Three questions that show they did the work.',
      '## Your turn',
      'Fill in the brackets and say the answer out loud twice.',
      '',
      'Start directly with the heading. No preamble, no sign-off.',
    ].join('\n');
  }

  /* rev: { title, weak: {topic, score, q, fixes} | null, fallback } */
  function lesson(p, plan, item, ctx, rev) {
    const today = ctx.today || E.todayISO();
    const words = WORDS[p.minutes] || 900;
    let body;
    if (item.kind === 'drill') body = drillFormat(item, words);
    else if (item.kind === 'prep') body = prepFormat(item, today);
    else if (item.kind === 'firm') body = firmFormat(item);
    else {
      let extra = '';
      let title = item.title;
      if (item.kind === 'rev' && rev) {
        title = rev.title;
        extra = rev.weak
          ? 'This is a Rewind session. The student recently scored ' + rev.weak.score + '/5 on: "' + rev.weak.q + '".' + (rev.weak.fixes && rev.weak.fixes.length ? ' The main fixes noted were: ' + rev.weak.fixes.join('; ') + '.' : '') + ' Re-teach the idea from a different angle than a textbook would, and aim the Cold open and "Say it out loud" at exactly that gap.'
          : 'This is a Rewind session on an earlier topic. Re-teach it from a fresh angle and drill it.';
      }
      body = standardFormat(title, words, E.teaserLevel(plan, item), extra);
    }
    return RULES + '\n\n' + profileBlock(p, Object.assign({}, ctx, { plan, item })) + '\n\n' + body;
  }

  /* ---------------- grading ---------------- */
  const RUBRIC = 'Rubric: 5 = clearly passes a first round: correct, structured, concise. 4 = correct with small gaps or a bit long. 3 = partly right, or right but disorganized. 2 = major errors or missing the core idea. 1 = wrong, off-topic or blank.';

  function grade(p, ctx, q, a, context) {
    return [
      RULES, '', profileBlock(p, ctx), '',
      "Grade one interview answer the way a first-round interviewer for the student's target seats would, then coach. The answer may be dictated, so ignore filler words and typos.",
      '',
      'Context: ' + (context || 'practice drill') + '.',
      'Question: """' + q + '"""',
      'Answer: """' + a + '"""',
      '',
      RUBRIC,
      '',
      'Reply with only a JSON object in this shape:',
      '{"score": 1-5, "verdict": "one sentence", "strengths": ["up to two short points"], "fixes": ["up to three specific fixes, most important first"], "better": "a model answer they could say in about 60 seconds", "followUp": "the follow-up question an interviewer would ask next", "topic": "2-5 word topic tag"}',
    ].join('\n');
  }

  function mockGrade(p, ctx, qs, answers, fus) {
    const seat = E.SEATS[p.primary];
    fus = fus || [];
    return [
      RULES, '', profileBlock(p, ctx), '',
      'Grade this ' + qs.length + '-question mock interview for a ' + seat.role + ' role the way a first-round interviewer would, then coach. Answers may be dictated, so ignore filler words and typos. A blank answer scores 1. Where the interviewer asked a follow-up, score the question and its follow-up together.',
      '',
      qs.map((q, i) => 'Q' + (i + 1) + ' [' + E.CATS[q.cat].name + ']: ' + q.text + '\nAnswer: """' + ((answers[i] || '').trim() || '(no answer)') + '"""' +
        (fus[i] && fus[i].q ? '\nFollow-up: ' + fus[i].q + '\nAnswer: """' + ((fus[i].a || '').trim() || '(no answer)') + '"""' : '')).join('\n\n'),
      '',
      RUBRIC,
      '',
      'Reply with only a JSON object in this shape:',
      '{"overall": 1-5, "advance": true or false, "headline": "one sentence on how the interview went", "items": [{"score": 1-5, "feedback": "two sentences: what worked and the biggest fix", "better": "a model answer in about 60 spoken seconds", "topic": "2-5 word topic tag"}], "next": ["three specific things to work on this week"]}',
      'The items array must have exactly ' + qs.length + ' entries, in question order. "advance" means you would pass them to the next round.',
    ].join('\n');
  }

  /* ---------------- timeline suggestions ---------------- */
  function timeline(p, today) {
    const seats = p.seats.map(s => E.SEATS[s].label).join(', ');
    return [
      RULES, '',
      'Today is ' + longDate(today) + '. ' + (p.name || 'The student') + ' is a ' + p.year.toLowerCase() + ' at ' + (p.school || 'a U.S. university') + ', targeting ' + seats + (p.firmList.length ? ' (firms on their list: ' + p.firmList.join(', ') + ')' : '') + '.' + (p.goalList && p.goalList.length ? ' Their goals: ' + p.goalList.join('; ') + '.' : ''),
      '',
      'Suggest the key recruiting dates they should plan around over roughly the next 18 months, plus an "interview-ready by" date that leaves a cushion before the first interviews that matter. Base it on how recent recruiting cycles for these seats have run; they have been moving earlier, especially in investment banking. Don\'t invent school-specific details: for on-campus items, name the kind of event and its typical timing. Every date is an estimate, so say how confident you are in each note.',
      '',
      'Reply with only a JSON object in this shape:',
      '{"readyBy": "YYYY-MM-DD", "why": "one or two sentences", "events": [{"name": "short name", "date": "YYYY-MM-DD", "type": "application" | "interview" | "networking" | "club" | "other", "note": "one line: what it is and how sure you are"}]}',
      'Give 4 to 8 events, sorted by date, all after ' + today + '.',
    ].join('\n');
  }

  /* ---------------- chat ---------------- */
  const TOOL_RULES = [
    'You can read and change their plan with tools:',
    '- When they tell you about a deadline, interview, club application, info session or other event that has a date, add it with add_key_date. The plan then schedules prep sessions before it.',
    '- When a date moves or gets cancelled, use change_key_date. Use set_interview_ready_date and update_goals_and_firms only when they ask for that change or clearly state it.',
    '- Never invent or guess a date. Work out relative dates ("next Thursday") from today\'s date above. If they give no date, ask for it instead of adding anything.',
    '- After a change, say in one line what you changed and what the plan now has before it, using the tool result.',
    '- For questions about their schedule or progress, call get_schedule or get_scores instead of guessing.',
  ].join('\n');

  function chatPreamble(p, ctx, tools) {
    const plan = ctx.plan;
    let planLine = '';
    if (plan && !plan.error) {
      const today = ctx.today || E.todayISO();
      const it = E.itemOn(plan, today) || E.nextItem(plan, today);
      const next = plan.items.filter(x => x.date > today).slice(0, 3);
      planLine = '\nTheir plan: ' + (it ? (it.date === today ? "today's session is " : 'the next session is ') + '"' + it.title + '"' + (it.date !== today ? ' on ' + E.fmt(it.date) : '') + '. ' : '') + (next.length ? 'After that: ' + next.map(x => x.title).join('; ') + '.' : '');
      if (plan.events.length) planLine += '\nTheir key dates: ' + plan.events.map(e => e.name + ' (' + E.EVENT_TYPES[e.type].toLowerCase() + ', ' + e.date + (e.est ? ', estimate' : '') + ')').join('; ') + '.';
    }
    return [
      RULES, '', profileBlock(p, ctx) + planLine, '',
      "You're answering the student's questions in a chat. Keep answers tight: short paragraphs or a short list, usually under 200 words unless they ask for more. When something depends on a specific firm's or school's current dates or policies, say what's typical and tell them to confirm. Use Markdown sparingly.",
      tools ? '\n' + TOOL_RULES : "\nYou can't change their plan from this chat. If they mention a new date or goal, tell them to add it on the Setup tab.",
    ].join('\n');
  }

  /* ---------------- export for a Claude Project or any chat ---------------- */
  function projectInstructions(p, plan) {
    const words = WORDS[p.minutes] || 900;
    return [
      'You are my finance recruiting coach.',
      '',
      RULES.split('\n').slice(2).join('\n'),
      '',
      'About me:',
      profileBlock(p, {}, { static: true }),
      '',
      'My plan is in the attached file "recruiting-plan.md": every study day from ' + E.fmt(plan.start, { month: 'long', day: 'numeric', year: 'numeric' }) + ' to ' + E.fmt(plan.end, { month: 'long', day: 'numeric', year: 'numeric' }) + ', with my key dates. How to run it:',
      '- When I say "today\'s lesson", find today\'s date in the plan and teach that session. For a regular lesson use these sections: Cold open (an interview question), The big idea, How it works (with a worked example), In the real world, The interview trap (with a 60-second model answer), Your line, Your turn (say it out loud, three rapid-fire questions, a rewind on a weak spot, a brain teaser), and Answers. About ' + words + ' words.',
      '- On drill days, skip new theory: a warm-up, six interview questions easiest to hardest, a stretch question, then answers.',
      '- On mock interview days, run a five-question mock one question at a time with no feedback until the end, then score each answer 1 to 5 with fixes and a model answer.',
      '- Whenever I answer a question, grade it 1 to 5 (5 = would clearly pass a first round), tell me what worked, the top fixes and a better answer, then ask the follow-up an interviewer would ask.',
      '- Keep a running list of my weak spots from those grades and work them into later lessons.',
    ].join('\n');
  }

  /* ---------------- live follow-ups during an in-page mock (quick tier) ---------------- */
  function followUp(p, q, a) {
    return [
      'You are interviewing a ' + p.year.toLowerCase() + ' for a ' + E.SEATS[p.primary].role + ' role. You asked: "' + q + '"',
      'They answered: """' + String(a || '').trim() + '"""',
      'Ask ONE natural follow-up that reacts to what they actually said: probe a vague claim, a gap, a number or their reasoning, the way a real first-round interviewer would. One sentence, no feedback, no hints. If the answer is blank or off-topic, ask the original question a different way.',
      'Reply with only JSON: {"followUp": "your question"}',
    ].join('\n');
  }

  /* ---------------- hand-off prompts: opened in the visitor's own Claude chat ----------------
     Short enough to travel in a link. A chat may be able to search the web, so these ask for
     current examples with sources instead of ruling them out. */
  const clip = (s, n) => { s = String(s || '').replace(/\s+/g, ' ').trim(); return s.length > n ? s.slice(0, n - 1).trimEnd() + '…' : s; };
  const HANDOFF_RULES = "Be accurate: never invent figures, deals, quotes or details about my school. If you can search the web, use it for anything current and cite sources; if you can't, tell me what to look up.";
  const GRADE_RULES = 'When I answer, score it 1-5 (5 = would clearly pass a first round, 3 = partly right or disorganized, 1 = wrong or blank), say what worked, give the top fixes and a stronger 60-second version, then ask the follow-up a real interviewer would ask.';

  function aboutMe(p, ctx) {
    const seats = p.seats.map(s => E.SEATS[s].label.toLowerCase()).join(', ');
    const L = ['About me: ' + (p.name ? p.name + ', ' : '') + 'a ' + p.year.toLowerCase() + ' at ' + (p.school || 'a U.S. university') + (p.major ? ' studying ' + p.major : '') + ', aiming for ' + seats + (p.seats.length > 1 ? ' (mainly ' + E.SEATS[p.primary].label.toLowerCase() + ')' : '') + '.'];
    if (p.goalList && p.goalList.length) L.push('Goals: ' + clip(p.goalList.join('; '), 220) + '.');
    if (p.firmList && p.firmList.length) L.push('Firms on my list: ' + p.firmList.join(', ') + '.');
    L.push('Level: accounting ' + LV[p.levels.acc] + ', valuation ' + LV[p.levels.val] + ', markets ' + LV[p.levels.mkt] + '.');
    if (p.experiences) L.push('Experiences: ' + clip(E.splitLines(p.experiences).join('; '), 240) + '.');
    if (p.interests) L.push('I follow: ' + clip(p.interests, 100) + '.');
    if (ctx && ctx.weak && ctx.weak.length) L.push('Weak spots: ' + ctx.weak.slice(0, 3).map(w => w.topic).join('; ') + '.');
    return L.join(' ');
  }

  function handoffLesson(p, plan, item, ctx, rev) {
    const today = (ctx && ctx.today) || E.todayISO();
    const words = WORDS[p.minutes] || 900;
    if (item.kind === 'drill') {
      return ['Run a finance interview drill with me: "' + item.title + '" (' + (item.focus || 'interview reps') + '). No new theory.', aboutMe(p, ctx),
        'Ask me six questions one at a time, easiest to hardest, then one stretch question. After each answer, grade it and move on.', GRADE_RULES, HANDOFF_RULES].join('\n\n');
    }
    if (item.kind === 'prep') return [aboutMe(p, ctx), prepFormat(item, today).replace(/\n\nMake it specific to this student\..*$/s, ''), 'Make it specific to me.', HANDOFF_RULES].join('\n\n');
    if (item.kind === 'firm') return [aboutMe(p, ctx), firmFormat(item).replace(/\n\nStart directly with the heading\..*$/s, ''), HANDOFF_RULES].join('\n\n');
    const title = item.kind === 'rev' && rev ? rev.title : item.title;
    const weakNote = item.kind === 'rev' && rev && rev.weak ? ' I recently scored ' + rev.weak.score + '/5 on: "' + clip(rev.weak.q, 160) + '". Re-teach it from a new angle and aim the quiz at that gap.' : '';
    return [
      'Be my finance recruiting coach. Teach me today\'s lesson: "' + title + '".' + weakNote,
      aboutMe(p, ctx),
      'In about ' + words + ' words, in this order: an interview question for me to answer out loud before reading on; the big idea in plain English with one analogy; how it works, with a small worked example; a real example (this week\'s news if you can search, with sources, or a well-documented case); the trap most candidates fall into, with a 60-second model answer. Then quiz me: one question to answer out loud, three rapid-fire questions, one review question on an earlier topic and a ' + E.teaserLevel(plan, item) + ' brain teaser. Put the answers at the very end.',
      GRADE_RULES, HANDOFF_RULES,
    ].join('\n\n');
  }

  function handoffPersonalize(p, item, ctx) {
    return [
      'I\'m studying "' + item.title + '" for finance recruiting and I\'ve read a standard lesson on it. Make it mine: connect it to my background and target seats in a few short paragraphs, then quiz me one question at a time, starting with one I should answer out loud and going a level deeper each time.',
      aboutMe(p, ctx), GRADE_RULES, HANDOFF_RULES,
    ].join('\n\n');
  }

  function handoffGrade(p, q, a, context) {
    return [
      'Grade my answer to a finance interview question the way a first-round interviewer for ' + E.SEATS[p.primary].phrase + ' would. It may be dictated, so ignore filler and typos.' + (context ? ' (' + context + ')' : ''),
      'Question: ' + q,
      'My answer: ' + a,
      'Score it 1-5 (5 = would clearly pass a first round, 3 = partly right or disorganized, 1 = wrong or blank). Say what worked, give the top three fixes, most important first, and a stronger version I could say in about 60 seconds. Then ask me the follow-up you\'d ask next and grade my reply the same way.',
      'I\'m a ' + p.year.toLowerCase() + ' at ' + (p.school || 'a U.S. university') + '. ' + HANDOFF_RULES,
    ].join('\n\n');
  }

  function handoffMock(p, ctx, qs) {
    const firm = p.firmList && p.firmList.length ? p.firmList[0] : '';
    return [
      'Run a live first-round mock interview with me for a ' + E.SEATS[p.primary].role + ' role' + (firm ? ' at ' + firm : '') + '.',
      aboutMe(p, ctx),
      'Ask these questions one at a time, in order:\n' + qs.map((q, i) => (i + 1) + '. ' + q.text).join('\n'),
      'After each answer, ask at most one natural follow-up that reacts to what I actually said, then move on. Stay in character: no hints and no scores until the end. Then debrief: score each answer 1-5 with a one-line reason (5 = interview-ready, 3 = right idea but missing a key piece or rambling, 1 = wrong or blank), my best answer, my weakest answer rewritten tighter in my own voice, an honest verdict on whether I\'d advance, and one thing to fix this week.',
      'Start with question 1 now.',
    ].join('\n\n');
  }

  function handoffAsk(p, ctx, text) {
    const plan = ctx && ctx.plan;
    let planLine = '';
    if (plan && !plan.error) {
      const today = ctx.today || E.todayISO();
      const it = E.itemOn(plan, today) || E.nextItem(plan, today);
      planLine = 'My plan: interview-ready by ' + E.fmt(plan.ready, { month: 'long', day: 'numeric', year: 'numeric' }) + (it ? '; ' + (it.date === today ? 'today\'s session is "' : 'next up is "') + it.title + '"' : '') + '.' +
        (plan.events.length ? ' Key dates: ' + plan.events.filter(e => e.date >= today).slice(0, 5).map(e => e.name + ' (' + e.date + ')').join('; ') + '.' : '');
    }
    return [
      'You\'re my finance recruiting coach. ' + aboutMe(p, ctx) + (planLine ? ' ' + planLine : ''),
      'Keep answers tight: short paragraphs or a short list. ' + HANDOFF_RULES,
      'My question: ' + (String(text || '').trim() || 'What should I focus on this week?'),
    ].join('\n\n');
  }

  function handoffDates(p, today) {
    return [
      'Today is ' + longDate(today) + '. ' + aboutMe(p),
      'Suggest the recruiting dates I should plan around over the next 18 months for my target seats: club applications, early insight and sophomore programs, internship application windows and on-campus recruiting. Search the web for this cycle\'s actual dates if you can and cite sources; otherwise give typical timing and say how confident you are. Then suggest an "interview-ready by" date with a cushion before the first interviews that matter.',
      'Format: a short dated list, one line each on what it is. Don\'t invent details about my school; tell me what to ask the career center instead.',
    ].join('\n\n');
  }

  return {
    RULES, WORDS, profileBlock, lesson, grade, mockGrade, timeline, chatPreamble, projectInstructions,
    followUp, handoffLesson, handoffPersonalize, handoffGrade, handoffMock, handoffAsk, handoffDates,
  };
})();
if (typeof module !== 'undefined' && module.exports) module.exports = Prompts;

</script>
<script>
/* ==========================================================================
   Finance Recruiting Coach: calendar export
   Turns a plan into an .ics file that Google Calendar and Apple Calendar import:
   one timed event per study day (with a reminder) and an all-day event per key date.
   Pure functions, no DOM.
   ========================================================================== */
const Calendar = (() => {
  'use strict';
  const pad = n => String(n).padStart(2, '0');
  const enc = typeof TextEncoder !== 'undefined' ? new TextEncoder() : null;
  const bytes = s => (enc ? enc.encode(s).length : unescape(encodeURIComponent(s)).length);

  function stampUTC(d) {
    return d.getUTCFullYear() + pad(d.getUTCMonth() + 1) + pad(d.getUTCDate()) + 'T' + pad(d.getUTCHours()) + pad(d.getUTCMinutes()) + pad(d.getUTCSeconds()) + 'Z';
  }
  // floating local time: the event happens at 9:30 wherever the student is
  function floating(isoDate, hhmm, plusMinutes) {
    const [y, m, d] = isoDate.split('-').map(Number), [hh, mm] = hhmm.split(':').map(Number);
    const t = new Date(Date.UTC(y, m - 1, d, hh, mm + (plusMinutes || 0)));
    return t.getUTCFullYear() + pad(t.getUTCMonth() + 1) + pad(t.getUTCDate()) + 'T' + pad(t.getUTCHours()) + pad(t.getUTCMinutes()) + '00';
  }
  const dateOnly = isoDate => isoDate.replace(/-/g, '');
  function nextDay(isoDate) {
    const [y, m, d] = isoDate.split('-').map(Number), t = new Date(Date.UTC(y, m - 1, d + 1));
    return t.getUTCFullYear() + pad(t.getUTCMonth() + 1) + pad(t.getUTCDate());
  }
  function escText(s) { return String(s == null ? '' : s).replace(/\\/g, '\\\\').replace(/;/g, '\\;').replace(/,/g, '\\,').replace(/\r?\n/g, '\\n'); }
  // RFC 5545: lines longer than 75 octets continue on the next line after a space
  function fold(line) {
    if (bytes(line) <= 75) return line;
    let out = '', cur = '', n = 0, limit = 75;
    for (const ch of line) {
      const b = bytes(ch);
      if (n + b > limit) { out += cur + '\r\n '; cur = ''; n = 0; limit = 74; }
      cur += ch; n += b;
    }
    return out + cur;
  }
  const slugId = s => String(s).toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 40) || 'date';

  const KIND = { lesson: 'Lesson', drill: 'Drill', mock: 'Mock interview', prep: 'Prep session', firm: 'Firm deep-dive', rev: 'Rewind' };

  /* opts: { time 'HH:MM', minutes, from 'YYYY-MM-DD', link(date) => url, now Date, name } */
  function buildICS(plan, opts) {
    opts = opts || {};
    const time = /^([01]\d|2[0-3]):[0-5]\d$/.test(opts.time || '') ? opts.time : '09:30';
    const minutes = opts.minutes || 20, from = opts.from || plan.start;
    const stamp = stampUTC(opts.now || new Date());
    const link = typeof opts.link === 'function' ? opts.link : () => '';
    const L = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Finance Recruiting Coach//Plan//EN', 'CALSCALE:GREGORIAN', 'METHOD:PUBLISH',
      'X-WR-CALNAME:' + escText(opts.name || 'Recruiting coach')];
    let sessions = 0, dates = 0;
    plan.items.filter(it => it.date >= from).forEach(it => {
      const url = link(it.date);
      L.push('BEGIN:VEVENT',
        'UID:session-' + it.date + '@finance-recruiting-coach',
        'DTSTAMP:' + stamp,
        'DTSTART:' + floating(it.date, time),
        'DTEND:' + floating(it.date, time, minutes),
        'SUMMARY:' + escText('Coach: ' + it.title),
        'DESCRIPTION:' + escText((KIND[it.kind] || 'Session') + ' · day ' + it.day + ' of ' + plan.total + (it.event ? ' · for ' + it.event.name : '') + (url ? '\nOpen it: ' + url : '')),
        ...(url ? ['URL:' + url] : []),
        'BEGIN:VALARM', 'ACTION:DISPLAY', 'DESCRIPTION:' + escText("Today's recruiting session"), 'TRIGGER:PT0M', 'END:VALARM',
        'END:VEVENT');
      sessions++;
    });
    (plan.events || []).filter(e => e.date >= from).forEach(e => {
      L.push('BEGIN:VEVENT',
        'UID:date-' + e.date + '-' + slugId(e.name) + '@finance-recruiting-coach',
        'DTSTAMP:' + stamp,
        'DTSTART;VALUE=DATE:' + dateOnly(e.date),
        'DTEND;VALUE=DATE:' + nextDay(e.date),
        'SUMMARY:' + escText(e.name + (e.est ? ' (estimated date)' : '')),
        'DESCRIPTION:' + escText('Key date from your recruiting plan.' + (e.note ? '\n' + e.note : '')),
        'TRANSP:TRANSPARENT',
        'BEGIN:VALARM', 'ACTION:DISPLAY', 'DESCRIPTION:' + escText('Tomorrow: ' + e.name), 'TRIGGER:-PT15H', 'END:VALARM',
        'END:VEVENT');
      dates++;
    });
    L.push('END:VCALENDAR');
    return { text: L.map(fold).join('\r\n') + '\r\n', sessions, dates };
  }

  return { buildICS, fold, escText };
})();
if (typeof module !== 'undefined' && module.exports) module.exports = Calendar;

</script>
<script>
/* ==========================================================================
   Finance Recruiting Coach: voice answers
   Speech-to-text through the browser's own Web Speech API (Chrome, Edge, Safari),
   plus delivery stats: time, words per minute and filler words.
   stats() and verdicts() are pure; Recorder needs a browser.
   ========================================================================== */
const Voice = (() => {
  'use strict';
  // "um" and "uh" are often dropped by speech-to-text, so the count is a floor, not a measurement
  const FILLERS = [
    ['um', /\bu+m+\b/gi], ['uh', /\bu+h+\b/gi], ['like', /\blike\b(?!\s+(?:to|a|an|the|this|that|it)\b)/gi],
    ['you know', /\byou know\b/gi], ['I mean', /\bi mean\b/gi], ['sort of', /\bsort of\b/gi], ['kind of', /\bkind of\b/gi],
    ['basically', /\bbasically\b/gi], ['literally', /\bliterally\b/gi],
  ];

  function stats(text, seconds) {
    const t = String(text || '');
    const words = (t.match(/[A-Za-z0-9][A-Za-z0-9'’$%.,-]*/g) || []).length;
    const secs = Math.max(0, Math.round(seconds || 0));
    const wpm = secs >= 5 && words ? Math.round(words / (secs / 60)) : null;
    const fillers = FILLERS.map(([w, re]) => [w, (t.match(re) || []).length]).filter(x => x[1] > 0).sort((a, b) => b[1] - a[1]);
    return { seconds: secs, words, wpm, fillers, fillerCount: fillers.reduce((s, x) => s + x[1], 0) };
  }

  const mmss = s => Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');

  /* plain-English feedback on delivery; tone is 'good' or 'warn' */
  function verdicts(st) {
    const out = [];
    if (st.words < 8) return out;
    if (st.seconds > 90) out.push({ tone: 'warn', text: 'Ran ' + mmss(st.seconds) + '. Most answers should land in about 60 seconds.' });
    else if (st.seconds >= 40) out.push({ tone: 'good', text: 'Good length at ' + mmss(st.seconds) + '.' });
    else if (st.seconds >= 15) out.push({ tone: 'warn', text: 'Short at ' + mmss(st.seconds) + '. A full answer usually takes 45 to 75 seconds.' });
    if (st.wpm) {
      if (st.wpm > 175) out.push({ tone: 'warn', text: st.wpm + ' words a minute is fast. Slow down and land each point.' });
      else if (st.wpm < 105) out.push({ tone: 'warn', text: st.wpm + ' words a minute is slow. Cut the long pauses.' });
      else out.push({ tone: 'good', text: st.wpm + ' words a minute is a comfortable pace.' });
    }
    if (st.fillerCount >= 3) out.push({ tone: 'warn', text: st.fillerCount + ' filler words caught (' + st.fillers.slice(0, 3).map(f => f[0] + ' ×' + f[1]).join(', ') + '). Pause instead.' });
    else if (st.words >= 40) out.push({ tone: 'good', text: st.fillerCount ? 'Only ' + st.fillerCount + ' filler word' + (st.fillerCount === 1 ? '' : 's') + ' caught.' : 'No filler words caught.' });
    return out;
  }

  function supported() {
    return typeof window !== 'undefined' && !!(window.SpeechRecognition || window.webkitSpeechRecognition);
  }

  /* handlers: { onText(text), onEnd({text, seconds}), onError(code) } */
  function Recorder(handlers) {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    let rec = null, finalText = '', interim = '', startedAt = 0, stopping = false, restarts = 0, ended = false;
    const done = () => {
      if (ended) return;
      ended = true;
      handlers.onEnd({ text: (finalText + interim).replace(/\s+/g, ' ').trim(), seconds: (Date.now() - startedAt) / 1000 });
    };
    function wire(r) {
      r.onresult = e => {
        interim = '';
        for (let i = e.resultIndex; i < e.results.length; i++) {
          const res = e.results[i];
          if (res.isFinal) finalText += res[0].transcript.trim() + ' ';
          else interim += res[0].transcript;
        }
        handlers.onText((finalText + interim).replace(/\s+/g, ' ').trim());
      };
      r.onerror = e => {
        if (e.error === 'no-speech' || e.error === 'aborted') return;
        stopping = true;
        handlers.onError(e.error || 'error');
      };
      // Chrome ends a session after a pause; keep listening until the student presses Stop
      r.onend = () => {
        if (!stopping && restarts < 30) {
          restarts++;
          try { r.start(); return; } catch (err) { /* fall through */ }
        }
        done();
      };
    }
    return {
      start(lang) {

<script>
const LIBRARY = {"car-the-map-of-finance-sell-side-vs-buy-side-and-whe":{"title":"The map of finance: sell side vs. buy side, and where every seat fits","cat":"car","slug":"the-map-of-finance-sell-side-vs-buy-side-and-where-every","md":"# The map of finance: sell side vs. buy side, and where every seat fits\n*Comes up in:* Almost every first conversation, as \"What do you know about the industry?\" or \"Why this seat over the others?\"\n\n## Cold open\n\"Walk me through the difference between the sell side and the buy side.\"\n\nAnswer it out loud before you read on.\n\n## The big idea\nFinance is a marketplace for money. The **sell side** helps companies and investors get things done, like raising money, buying a company or trading a security, and it gets paid fees, commissions or trading spreads for the service. The **buy side** has money to invest and gets paid based on how much it manages and how well it invests. Think of a house sale: the sell side is the real estate agent, paid when the deal closes. The buy side is the buyer, who lives with the result.\n\n## How it works\nHere's where each seat sits, what a first-year actually does, and how the firm makes money.\n\n| Seat | What a first-year does | How the firm gets paid |\n|---|---|---|\n| Investment banking (sell) | Builds models and pitch books for mergers, IPOs and debt deals | Advisory and underwriting fees, mostly when deals close |\n| Sales & trading (sell) | Quotes prices, manages risk, talks markets with clients | Bid-ask spreads, commissions, financing |\n| Equity research (sell) | Models companies and writes reports with ratings | Supports the bank's trading and client relationships |\n| Asset management (buy) | Researches stocks or bonds for funds | A percentage of assets under management |\n| Hedge funds (buy) | Researches ideas for a fund that can bet up or down | A management fee plus a share of profits |\n| Private equity (buy) | Evaluates and buys whole companies, often with debt | A management fee plus carried interest |\n| Wealth management | Builds portfolios and plans for individuals and families | Fees on client assets, sometimes commissions |\n\nTwo patterns matter. First, the test for which side a firm is on: does it get paid for completing transactions, or for managing money? Second, the sell side hires far more undergraduates, so many people start there and move to the buy side after two or three years. Wealth management is its own world: it invests like the buy side, but its client is a person, so the work mixes portfolio decisions with planning and relationships.\n\n## In the real world\nThe 2008 crisis redrew this map. In September 2008, Goldman Sachs and Morgan Stanley converted into bank holding companies to get access to Federal Reserve support. The Volcker Rule, part of the 2010 Dodd-Frank Act, then limited banks' trading with their own money, and much of that activity moved to hedge funds. Banks went looking for steadier revenue: Morgan Stanley took over Smith Barney's brokerage between 2009 and 2013 and bought E*Trade in 2020, turning wealth management into its largest business. To see the map moving today, read a big bank's quarterly earnings release and compare how fast advisory, trading and wealth revenue are growing.\n\n## The interview trap\nMost candidates say the sell side \"sells stocks\" and the buy side \"buys stocks.\" That's a guess dressed up as an answer. Define the sides by who the client is and how the firm gets paid.\n\n> The sell side provides services to companies and investors: raising capital, advising on mergers, making markets and publishing research. It earns fees, commissions and trading spreads, mostly when transactions happen. The buy side manages money. Asset managers, hedge funds, private equity and venture firms invest capital for clients or their own funds, and they're paid a percentage of the assets plus, for hedge funds and private equity, a share of the profits. So the simplest test is whether a firm gets paid for transactions or for performance. Wealth management sits close to the buy side, but its clients are individuals and families, so the job blends portfolio work with planning. Many people start on the sell side, where firms hire more undergraduates, and move to the buy side later.\n\n## Your line\n\"The cleanest way to tell the sides apart is how they get paid: the sell side for transactions, the buy side for performance.\" **Follow-up you'll get:** \"So which side do you want to start on, and why?\" **The other side:** The line blurs. Big banks run asset and wealth management arms, and the largest asset managers trade at a scale that looks a lot like the sell side.\n\n## Your turn\n1. **Say it out loud:** Pick the seat you're most drawn to and explain in 60 seconds what a first-year does there and how the firm makes money.\n2. **Rapid fire:**\n   a. Is equity research on the buy side or the sell side?\n   b. How does a private equity firm get paid?\n   c. Name two ways a sell-side trading desk makes money.\n3. **Rewind:** In one sentence each, what is a stock and what is a bond?\n4. **Brain teaser:** What's 15% of 360?\n\n## Answers\n- **Say it out loud:** A strong answer names concrete first-year work (models, pitch books, client portfolios), who the client is, how the firm earns money (transaction fees vs. assets and performance), and one honest reason the seat fits you.\n- **a.** The sell side. A bank's research supports its trading and client business; buy-side firms employ their own analysts.\n- **b.** A management fee on the capital it manages (often around 1.5% to 2% a year) plus carried interest, usually about 20% of profits above a minimum return.\n- **c.** Earning the bid-ask spread by making markets, plus commissions and financing, such as lending to hedge funds.\n- **Rewind:** A stock is a slice of ownership in a company; a bond is a loan to a company or government that pays interest.\n- **Brain teaser:** 54. Ten percent is 36 and five percent is 18, so 15% is 36 + 18.\n","answers":{"Cold open":"The sell side provides services to companies and investors: raising capital, advising on mergers, making markets and publishing research. It earns fees, commissions and trading spreads, mostly when transactions happen. The buy side manages money. Asset managers, hedge funds, private equity and venture firms invest capital for clients or their own funds, and they're paid a percentage of the assets plus, for hedge funds and private equity, a share of the profits. So the simplest test is whether a firm gets paid for transactions or for performance. Wealth management sits close to the buy side, but its clients are individuals and families, so the job blends portfolio work with planning. Many people start on the sell side, where firms hire more undergraduates, and move to the buy side later.","Say it out loud":"A strong answer names concrete first-year work (models, pitch books, client portfolios), who the client is, how the firm earns money (transaction fees vs. assets and performance), and one honest reason the seat fits you.","Rapid fire a":"The sell side. A bank's research supports its trading and client business; buy-side firms employ their own analysts.","Rapid fire b":"A management fee on the capital it manages (often around 1.5% to 2% a year) plus carried interest, usually about 20% of profits above a minimum return.","Rapid fire c":"Earning the bid-ask spread by making markets, plus commissions and financing, such as lending to hedge funds.","Rewind":"A stock is a slice of ownership in a company; a bond is a loan to a company or government that pays interest.","Brain teaser":"54. Ten percent is 36 and five percent is 18, so 15% is 36 + 18."}},"car-tell-me-about-yourself-turning-your-resume-into-":{"title":"\"Tell me about yourself\": turning your resume into a 60-second story","cat":"car","slug":"tell-me-about-yourself-turning-your-resume-into-a-60-second","md":"# \"Tell me about yourself\": turning your resume into a 60-second story\n*Comes up in:* Nearly every interview, usually as the first question, and it sets the tone for the next 30 minutes.\n\n## Cold open\n\"Tell me about yourself.\"\n\nAnswer it out loud before you read on.\n\n## The big idea\nThis isn't your life story or your resume read aloud. It's a 60-to-90-second argument that you belong in this seat, with a beginning, a middle and an end: what got you into finance, the two or three experiences that prove you're serious, and why this job is the logical next step. Think of it as a movie trailer. A trailer doesn't show every scene; it shows the scenes that make you want to see the movie.\n\n## How it works\nUse three beats and give each a time budget.\n\n| Beat | What it covers | Time |\n|---|---|---|\n| Hook | Who you are, plus one line on what sparked your interest in finance | About 10 seconds |\n| Proof | Two or three experiences, one or two sentences each, with a result | About 45 seconds |\n| Why here | What you want next and why this seat fits | About 15 seconds |\n\nPick proof points that show what the job needs: curiosity about markets, quantitative ability, work ethic, teamwork and leadership. Here's a fictional example, so you can see the shape:\n\n\"I'm a sophomore studying economics. I got into finance through my family's restaurant: in high school I helped with the books and saw how much a slow month hurt our cash, even when we were profitable. Since then I've tried to get closer to markets. I'm on the research team of my school's investment club, where my pitch on a regional bank was voted into our portfolio, and last summer I worked at a local advisory firm preparing review packets for about 40 client households. I also coach youth basketball, which taught me to explain hard things simply. That's why I'm interested in wealth management: it combines the analysis I enjoy with long-term relationships with clients.\"\n\nWhat to cut from most first drafts: hometown details, your GPA and classes (they're on the resume), every activity you've ever done, and adjectives with no evidence behind them, like \"hardworking\" or \"passionate.\"\n\n## In the real world\nTimed answers are now normal. Since around 2016, when Goldman Sachs moved many first-round interviews to recorded video, large banks have used recorded interviews that give you a fixed window to respond, often a couple of minutes, with no interviewer nodding along. A tight 60-to-90-second story fits that window and survives a live interviewer who cuts in. To practice for it, record yourself on your phone with a timer, then watch it once. It's painful, and it works.\n\n## The interview trap\nThe trap is walking chronologically through everything you've done since high school. You run long, the best material gets buried, and the interviewer stops listening.\n\n> I'm a sophomore studying economics, and I got interested in finance through my family's restaurant, where I helped with the books and saw how a slow month could squeeze our cash even when we were profitable. Since then I've tried to get closer to markets. I'm on the research team of my school's investment club, where my pitch on a regional bank was voted into our portfolio, and last summer I worked at a local advisory firm, preparing review packets for about 40 client households. Coaching youth basketball has taught me to explain complicated things simply. That's what draws me to wealth management: it combines the analysis I enjoy with long-term client relationships, and I'd like to start building those skills here.\n\n## Your line\n\"Every story in my answer earns its place by showing a skill the job needs.\" **Follow-up you'll get:** \"Which of those experiences was the hardest, and why?\" **The other side:** Some interviewers want a quick chronological walk through the resume. Read the room, but keep it under 90 seconds either way.\n\n## Your turn\n1. **Say it out loud:** Give your own \"tell me about yourself\" in under 90 seconds, with a hook, two proof points that each include a number, and a why-this-seat close.\n2. **Rapid fire:**\n   a. About how long should your answer be?\n   b. Name two things to cut from most first drafts.\n   c. What should your last sentence do?\n3. **Rewind:** What's the difference between the sell side and the buy side, in one sentence?\n4. **Brain teaser:** A bat and a ball cost $1.10 together. The bat costs $1.00 more than the ball. How much is the ball?\n\n## Answers\n- **Say it out loud:** A strong answer runs 60 to 90 seconds; opens with a one-line origin; uses two or three experiences that show finance-relevant skills with concrete results; ends by connecting to this seat; and sounds natural rather than memorized word for word.\n- **a.** 60 to 90 seconds, and never more than two minutes.\n- **b.** Any two of: hometown or biography details, your GPA and classes, a full list of activities, adjectives with no evidence.\n- **c.** Say why this seat (and firm) is your logical next step, which hands the conversation back to the interviewer.\n- **Rewind:** The sell side gets paid for transactions and services; the buy side gets paid for managing money and how it performs.\n- **Brain teaser:** 5 cents. If the ball is x, the bat is x + $1.00, so 2x + $1.00 = $1.10 and x = $0.05.\n","answers":{"Cold open":"I'm a sophomore studying economics, and I got interested in finance through my family's restaurant, where I helped with the books and saw how a slow month could squeeze our cash even when we were profitable. Since then I've tried to get closer to markets. I'm on the research team of my school's investment club, where my pitch on a regional bank was voted into our portfolio, and last summer I worked at a local advisory firm, preparing review packets for about 40 client households. Coaching youth basketball has taught me to explain complicated things simply. That's what draws me to wealth management: it combines the analysis I enjoy with long-term client relationships, and I'd like to start building those skills here.","Say it out loud":"A strong answer runs 60 to 90 seconds; opens with a one-line origin; uses two or three experiences that show finance-relevant skills with concrete results; ends by connecting to this seat; and sounds natural rather than memorized word for word.","Rapid fire a":"60 to 90 seconds, and never more than two minutes.","Rapid fire b":"Any two of: hometown or biography details, your GPA and classes, a full list of activities, adjectives with no evidence.","Rapid fire c":"Say why this seat (and firm) is your logical next step, which hands the conversation back to the interviewer.","Rewind":"The sell side gets paid for transactions and services; the buy side gets paid for managing money and how it performs.","Brain teaser":"5 cents. If the ball is x, the bat is x + $1.00, so 2x + $1.00 = $1.10 and x = $0.05."}},"car-your-why-finance-story-an-answer-only-you-could-":{"title":"Your \"why finance\" story: an answer only you could give","cat":"car","slug":"your-why-finance-story-an-answer-only-you-could-give","md":"# Your \"why finance\" story: an answer only you could give\n*Comes up in:* Every first round and most club interviews, usually alongside \"why this seat\" and \"why our firm.\"\n\n## Cold open\n\"Why finance?\"\n\nAnswer it out loud before you read on.\n\n## The big idea\n\"I like money\" and \"I like fast-paced environments\" are answers anyone could give, so they tell the interviewer nothing. A strong answer is specific to you. It has a **spark** (a real moment that got you interested), a **follow-through** (what you did about it, which proves the interest is real) and a **fit** (why the actual work of the seat suits you). Think of it as a stock pitch where you're the stock: a thesis, the evidence, and why it matters for this buyer.\n\n## How it works\nBuild each part from your own life.\n\n- **Spark:** a concrete moment. A family business, an investment that went wrong, a class that clicked, a job where you saw money decisions up close.\n- **Follow-through:** proof. A club role, a pitch you built, a course you finished, investing your own money with a written process, reading earnings releases every quarter.\n- **Fit:** the work, not the lifestyle. Analysis that leads to a decision, explaining it to people, working on deals in a team, building long-term client relationships.\n\nHere's how weak answers turn into strong ones.\n\n| Weak | Why it's weak | Stronger |\n|---|---|---|\n| \"I've always loved finance.\" | No evidence | \"My first stock fell 30% after an earnings report I hadn't read, and I wanted to understand what I'd missed.\" |\n| \"It's fast-paced and challenging.\" | True of many jobs | \"I like problems where the numbers settle the argument, like defending my club's pitch.\" |\n| \"I want to make a lot of money.\" | Turns interviewers off | Leave it out. Talk about growth and the work. |\n\n## In the real world\nThe best origin stories come with a lesson, not just a moment. Warren Buffett bought his first stock at age 11: three shares of Cities Service preferred at about $38. It fell to around $27, he sold when it got back to $40, and then watched it climb to roughly $200. He has told that story for decades because of what it taught him about patience and not anchoring to the price you paid. Your story doesn't need to be famous; it needs a moment, a lesson and what you did next. Keep a short note on why you made each investment decision so you have real examples to draw on.\n\n## The interview trap\nThe trap is going generic or going long. A two-minute biography loses the interviewer, and a vague answer sounds like everyone else's.\n\n> My interest started in high school, when I bought my first stock, a company I used every day, and it dropped 25% after an earnings report I hadn't even read. I wanted to understand what I'd missed, so I taught myself to read financial statements, joined my school's investment club and started writing a short thesis before every investment I make. What I found is that I like the combination of hard analysis and having to defend a view to other people. That's what draws me to asset management: you build a view from the numbers, and then you have to convince a portfolio manager with it.\n\n## Your line\n\"The best why-finance answers have a moment, a follow-through and a fit.\" **Follow-up you'll get:** \"Why not consulting?\" or \"What would you do if this didn't work out?\" **The other side:** Some interviewers care less about your story and more about whether you understand the job. Make sure the fit part describes the work accurately.\n\n## Your turn\n1. **Say it out loud:** Answer \"Why finance?\" in 60 seconds with a spark, a follow-through and a fit.\n2. **Rapid fire:**\n   a. Why is \"I like fast-paced environments\" a weak answer?\n   b. What's one way to prove your interest besides saying it?\n   c. How should \"why finance\" differ from \"why this seat\"?\n3. **Rewind:** What are the three beats of a strong \"tell me about yourself\"?\n4. **Brain teaser:** What is 17 × 24?\n\n## Answers\n- **Say it out loud:** A strong answer names a specific moment, shows concrete actions you took afterward, connects to the real work of the seat, avoids money and empty adjectives, and lands in about 60 seconds.\n- **a.** It's true of many jobs, so it says nothing about finance or about you.\n- **b.** Point to action: a club role, a pitch you built, a course you completed, or a habit such as reading earnings releases.\n- **c.** \"Why finance\" explains your interest in the field; \"why this seat\" shows you understand that specific job and why it suits you better than the alternatives.\n- **Rewind:** A hook (who you are and what sparked your interest), proof (two or three experiences with results) and why this seat now.\n- **Brain teaser:** 408. 17 × 25 = 425, then subtract one 17.\n","answers":{"Cold open":"My interest started in high school, when I bought my first stock, a company I used every day, and it dropped 25% after an earnings report I hadn't even read. I wanted to understand what I'd missed, so I taught myself to read financial statements, joined my school's investment club and started writing a short thesis before every investment I make. What I found is that I like the combination of hard analysis and having to defend a view to other people. That's what draws me to asset management: you build a view from the numbers, and then you have to convince a portfolio manager with it.","Say it out loud":"A strong answer names a specific moment, shows concrete actions you took afterward, connects to the real work of the seat, avoids money and empty adjectives, and lands in about 60 seconds.","Rapid fire a":"It's true of many jobs, so it says nothing about finance or about you.","Rapid fire b":"Point to action: a club role, a pitch you built, a course you completed, or a habit such as reading earnings releases.","Rapid fire c":"\"Why finance\" explains your interest in the field; \"why this seat\" shows you understand that specific job and why it suits you better than the alternatives.","Rewind":"A hook (who you are and what sparked your interest), proof (two or three experiences with results) and why this seat now.","Brain teaser":"408. 17 × 25 = 425, then subtract one 17."}},"car-what-s-going-on-in-the-markets-a-daily-habit-and":{"title":"\"What's going on in the markets?\": a daily habit and a 60-second answer","cat":"car","slug":"what-s-going-on-in-the-markets-a-daily-habit-and-a-60","md":"# \"What's going on in the markets?\": a daily habit and a 60-second answer\n*Comes up in:* Most first rounds, especially asset management, wealth management and sales & trading, as an opener or a closer.\n\n## Cold open\n\"What's going on in the markets right now?\"\n\nAnswer it out loud before you read on.\n\n## The big idea\nThe interviewer is testing two things: whether you actually follow markets, and whether you can connect a headline to a cause and an effect. A good answer picks one or two themes, gives the numbers that matter, explains why it's happening, and says what you're watching next. Think of a weather report: today's conditions, the front that's causing them, and the forecast.\n\n## How it works\nBuild a ten-minute morning habit.\n\n| Check | Where | What to note |\n|---|---|---|\n| The big indexes | S&P 500, Nasdaq, Dow | Level and move this week |\n| Rates | 10-year Treasury yield, the fed funds rate | Direction and the reason |\n| The economy | Latest CPI, jobs report, GDP | Above or below expectations |\n| Big moves | Oil, gold, the dollar | Only if something moved a lot |\n| One story | A deal, an earnings report, a sector | Your own view on it |\n\nGood sources: the Wall Street Journal, Bloomberg, the Financial Times, Reuters, CNBC, the Fed's own statements and companies' earnings releases.\n\nThen use four steps for the answer: **theme** (what's happening), **driver** (why, with one or two numbers), **implication** (what it means for stocks, bonds or a sector) and **what's next** (what you're watching, plus your view). Fill in the brackets with this week's numbers:\n\n\"The big story is [inflation cooling faster than expected]. [CPI] came in at [x]% against [y]% expected, so the 10-year yield fell to about [z]% and growth stocks rallied. What I'm watching is whether the Fed signals [cuts] at its meeting on [date].\"\n\n## In the real world\nHere's what a strong answer looked like in March 2023. Silicon Valley Bank failed on March 10 after depositors tried to pull about $42 billion in a single day, and two days later regulators guaranteed all its deposits. Investors rushed into Treasuries and bet the Fed would slow its rate hikes, and two-year Treasury yields had their biggest three-day drop since 1987. A candidate who connected bank stress to rate expectations to bond prices sounded like they followed markets. One who only said \"a bank failed\" didn't. This week, check the latest CPI release and the date of the next Fed meeting before any interview.\n\n## The interview trap\nThe trap is listing headlines without the cause and effect, naming a stock without a single number, or quoting a number you're not sure of. If you aren't sure of a figure, say \"roughly\" or leave it out.\n\n> In March 2023, a strong answer sounded like this: The big story is stress in regional banks. Silicon Valley Bank failed after depositors pulled tens of billions of dollars in a day, and regulators stepped in to guarantee deposits. That changed the rate outlook: two-year Treasury yields had their biggest three-day drop since 1987, as investors bet the Fed would slow its hikes. I'm watching deposit flows at other regional banks and whether the Fed still raises rates at its next meeting. My view is that the banking system is better capitalized than in 2008, but banks with lots of uninsured deposits and long-dated bonds are vulnerable.\n\n## Your line\n\"A markets answer is one theme, the numbers behind it, why it's happening and what I'm watching next.\" **Follow-up you'll get:** \"What would change your view?\" **The other side:** Markets move on expectations, not just news. A \"good\" number can push prices down if investors expected better, so always say what was expected.\n\n## Your turn\n1. **Say it out loud:** Look up this week's numbers, then give a 60-second markets update using theme, driver, implication and what's next.\n2. **Rapid fire:**\n   a. Name four things to check every morning.\n   b. Why do you compare an economic release to expectations?\n   c. What's the difference between the fed funds rate and the 10-year Treasury yield?\n3. **Rewind:** What are the three parts of a strong \"why finance\" answer?\n4. **Brain teaser:** A stock rises 50% and then falls 50%. Where does it end up?\n\n## Answers\n- **Say it out loud:** A strong answer picks one theme instead of five headlines, uses at least two accurate, current numbers, explains the cause and the effect on prices, and ends with what you're watching and your own view.\n- **a.** Index levels, interest rates (the 10-year yield and the Fed), the latest economic data, and one company or sector story, plus any big move in oil, gold or the dollar.\n- **b.** Prices already reflect what investors expect, so markets react to the surprise, not the number itself.\n- **c.** The fed funds rate is the Fed's target for overnight lending between banks; the 10-year yield is set by investors and reflects expectations for growth, inflation and rates over ten years.\n- **Rewind:** A spark (a specific moment), a follow-through (what you did about it) and a fit (why the work of the seat suits you).\n- **Brain teaser:** It ends 25% below where it started: 100 rises to 150, then falls 50% to 75.\n","answers":{"Cold open":"In March 2023, a strong answer sounded like this: The big story is stress in regional banks. Silicon Valley Bank failed after depositors pulled tens of billions of dollars in a day, and regulators stepped in to guarantee deposits. That changed the rate outlook: two-year Treasury yields had their biggest three-day drop since 1987, as investors bet the Fed would slow its hikes. I'm watching deposit flows at other regional banks and whether the Fed still raises rates at its next meeting. My view is that the banking system is better capitalized than in 2008, but banks with lots of uninsured deposits and long-dated bonds are vulnerable.","Say it out loud":"A strong answer picks one theme instead of five headlines, uses at least two accurate, current numbers, explains the cause and the effect on prices, and ends with what you're watching and your own view.","Rapid fire a":"Index levels, interest rates (the 10-year yield and the Fed), the latest economic data, and one company or sector story, plus any big move in oil, gold or the dollar.","Rapid fire b":"Prices already reflect what investors expect, so markets react to the surprise, not the number itself.","Rapid fire c":"The fed funds rate
