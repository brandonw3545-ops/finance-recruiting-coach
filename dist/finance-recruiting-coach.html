ion and a low-cost competitor; I'd change my mind if existing gyms lost members two quarters in a row.\"","f":"What's the bear case, and why are you right and the sellers wrong?"},"What's a stock you'd avoid or short, and why?":{"a":"**Use the same structure as a buy pitch, but you need a reason the market is too optimistic and a catalyst that will make it realize that.** Common short theses: structural decline the market is ignoring, growth expectations baked into a high multiple that look unrealistic, worsening fundamentals like falling margins or piling-up inventory, aggressive accounting, or too much debt.\n\n**Structure:** \"I'd avoid [company] at $[price]. It trades at [multiple], which assumes [expectation]. I think that's too optimistic because [two reasons with evidence]. The catalyst is [event]. I think it's worth about $[X], based on [method]. The risk to my view is [what could go right], and I'd watch [signal].\"\n\nAlso show you know why shorting is hard: losses are unlimited in theory, borrowing the shares costs money, and short squeezes happen. Saying \"avoid\" rather than \"short\" is fine if you'd rather not take that risk.","f":"What would make you close the position at a loss?"},"If I gave you $1 million, how would you invest it?":{"a":"**Ask about the goal first, then show a framework.** Start with: \"It depends on the time horizon, what the money is for and how much risk you can stomach. If it's long-term money I won't need for 20 years or more, here's how I'd do it.\"\n\n**Then give a diversified, reasoned plan.** For example: about 70% in low-cost U.S. and international stock index funds, 20% in high-quality bonds for stability and to rebalance from in a downturn, 5% in cash for flexibility, and perhaps 5% in a high-conviction idea or a sector I know well, sized so being wrong won't hurt. Explain the why: stocks for long-term growth, bonds to cushion drops, low fees, tax-advantaged accounts first, and rebalancing once a year.\n\nIf you're interviewing in asset management, it's fine to work in a theme or a stock you'd pitch, as long as you size it sensibly. Avoid putting it all in one stock or one asset without acknowledging the risk.","f":"What would you change if the money were for a house purchase in two years?"},"What's the biggest risk to the stock you'd pitch?":{"a":"**Name the most serious, specific risk to your thesis, not a generic one like \"the market could fall.\"** Then show how you'd monitor it and why you still like the stock.\n\n**Structure:** \"The biggest risk is [specific risk, like margins not recovering because input costs stay high]. If that happened, earnings would be about [X%] lower, and the stock would be worth about $[Y]. I'd know within [time frame] by watching [a specific metric or event]. I still like it because [why the risk is less likely or less damaging than the market thinks], and the upside of [X%] outweighs a downside of [Y%].\"\n\nThe best answers put a number on the downside and treat the bear case honestly.","f":"If that risk played out, what would you do?"},"Tell me about an investment you got wrong. What did you learn?":{"a":"**Pick a real mistake, like a stock, a pitch or a paper-trading decision, explain your original thesis, what actually happened, and what changed in your process.** It shows humility and that you learn from losses.\n\n**Sample:** \"In my investment club, I pitched a retailer because its P/E was low compared with peers. I didn't dig into why: its sales were shifting online, where it was weak, and sales at its existing stores kept falling. The stock fell 30% over the next year. What I learned is that a low multiple usually has a reason, so now, before I argue a stock is mispriced, I write down why the market thinks it's cheap and what would have to change.\"\n\nDon't blame the market or bad luck. Focus on what you missed and what you do differently now.","f":"How has that changed the way you research stocks?"},"Name a company with a strong moat. What makes it hard to compete with?":{"a":"**Pick a company, name the specific source of its moat, and show evidence that it lasts.** The main types of moat: network effects, switching costs, cost advantages from scale, intangible assets like brands, patents and licenses, and markets only big enough for one or two players.\n\n**Sample:** \"Visa has one of the strongest moats I know: a network that feeds itself. Merchants accept Visa because billions of cardholders carry it, and people carry it because almost every merchant accepts it. A new network would need both sides at once, which is nearly impossible. It also has huge scale, so the cost of processing each transaction is tiny and its margins are very high. The risks are regulation of card fees and new ways to pay, like instant bank transfers, but so far its volumes keep growing.\"\n\nGood evidence of a moat: high, stable margins and returns on capital over many years, and market share that holds up. Always mention what could erode it.","f":"What could erode that moat over the next ten years?"},"What's the difference between a call and a put?":{"a":"Both are contracts that give the buyer a right, not an obligation. A **call** gives the right to buy a stock at a set strike price before expiration, so it gains value when the stock rises. A **put** gives the right to sell at the strike, so it gains value when the stock falls. The buyer pays a premium, which is the most they can lose, while the seller collects the premium and takes on the obligation if the option is exercised.\n\nFor example, a call with a $105 strike bought for $3 makes money only if the stock finishes above $108. Investors use calls to bet on a rise with limited downside, and puts to protect a position they own, much like buying insurance.","f":"What happens to an option's value when volatility rises?"},"What happens to the price of an option when volatility rises? Why?":{"a":"**Both calls and puts become more valuable.** An option's payoff is lopsided: the buyer's loss is capped at the premium, but the gain grows with the size of the move. Higher volatility means bigger possible moves in both directions. The bigger moves in the option's favor help the buyer a lot, while the bigger moves against it can't cost more than the premium. So more volatility raises the option's expected payoff, and its price.\n\nThe sensitivity of an option's price to volatility is called **vega**, and it's largest for at-the-money options with a long time left until expiration. Traders often quote options in terms of implied volatility, the volatility that makes the market price fit a pricing model like Black–Scholes; buying options is effectively buying volatility.","f":"What's implied volatility, and how is it different from historical volatility?"},"What is delta, in plain English?":{"a":"**Delta is how much an option's price changes when the underlying stock moves by $1.** A call with a delta of 0.5 gains about 50 cents if the stock rises $1. Calls have deltas between 0 and 1, and puts between −1 and 0.\n\n- Deep in-the-money options have deltas near 1 (or −1 for puts): they move almost one-for-one with the stock.\n- Far out-of-the-money options have deltas near 0.\n- At-the-money options have deltas around 0.5 (or −0.5).\n\nDelta is also a rough guide to the chance the option finishes in the money, and it tells you the hedge: a trader who sold 100 call contracts, each on 100 shares, with a delta of 0.5, would buy about 5,000 shares to be \"delta neutral.\" Delta changes as the stock moves, and the rate of that change is called **gamma**.","f":"What's gamma, and why do option sellers worry about it?"},"Why would a company use an interest rate swap?":{"a":"**To change its interest rate exposure without refinancing its debt.** In a plain vanilla swap, two parties exchange interest payments on a notional amount: one pays a fixed rate, and the other pays a floating rate, like SOFR.\n\nExample: a company has a $100 million floating-rate loan at SOFR plus 2% and worries that rates will rise. It enters a swap in which it pays a fixed 4% and receives SOFR. The SOFR it receives offsets the SOFR it pays on the loan, so its all-in cost is locked at about 6%: 4% plus 2%.\n\nReasons to do it: to make interest costs predictable, to match assets and liabilities (as banks and insurers do), to borrow where it's cheapest and swap into the exposure it wants, or to express a view on rates. The risks: if rates fall, the company misses out on the savings, and the other side of the swap could fail to pay.","f":"If rates fall after the company enters the swap, who wins and who loses?"},"Pitch me a trade.":{"a":"**A trade pitch is short and specific: the instrument, the direction, the reason, the catalyst, the risk and the size.** It can be in rates, currencies, commodities or stocks.\n\n**Structure:** \"I'd [buy or sell] [instrument] at [level], targeting [level] over [time frame]. The reason is [your view, with one or two data points]. The catalyst is [an event, like a Fed meeting, a CPI report or earnings]. I'd exit at [stop level], so the reward is about three times the risk. The main thing that would prove me wrong is [risk].\"\n\n**Sample:** \"If I thought inflation would cool faster than the market expects, I'd buy 2-year Treasuries, because the 2-year yield is the most sensitive to Fed expectations. The catalyst is the next CPI report. I'd get out if the 2-year yield rose another quarter of a point.\"\n\nShow that you know current levels and think in terms of risk and reward, not just direction.","f":"How would you size that trade, and where's your stop?"},"You're making a market in a stock trading around $50. How do you set your bid and ask, and what moves them?":{"a":"**Quote a two-sided price around your estimate of fair value, wide enough to earn a profit and cover your risk:** for example, a bid of $49.98 and an offer of $50.02, in a size you're comfortable with.\n\n**What widens the spread:** higher volatility, lower trading volume, a bigger order, upcoming news like earnings, and the risk that the person trading with you knows something you don't.\n\n**What moves your quotes:** new information, like news or moves in related stocks and index futures; the orders you see; and your own inventory. If you've bought a lot, you're long and want to cut your risk, so you lower both prices, say to $49.96 and $50.00, to attract buyers and discourage more sellers. If you're short, you raise them.\n\nA market maker earns the spread across many trades and tries not to bet on direction, managing its inventory by adjusting quotes or hedging.","f":"Someone asks you to buy a very large block. How does that change your price?"},"Would you rather have $1 million for sure or a 50% chance at $2.5 million? Walk me through how you think about it.":{"a":"**Start with expected value, then explain why it isn't the whole answer.** The gamble's expected value is 0.5 × $2.5 million = $1.25 million, more than the sure $1 million, so someone who only cared about expected value would take the gamble.\n\nBut most people should take **the $1 million**, because each extra dollar matters less the more you have: going from nothing to $1 million changes your life far more than going from $1 million to $2.5 million, so a 50% chance of ending up with nothing isn't worth an extra $250,000 of expected value. The answer can change with circumstances: someone already wealthy might take the gamble, and if you could play many times, the gamble wins. You could even sell the gamble to someone with more money for more than $1 million.\n\nThe interviewer wants to see you calculate the expected value, think about risk and make a clear decision.","f":"At what guaranteed amount would you be indifferent?"},"How would you explain diversification to a client with no finance background?":{"a":"**Use a simple analogy and no jargon, then connect it to their goals.**\n\n**Sample:** \"Think of a shop that sells both umbrellas and sunscreen. On rainy days the umbrellas sell, and on sunny days the sunscreen does, so the shop has steady income whatever the weather. Your portfolio works the same way: we hold different kinds of investments that tend to do well at different times, so when one has a bad year, the others steady the whole. It doesn't mean you'll never lose money, but it means one bad company or one bad market won't wreck your plans. It's also why we don't put everything into whatever did best last year.\"\n\nThen check that they understood, and tie it back to their own portfolio and goals.","f":"The client asks, \"Then why don't I just buy the best-performing fund?\" What do you say?"},"A 65-year-old client wants to move all their savings into tech stocks. What do you say?":{"a":"**Don't just say no. Understand why, explain the risk in terms of their goals and offer a better path.**\n\n1. **Ask why:** are they worried about falling behind, excited by recent returns, or following a friend?\n2. **Connect it to their situation:** at 65, they'll probably be drawing on their savings soon. Tech stocks can fall hard: the Nasdaq fell about 33% in 2022 and about 78% from 2000 to 2002, and they may not have time to wait for a recovery. Selling in a downturn to pay living expenses would lock in the losses.\n3. **Show the numbers:** what a 40% drop would mean for their income and retirement plans.\n4. **Offer a middle ground:** a modest, deliberate slice of tech within a diversified portfolio, with several years of spending covered by safer assets.\n5. **Document the conversation,** and if they insist, follow the firm's procedures for trades the client directs.\n\nThe interviewer is testing empathy, judgment and your duty to act in the client's interest.","f":"The client insists. What do you do?"},"What's the difference between active and passive management, and why do most active managers trail their benchmark?":{"a":"**Passive** management tracks an index, like the S&P 500, at very low cost, accepting the market's return. **Active** management picks securities to try to beat a benchmark, and charges higher fees for the research and trading.\n\nMost active managers trail their benchmark because of simple arithmetic, laid out by William Sharpe: before costs, active investors as a group hold the market, so on average they earn the market's return. After fees and trading costs, the average active dollar must fall short. Markets are also competitive, so mispricings get spotted quickly, and managers who do beat the index rarely keep it up. S&P Dow Jones Indices' SPIVA scorecard found that about 90% of U.S. large-cap active funds trailed the S&P 500 over the 15 years through 2024.\n\nActive management has its best case in less efficient markets like small companies, emerging markets and credit, for tax management or particular client needs, and markets need active investors to set prices.","f":"Where do you think active management has the best chance of adding value?"},"What's the difference between a fiduciary and a broker?":{"a":"A **fiduciary**, such as a registered investment adviser, has a legal duty to put the client's interests first at all times: advice must be in the client's best interest, conflicts must be avoided or fully disclosed, and the duty continues for as long as the relationship lasts. Fiduciaries are usually paid a fee, often a percentage of assets, rather than commissions.\n\nA **broker**, a registered representative of a broker-dealer, was historically held to a \"suitability\" standard: recommendations had to be suitable for the client, not necessarily the best option. Since 2020, the SEC's **Regulation Best Interest** has required brokers to act in a retail customer's best interest when making a recommendation and to disclose conflicts, but the duty applies at the moment of the recommendation rather than on an ongoing basis, and brokers are often paid by commission.\n\nMany advisors are registered as both, so a client should ask which role the advisor is playing for each piece of advice.","f":"Why might a client prefer one over the other?"},"What is the Sharpe ratio, and what does it miss?":{"a":"The **Sharpe ratio** measures return per unit of risk: (portfolio return − risk-free rate) ÷ the portfolio's volatility, measured as the standard deviation of its returns. A fund that returns 10% when Treasury bills pay 4%, with 15% volatility, has a Sharpe ratio of (10% − 4%) ÷ 15% = 0.4. Higher is better, and it lets you compare portfolios that take different amounts of risk.\n\n**What it misses:**\n- It treats upside and downside swings the same; the Sortino ratio penalizes only the downside.\n- It assumes returns are roughly normally distributed, so it misses tail risk: a strategy that earns small, steady gains and then crashes can look great until it doesn't.\n- It can be flattered by assets that are priced infrequently, whose returns look smoother than they really are.\n- It depends heavily on the time period measured.\n- It ignores how the investment fits with the rest of a portfolio.","f":"Fund A has a Sharpe ratio of 1.0 and Fund B has 0.5. Is A always the better choice?"},"How would you build a portfolio for a 25-year-old saving for retirement?":{"a":"**Start with their goals and situation, then build something simple, diversified and cheap.**\n\n1. **Foundation first:** an emergency fund of three to six months of expenses in cash, and pay off any high-interest debt.\n2. **Use tax-advantaged accounts:** contribute enough to the 401(k) to get the full employer match, then a Roth IRA, since their tax rate is probably low now, then more 401(k).\n3. **Allocation:** mostly stocks, perhaps 80% to 90%, in U.S. and international index funds, because they have about 40 years to ride out downturns and need growth; 10% to 20% in bonds if it helps them stay calm in a crash. A target-date fund does this automatically.\n4. **Keep costs low:** index funds and ETFs with low expense ratios.\n5. **Automate and rebalance:** contribute every paycheck, rebalance once a year, and shift gradually toward bonds as retirement gets closer.\n\nThe biggest risk for a young investor isn't volatility; it's panic-selling or not saving enough.","f":"How would the portfolio change if they told you they'd panic-sell in a 30% drop?"},"What's the difference between a Roth IRA and a traditional IRA, and who should pick which?":{"a":"**Traditional IRA:** contributions may be tax-deductible now, depending on income and whether you have a workplace plan; the money grows tax-deferred, and withdrawals in retirement are taxed as ordinary income. Required minimum distributions start in your 70s.\n\n**Roth IRA:** contributions go in after tax, with no deduction now; the money grows tax-free, and qualified withdrawals in retirement are tax-free. The original owner never has to take required minimum distributions, and contributions (but not earnings) can be withdrawn at any time. There are income limits on contributing directly.\n\n**Who should pick which:** it mostly comes down to whether your tax rate is higher now or in retirement. If you expect a higher rate later, as most students and early-career workers should, a **Roth** usually wins. If you're in a high bracket now and expect a lower one in retirement, the **traditional** IRA's deduction is worth more. Many people use both to spread out their future tax exposure.","f":"Can a high earner still get money into a Roth? How?"},"How do wealth managers get paid, and what conflicts can that create?":{"a":"**How they're paid, and the conflict each can create:**\n- **A fee as a percentage of assets,** often around 1% a year: it ties pay to growing the account, but it can discourage advice that shrinks the account, like paying off a mortgage or buying an annuity elsewhere.\n- **Commissions** on trades or products like insurance and annuities: an incentive to recommend high-commission products or to trade more than necessary.\n- **Flat or hourly planning fees:** fewer conflicts, but often less ongoing involvement.\n- **Proprietary products and revenue sharing:** the firm may earn more when clients use its own funds.\n- **Lending and banking:** interest on mortgages or loans against a portfolio.\n\n**How conflicts are managed:** disclosure (in documents like Form CRS and Form ADV), fiduciary and best-interest standards, fee-only models and firm compliance. A strong answer admits that every model has some conflict and explains how a good advisor puts the client first anyway.","f":"Which pay model do you think best aligns the advisor with the client, and why?"},"A client panics after the market drops 20%. What do you tell them?":{"a":"**Listen first, then reconnect them to their plan with facts, and only change course if their goals or situation have changed.**\n\n1. **Acknowledge the fear:** \"It's completely normal to feel this way. A 20% drop is painful.\"\n2. **Revisit the plan:** their time horizon and goals, why the portfolio was built this way, and confirm their near-term spending is covered by cash and bonds, so they won't be forced to sell stocks at low prices.\n3. **Give perspective:** drops of 20% or more have happened many times, including in 2008, 2020 and 2022, and the market eventually recovered from each one, sometimes quickly. Selling locks in the loss and risks missing the rebound, because many of the best days come close to the worst ones.\n4. **Offer useful actions:** rebalancing, which means buying stocks at lower prices; harvesting tax losses; or, if their tolerance for risk really is lower than they thought, a gradual adjustment rather than a panicked one.\n5. **Follow up:** check in regularly until things settle.\n\nThe interviewer is testing empathy, calm and your grasp of investor behavior.","f":"What if the client says they can't sleep and wants to sell everything today?"},"What's 17 × 24?":{"a":"**408.** Shortcut: 17 × 24 = 17 × 25 − 17 = 425 − 17 = 408. Or (20 − 3) × 24 = 480 − 72 = 408. Say your method out loud; interviewers care about the approach as much as the number.","f":"What's 23 × 27?"},"What's 15% of 360?":{"a":"**54.** 10% of 360 is 36, and 5% is half of that, 18. 36 + 18 = 54.","f":"What's 35% of 240?"},"A stock rises 50% and then falls 50%. Where does it end up?":{"a":"**Down 25%.** $100 rises 50% to $150, then falls 50% to $75. The order doesn't matter: 1.5 × 0.5 = 0.75. The general lesson: recovering from a loss takes a bigger percentage gain than the loss itself (a 50% loss needs a 100% gain), which is why big drawdowns do so much damage.","f":"How much does a stock need to rise to recover from a 20% drop?"},"A bat and a ball cost $1.10 together. The bat costs $1.00 more than the ball. How much is the ball?":{"a":"**5 cents.** If the ball costs x, the bat costs x + $1.00, so 2x + $1.00 = $1.10, and x = $0.05. The instinctive answer, 10 cents, is wrong: the bat would then cost $1.10, and the total would be $1.20. The question tests whether you check your first instinct.","f":"If 5 machines take 5 minutes to make 5 widgets, how long do 100 machines take to make 100 widgets?"},"What is the probability of rolling at least one six in two rolls of a die?":{"a":"**11/36, or about 30.6%.** The easy way is to find the chance of no sixes and subtract it from 1. No six on one roll is 5/6, so no six on two rolls is 5/6 × 5/6 = 25/36, and at least one six is 1 − 25/36 = 11/36. Adding 1/6 + 1/6 = 1/3 is wrong because it counts the double six twice.","f":"What about at least one six in three rolls?"},"What is the sum of the whole numbers from 1 to 100?":{"a":"**5,050.** Pair the numbers from both ends: 1 + 100, 2 + 99, 3 + 98 and so on. Each pair adds up to 101, and there are 50 pairs, so 50 × 101 = 5,050. The general formula is n(n + 1) ÷ 2.","f":"What's the sum of the odd numbers from 1 to 99?"},"What is the angle between the hands of a clock at 3:15?":{"a":"**7.5 degrees.** The minute hand points at the 3, which is 90 degrees from 12. The hour hand moves 30 degrees an hour, or half a degree a minute, so at 3:15 it's 15 × 0.5 = 7.5 degrees past the 3, at 97.5 degrees. The gap is 97.5 − 90 = 7.5 degrees. The trap is answering zero.","f":"What's the angle at 9:45?"},"How many gas stations are there in the United States? Walk me through your estimate.":{"a":"**Show a clear structure, use round numbers and sanity-check the result.** One approach, from demand:\n\n- About 330 million people and roughly 280 million vehicles.\n- Each vehicle fills up about once a week: about 280 million fill-ups a week, or about 40 million a day.\n- A typical station has about 8 pumps, each handling about 30 fill-ups a day (busy at rush hour, quiet at night): about 250 fill-ups a station a day.\n- 40 million ÷ 250 = **about 160,000 stations.**\n\nSanity check: that's roughly one station for every 2,000 people, so a town of 10,000 would have about five, which sounds right. For reference, the National Association of Convenience Stores counts about 120,000 convenience stores that sell fuel, and they sell most of the country's gasoline, so a total in the 140,000 to 160,000 range is about right. Interviewers care far more about the logic than the final number.","f":"How would your estimate change as electric cars become more common?"},"Estimate the annual revenue of a coffee shop near your campus.":{"a":"**Break it into customers × average spend × days open, and say your assumptions out loud.**\n\n- Open about 360 days a year, roughly 6 a.m. to 8 p.m.\n- Customers a day: a morning rush of about 60 an hour for three hours (180), plus about 20 an hour for the other 11 hours (220), so about 400.\n- Average ticket: about $7, a latte plus the occasional pastry.\n- Daily revenue: 400 × $7 = $2,800.\n- Annual revenue: $2,800 × 360 ≈ **$1 million.**\n\nThen adjust: a campus shop is slower in summer and over breaks, so cut maybe 20%, to around $800,000. Mention how you'd check it in real life: count customers during a rush, look at the menu prices and think about seasons.","f":"How would you estimate its profit?"},"You have a 3-gallon jug and a 5-gallon jug. How do you measure exactly 4 gallons?":{"a":"1. Fill the 5-gallon jug.\n2. Pour from it into the 3-gallon jug until the 3 is full. That leaves 2 gallons in the 5.\n3. Empty the 3-gallon jug and pour the 2 gallons into it.\n4. Fill the 5-gallon jug again.\n5. Pour from the 5 into the 3, which already holds 2 gallons, so only 1 gallon fits. That leaves exactly **4 gallons** in the 5-gallon jug.\n\nAnother route: fill the 3 and pour it into the 5, then fill the 3 again and top up the 5, leaving 1 gallon in the 3. Empty the 5, pour in that 1 gallon, then add a full 3. Talk through each step out loud.","f":"How would you measure exactly 1 gallon?"},"Roughly what is 1.07 to the 10th power? Explain your shortcut.":{"a":"**About 1.97, so roughly 2.** Shortcut: the rule of 72. At 7%, money doubles in about 72 ÷ 7, a little over 10 years, so after 10 years it's just under double. A more precise route: 1.07² ≈ 1.145, so 1.07⁴ ≈ 1.311 and 1.07⁸ ≈ 1.718, and 1.718 × 1.145 ≈ 1.967.","f":"How long does money take to triple at 10% a year?"},"How many times a day do the hour and minute hands of a clock overlap?":{"a":"**22 times.** In 12 hours, the minute hand goes around 12 times and the hour hand once, so the minute hand laps the hour hand 12 − 1 = 11 times. Over 24 hours, that's 22. The trap is answering 24: there's no separate overlap between 11 and 12, because the one near 11 actually happens at 12:00. The hands overlap about every 65.45 minutes, which is 12/11 of an hour.","f":"How many times a day do the hands form a right angle?"},"What's 0.6 divided by 0.08?":{"a":"**7.5.** Multiply both numbers by 100 to clear the decimals: 60 ÷ 8 = 7.5.","f":"What's 0.45 divided by 0.15?"}};

  function baseWeights(p) {
    const w = {};
    LESSON_CATS.forEach(c => w[c] = 0);
    const add = (seat, share) => SEAT_WEIGHTS[seat].forEach((v, i) => { w[LESSON_CATS[i]] += v * share; });
    const others = p.seats.filter(s => s !== p.primary);
    if (!others.length) add(p.primary, 1);
    else { add(p.primary, 0.6); others.forEach(s => add(s, 0.4 / others.length)); }
    const LV = { new: 1.25, some: 1, solid: 0.8 };
    w.acc *= LV[p.levels.acc]; w.val *= LV[p.levels.val]; w.mkt *= LV[p.levels.mkt];
    return w;
  }

    2: { inv: 1.5, trd: 1.2, val: 1.1, car: 0.9, rev: 0.07 },
    3: { car: 1.7, rev: 0.12 },
    4: { car: 1.5, mkt: 1.2, rev: 0.15 },

  function phaseWeights(base, ph) {
    const m = PHASE_MULT[ph] || {};
    const w = {};
    let sum = 0;
    LESSON_CATS.forEach(c => { w[c] = base[c] * (m[c] || 1); sum += w[c]; });
    LESSON_CATS.forEach(c => { w[c] = sum ? w[c] / sum : 0; });
    w.rev = m.rev || 0;
    return w;
  }

  function buildPlan(raw) {
    const p = normalize(raw);
    const start = parseISO(p.startDate), ready = parseISO(p.readyDate);
    if (!start || !ready) return { error: 'Add a start date and an interview-ready date.', profile: p };
    if (ready <= start) return { error: 'Your interview-ready date needs to come after your start date.', profile: p };

    const evs = p.events.filter(e => e.date >= p.startDate);
    let end = ready;
    const lastEv = evs.length ? parseISO(evs[evs.length - 1].date) : null;
    if (lastEv && lastEv > end) end = lastEv;

    const phaseOf = new Array(days.length);
    const phases = [];
    const post = days.length - R;
    if (R < 24) phases.push({ n: 0, fromIdx: 0, toIdx: R - 1 });
    else {

      phases.push({ n: 1, fromIdx: 0, toIdx: p1 - 1 }, { n: 2, fromIdx: p1, toIdx: p1 + p2 - 1 }, { n: 3, fromIdx: p1 + p2, toIdx: R - 1 });
    }
    if (post >= 5) phases.push({ n: 4, fromIdx: R, toIdx: days.length - 1 });
    else if (post > 0) phases[phases.length - 1].toIdx = days.length - 1;
    phases.forEach(ph => {
      for (let i = ph.fromIdx; i <= ph.toIdx; i++) phaseOf[i] = ph.n;
      Object.assign(ph, PHASE_INFO[ph.n], { from: days[ph.fromIdx], to: days[ph.toIdx], days: ph.toIdx - ph.fromIdx + 1 });
    });

    const special = new Map();
    const startISO = p.startDate;
    const evInfo = e => ({ id: e.id, name: e.name, date: e.date, type: e.type, note: e.note, est: e.est });
    const mockNear = (i, span) => {
      for (const [j, s] of special) if (s.kind === 'mock' && Math.abs(daysBetween(days[j], days[i])) <= span) return true;
      return false;
    };

    // 1) prep sessions tied to the student's dates (interview-day items first: they can only go on one day)
    const rules = [];
    evs.forEach(e => (PREP_RULES[e.type] || PREP_RULES.other).forEach(r => rules.push([e, r])));
    rules.sort((a, b) => (a[1].sub === 'day' ? 0 : 1) - (b[1].sub === 'day' ? 0 : 1));
    rules.forEach(([e, r]) => {
      let pick = -1;
      if (r.sub === 'day') {
        const i = days.indexOf(e.date);
        if (i >= 0 && !special.has(i)) pick = i;
      } else {
        const target = iso(addDays(parseISO(e.date), -r.off));
        for (let i = 0; i < days.length && days[i] < e.date; i++) {
          if (special.has(i)) continue;
          if (days[i] <= target) pick = i;               // latest free day on or before the target
          else { if (pick < 0) pick = i; break; }        // otherwise the first free day after it
        }
      }
      if (pick < 0) return;
      const isMock = r.sub === 'mock';
      special.set(pick, {
        kind: isMock ? 'mock' : 'prep', cat: isMock ? 'mock' : 'prep', sub: r.sub,
        title: PREP_TITLES[r.sub](e.name), event: evInfo(e),
        key: (isMock ? 'mock-ev-' : 'prep-') + slug(e.name) + '-' + e.date + '-' + r.sub,
      });
    });

    // 2) mock interviews on the student's mock day; cadence scales with study days per week:
    //    at least BASE weeks apart and at least GAP study days apart, so a light schedule
    //    still gets mostly lessons
    const k = p.studyDays.length;
    const BASE = { 0: 1, 1: 2, 2: 1, 3: 1, 4: 1 }, GAP = { 0: 3, 1: 10, 2: 5, 3: 3, 4: 5 };
    const everyWeeks = ph => Math.max(BASE[ph], Math.ceil(GAP[ph] / k));
    const byWeek = [];
    days.forEach((d, i) => { const w = Math.floor(daysBetween(startISO, d) / 7); (byWeek[w] = byWeek[w] || []).push(i); });
    const placeMock = (cands, title, suffix) => {
      for (const i of cands) {
        if (i <= 0 || special.has(i) || mockNear(i, 2)) continue;
        special.set(i, { kind: 'mock', cat: 'mock', sub: 'std', title, key: 'mock-' + days[i] + (suffix || '') });
        return i;
      }
      return -1;
    };
    byWeek.forEach((idxs, w) => {
      if (!idxs || !idxs.length) return;
      let main = idxs.find(i => parseISO(days[i]).getDay() === p.mockDay);
      if (main === undefined) main = idxs[idxs.length - 1];
      const ph = phaseOf[main], every = everyWeeks(ph);
      const on = ph === 1 ? (w >= 2 && (w - 2) % every === 0) : (w % every === 0);
      if (!on) return;
      const earlier = idxs.filter(i => i < main).reverse();
      const placed = placeMock([main].concat(earlier), 'Mock interview');
      if (ph === 3 && k >= 5 && placed > 0) {
        const target = daysBetween(startISO, days[placed]) - 3;
        const order = idxs.slice().sort((a, b) => Math.abs(daysBetween(startISO, days[a]) - target) - Math.abs(daysBetween(startISO, days[b]) - target));
        placeMock(order, 'Midweek mock interview', '-mid');
      }
    });
    // a final mock in the last few days before the ready date
    const last = R - 1;
    let recent = -1;
    for (let j = last; j >= 0 && daysBetween(days[j], days[last]) <= 3; j--) {
      const s = special.get(j);
      if (s && s.kind === 'mock') { recent = j; break; }
    }
    if (recent >= 0) { const s = special.get(recent); if (s.sub === 'std') s.title = 'Final mock: a full first round'; }
    else {
      for (let j = last; j > 0 && daysBetween(days[j], days[last]) <= 3; j--) {
        if (!special.has(j)) { special.set(j, { kind: 'mock', cat: 'mock', sub: 'std', title: 'Final mock: a full first round', key: 'mock-' + days[j] }); break; }
      }
    }

    // 3) firm deep-dives spread through interview mode (or the back half of a sprint)
    const ph3 = phases.find(ph => ph.n === 3);
    const firmSpan = ph3 ? { from: ph3.fromIdx, to: ph3.toIdx } : (phases[0].n === 0 ? { from: Math.floor(R / 2), to: R - 1 } : null);
    if (firmSpan && p.firmList.length) {
      const len = firmSpan.to - firmSpan.from + 1;
      const F = Math.min(6, p.firmList.length, Math.max(1, Math.floor(len / 4)));
      p.firmList.slice(0, F).forEach((f, j) => {
        const target = firmSpan.from + Math.floor((j + 0.5) * len / F);
        for (let d = 0; d < len; d++) {
          for (const c of [target + d, target - d]) {
            if (c >= firmSpan.from && c <= firmSpan.to && !special.has(c)) {
              special.set(c, { kind: 'firm', cat: 'firm', title: 'Why ' + f + '?', firm: f, key: 'firm-' + slug(f) });
              return;
            }
          }
        }
      });
    }

    // 3) lessons, interleaved by weight (smooth weighted round-robin)
    const queues = buildQueues(p);
    const base = baseWeights(p);
    const ptr = {}, current = { rev: 0 }, drillN = {}, topicLate = {}, drillLate = {};
    LESSON_CATS.forEach(c => { ptr[c] = 0; current[c] = 0; drillN[c] = 0; topicLate[c] = 0; drillLate[c] = 0; });
    let revN = 0, first = true;
    const RATIO = { 0: 0, 1: 0, 2: 1, 3: 2, 4: 3 };
    const hasTopic = (c, ph) => ptr[c] < queues[c].length && ((ph === 0 || ph === 1) ? queues[c][ptr[c]].level <= 2 : true);
    const canServe = (c, ph) => c === 'rev' ? true : (hasTopic(c, ph) || drillAllowed(c, p));

    const items = new Array(days.length);
    for (let i = 0; i < days.length; i++) {
      if (special.has(i)) { items[i] = special.get(i); continue; }
      const ph = phaseOf[i];
      const w = phaseWeights(base, ph);
      const cand = LESSON_CATS.concat('rev').filter(c => w[c] > 0 && canServe(c, ph));
      let best;
      if (!cand.length) best = 'rev';
      else {
        let total = 0;
        cand.forEach(c => { current[c] += w[c]; total += w[c]; });
        best = (first && cand.includes('car')) ? 'car' : cand.reduce((a, b) => current[b] > current[a] ? b : a);
        current[best] -= total;
      }
      first = false;

      if (best === 'rev') { revN++; items[i] = { kind: 'rev', cat: 'rev', title: 'Rewind: your weakest topic', key: 'rev-' + revN }; continue; }
      const topicOk = hasTopic(best, ph), drillOk = drillAllowed(best, p);
      const late = ph >= 2;
      let doDrill = false;
      if (!topicOk && drillOk) doDrill = true;
      else if (topicOk && drillOk && late && RATIO[ph] > 0 && drillLate[best] < topicLate[best] * RATIO[ph]) doDrill = true;
      if (doDrill) {
        drillN[best]++; if (late) drillLate[best]++;
        items[i] = { kind: 'drill', cat: best, title: DRILLS[best].title + ', round ' + drillN[best], key: 'drill-' + best + '-' + drillN[best], focus: DRILLS[best].focus };
      } else if (topicOk) {
        const t = queues[best][ptr[best]++];
        if (late) topicLate[best]++;
        items[i] = { kind: 'lesson', cat: best, title: t.title, topicId: t.id, level: t.level, key: t.id };
      } else {
        revN++;
        items[i] = { kind: 'rev', cat: 'rev', title: 'Rewind: your weakest topic', key: 'rev-' + revN };
      }
    }

    const out = items.map((it, i) => Object.assign({}, it, { date: days[i], idx: i, day: i + 1, phase: phaseOf[i] }));
    const counts = { lesson: 0, drill: 0, mock: 0, prep: 0, firm: 0, rev: 0 };
    out.forEach(it => { counts[it.kind] = (counts[it.kind] || 0) + 1; });
    return {
      profile: p, items: out, phases, events: evs, start: startISO, end: endISO, ready: readyISO,
      prepDays: R, total: out.length, counts,
    };
  }

  /* ---------- helpers used by the app ---------- */
  function itemOn(plan, isoDate) { return plan.items.find(it => it.date === isoDate) || null; }
  function nextItem(plan, isoDate) { return plan.items.find(it => it.date > isoDate) || null; }
  function weekOf(plan, it) { return Math.floor(daysBetween(plan.start, it.date) / 7); }
  function teaserLevel(plan, it) {
    const f = plan.prepDays ? it.idx / plan.prepDays : 1;
    return f < 0.3 ? 'easy' : f < 0.7 ? 'medium' : 'hard';
  }
  function questionsFor(p, cat) {
    const all = p.seats.includes('unsure');
    return QUESTIONS.filter(q => (!cat || q.cat === cat) && (!q.for.length || all || q.for.some(s => p.seats.includes(s))));
  }
  function fillQuestion(text, p, rnd) {
    const firms = p.firmList || [];
    const firm = firms.length ? firms[Math.floor((rnd ? rnd() : Math.random()) * firms.length)] : 'our firm';
    return text.replace('{seat}', SEATS[p.primary].phrase).replace('{role}', SEATS[p.primary].role).replace('{firm}', firm);
  }
  function rng(seedStr) {
    let h = 1779033703 ^ String(seedStr).length;
    for (let i = 0; i < seedStr.length; i++) { h = Math.imul(h ^ seedStr.charCodeAt(i), 3432918353); h = h << 13 | h >>> 19; }
    let a = h >>> 0;
    return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  }

  /* Technical categories that matter most for a seat, for drills and mocks */
  const SEAT_TECH = {
    ib: ['acc', 'val'], pe: ['val', 'acc'], er: ['acc', 'val', 'inv'], cf: ['acc', 'val'], cb: ['acc', 'val', 'mkt'],
    st: ['mkt', 'trd'], hf: ['inv', 'val', 'mkt'], am: ['inv', 'mkt', 'awm'], wm: ['awm', 'mkt', 'inv'], vc: ['inv', 'val'],
    unsure: ['acc', 'val', 'mkt'],
  };

  function pickMock(p, seed, avoidIds, weakCats) {
    const r = rng(seed);
    const avoid = new Set(avoidIds || []);
    const pick = (cat) => {
      const pool = questionsFor(p, cat);
      const fresh = pool.filter(q => !avoid.has(q.id));
      const src = fresh.length ? fresh : pool;
      const q = src[Math.floor(r() * src.length)];
      avoid.add(q.id);
      return { id: q.id, cat: q.cat, text: fillQuestion(q.text, p, r) };
    };
    const tech = SEAT_TECH[p.primary] || SEAT_TECH.unsure;
    const t1 = (weakCats && weakCats.length) ? weakCats[0] : tech[0];
    const t2 = tech.find(c => c !== t1) || tech[0];
    const lastCat = ['ib', 'pe', 'cf', 'cb', 'vc'].includes(p.primary) ? (r() < 0.5 ? 'teaser' : 'mkt') : (r() < 0.5 ? 'mkt' : 'inv');
    return [pick('fit'), pick('beh'), pick(t1), pick(t2), pick(lastCat)];
  }

  /* ---------- spaced repetition ----------
     A question you score 3 or lower comes back the next day. Each time you then score 4 or 5
     (on or after its due date) the gap grows: 3 days, 7 days, 14 days, then it's retired.
     Missing it again at any point starts it over. Right the first time: never scheduled. */
  const REVIEW_GAPS = [1, 3, 7, 14];
  function reviewKey(q) { return String(q || '').toLowerCase().replace(/[^a-z0-9$%]+/g, ' ').trim(); }
  function reviewSchedule(answers, today) {
    const m = new Map();
    (answers || []).slice().sort((a, b) => (a.at || 0) - (b.at || 0)).forEach(a => {
      const k = reviewKey(a.q), day = parseISO(a.date) ? a.date : today;
      if (!k || !(a.score >= 1)) return;
      let r = m.get(k);
      if (!r) {
        if (a.score >= 4) return;
        m.set(k, { key: k, q: a.q, qid: a.qid || '', cat: a.cat, box: 0, last: day, due: iso(addDays(parseISO(day), REVIEW_GAPS[0])), score: a.score, attempts: 1, retired: false });
        return;
      }
      r.attempts++; r.last = day; r.score = a.score; r.q = a.q; r.qid = a.qid || r.qid; r.cat = a.cat || r.cat;
      if (a.score <= 3) { r.box = 0; r.retired = false; r.due = iso(addDays(parseISO(day), REVIEW_GAPS[0])); return; }
      if (r.retired || (r.due && day < r.due)) return;          // a pass before it's due doesn't move it along
      if (r.box + 1 >= REVIEW_GAPS.length) { r.retired = true; r.due = null; return; }
      r.box++;
      r.due = iso(addDays(parseISO(day), REVIEW_GAPS[r.box]));
    });
    return Array.from(m.values()).filter(r => !r.retired)
      .map(r => Object.assign(r, { isDue: r.due <= today }))
      .sort((a, b) => (a.due < b.due ? -1 : a.due > b.due ? 1 : a.score - b.score));
  }

  function planMarkdown(plan) {
    const p = plan.profile;
    const L = [];
    L.push('# ' + (p.name ? p.name + "'s" : 'My') + ' recruiting plan');
    L.push('');
    L.push('Interview-ready by **' + fmt(plan.ready, { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' }) + '**. ' + plan.total + ' study days from ' + fmt(plan.start, { month: 'long', day: 'numeric', year: 'numeric' }) + '.');
    if (plan.events.length) {
      L.push('', '## Key dates');
      plan.events.forEach(e => L.push('- ' + fmt(e.date, { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' }) + ' · ' + e.name + ' (' + EVENT_TYPES[e.type] + (e.est ? ', estimate' : '') + ')'));
    }
    L.push('', '## Phases');
    plan.phases.forEach(ph => L.push('- **' + ph.name + '** · ' + fmt(ph.from) + ' to ' + fmt(ph.to) + ': ' + ph.blurb));
    L.push('', '## Day by day');
    let lastW = -1;
    plan.items.forEach(it => {
      const w = weekOf(plan, it);
      if (w !== lastW) {
        lastW = w;
        const ws = iso(addDays(parseISO(plan.start), w * 7)), we = iso(addDays(parseISO(plan.start), w * 7 + 6));
        L.push('', '### Week ' + (w + 1) + ': ' + fmt(ws) + ' to ' + fmt(we));
      }
      L.push('- Day ' + it.day + ' · ' + fmt(it.date) + ' · *' + CATS[it.cat].name + '* · ' + it.title);
    });
    return L.join('\n');
  }

  const api = {
    CATS, LESSON_CATS, SEATS, YEARS, EVENT_TYPES, TOPICS, QUESTIONS, DRILLS, SEAT_TECH, PHASE_INFO, DEFAULT_PROFILE,
    parseISO, iso, addDays, daysBetween, todayISO, fmt, slug, splitList, splitLines, rng,
    normalize, validate, buildPlan, itemOn, nextItem, weekOf, teaserLevel, questionsFor, fillQuestion, pickMock, planMarkdown, baseWeights,
    questionById, reviewKey, reviewSchedule, REVIEW_GAPS,
  };
  return api;
})();
if (typeof module !== 'undefined' && module.exports) module.exports = Engine;

<script>
/* ==========================================================================
   Finance Recruiting Coach: games
   Pure functions, no DOM. Seeded question generators for the Mental Math Sprint and
   Statement Flows, the live-room questions built from them, scoring, challenge links,
   the day streak and the readiness estimate.
   The same seed always gives the same round, which is what makes a challenge link fair.
   ========================================================================== */
const Games = (() => {
  'use strict';

  /* ---------- seeded random (same generator as the plan engine) ---------- */
  function rng(seedStr) {
    seedStr = String(seedStr);
    let h = 1779033703 ^ seedStr.length;
    for (let i = 0; i < seedStr.length; i++) { h = Math.imul(h ^ seedStr.charCodeAt(i), 3432918353); h = h << 13 | h >>> 19; }
    let a = h >>> 0;
    return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  }
  const pick = (r, arr) => arr[Math.floor(r() * arr.length)];
  const int = (r, lo, hi) => lo + Math.floor(r() * (hi - lo + 1));
  function shuffle(r, arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); const t = a[i]; a[i] = a[j]; a[j] = t; }
    return a;
  }
  const SEED_CHARS = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  function newSeed() { let s = ''; for (let i = 0; i < 6; i++) s += SEED_CHARS[Math.floor(Math.random() * SEED_CHARS.length)]; return s; }
  const dailySeed = iso => 'D' + String(iso).replace(/-/g, '');
  const CODE_CHARS = 'ABCDEFGHJKLMNPQRSTUVWXYZ';
  function roomCode() { let s = ''; for (let i = 0; i < 4; i++) s += CODE_CHARS[Math.floor(Math.random() * CODE_CHARS.length)]; return s; }

  /* ---------- numbers ---------- */
  const round2 = n => Math.round(n * 100) / 100;
  function fmtNum(n) {
    const v = round2(n);
    const [w, d] = String(Math.abs(v)).split('.');
    return (v < 0 ? '-' : '') + w.replace(/\B(?=(\d{3})+(?!\d))/g, ',') + (d ? '.' + d : '');
  }
  // how an answer reads next to its unit: 25%, 8.0x, $360M, 9 years
  function fmtAnswer(v, unit) {
    if (unit === 'x') return (Math.round(v * 10) / 10).toFixed(1) + 'x';
    if (unit === '%') return fmtNum(v) + '%';
    if (unit === '$M') return '$' + fmtNum(v) + 'M';
    if (unit === '$') return '$' + fmtNum(v);
    if (unit === 'yrs') return fmtNum(v) + ' years';
    return fmtNum(v);
  }
  const UNIT_HINT = { 'x': 'x', '%': '%', '$M': '$M', '$': '$', 'yrs': 'years', '': '' };
  // typed answers: "$1,200", "8x", "25 %" all count
  function parseTyped(text) {
    const s = String(text == null ? '' : text).replace(/[,\s$%]/g, '').replace(/(x|m|mm|yrs?|years?)$/i, '');
    if (!/^-?\d*\.?\d+$/.test(s)) return NaN;
    return parseFloat(s);
  }
  function checkTyped(q, text) {
    const v = parseTyped(text);
    return Number.isFinite(v) && Math.abs(v - q.answer) <= 0.011;
  }
  // three wrong answers: the usual mistakes first, then near misses
  function distract(r, ans, extras) {
    const step = Math.abs(ans) < 2 ? 0.25 : Math.abs(ans) < 20 ? 1 : Math.abs(ans) < 100 ? 5 : Math.abs(ans) < 1000 ? 10 : 50;
    const near = shuffle(r, [ans + step, ans - step, ans + 2 * step, ans * 2, ans / 2, ans - 2 * step, ans * 1.5]);
    const out = [];
    (extras || []).concat(near).forEach(v => {
      v = round2(v);
      if (out.length < 3 && Number.isFinite(v) && v > 0 && Math.abs(v - ans) > 0.011 && !out.some(o => Math.abs(o - v) < 0.011)) out.push(v);
    });
    for (let k = 3; out.length < 3; k++) out.push(round2(ans + k * step));
    return out;
  }

  /* ---------- Mental Math Sprint: the question kinds ----------
     Each returns { prompt, answer, unit, wrong }. Numbers are chosen so every answer is
     clean (a whole number or one or two decimals). lv: 0 warm-up, 1 standard, 2 hard. */
  const KINDS = {
    pctOf: { cat: 'mkt', lv: [0, 1], make(r, lv) {
      const p = pick(r, lv ? [5, 15, 30, 35, 40, 60, 75] : [10, 20, 25, 50]), base = 20 * int(r, 2, lv ? 30 : 15);
      const a = p * base / 100;
      return { prompt: p + '% of ' + fmtNum(base), answer: a, unit: '', wrong: [(100 - p) * base / 100, a * 10, a / 10] };
    } },
    pctChange: { cat: 'mkt', lv: [0, 1, 2], make(r, lv) {
      const from = pick(r, [20, 40, 60, 80, 100, 120, 200, 240, 400]);
      const up = lv === 0 || r() < 0.55;
      const p = up ? pick(r, lv === 0 ? [10, 20, 25, 50, 100] : [5, 15, 30, 35, 45, 75, 150]) : pick(r, lv === 2 ? [15, 35, 45, 65, 85] : [10, 20, 25, 40, 50, 75]);
      const to = from + (up ? 1 : -1) * from * p / 100;
      const wrongBase = Math.round(Math.abs(to - from) / to * 1000) / 10;
      const words = r() < 0.5
        ? 'A stock ' + (up ? 'rises' : 'falls') + ' from $' + fmtNum(from) + ' to $' + fmtNum(to) + '. Percent ' + (up ? 'gain' : 'drop') + '?'
        : 'Revenue ' + (up ? 'grew' : 'fell') + ' from $' + fmtNum(from) + 'M to $' + fmtNum(to) + 'M. Percent ' + (up ? 'growth' : 'decline') + '?';
      return { prompt: words, answer: p, unit: '%', wrong: [wrongBase, Math.abs(to - from)] };
    } },
    evMultiple: { cat: 'val', lv: [0, 1, 2], make(r, lv) {
      const e = pick(r, [20, 40, 50, 80, 100, 120, 150, 200, 250]), m = pick(r, lv === 0 ? [5, 6, 8, 10] : lv === 1 ? [7, 9, 11, 12, 14] : [6.5, 7.5, 8.5, 12.5]);
      return { prompt: 'Enterprise value $' + fmtNum(e * m) + 'M, EBITDA $' + fmtNum(e) + 'M. EV/EBITDA?', answer: m, unit: 'x', wrong: [m + 1, m - 1, m + 2] };
    } },
    impliedEV: { cat: 'val', lv: [1, 2], make(r, lv) {
      const e = pick(r, [20, 40, 50, 60, 80, 120, 150, 200]), m = pick(r, lv === 1 ? [6, 7, 8, 9, 10, 12] : [6.5, 7.5, 8.5, 11, 14]);
      return { prompt: 'EBITDA of $' + fmtNum(e) + 'M, peers trade at ' + m + 'x. Implied enterprise value, in $M?', answer: e * m, unit: '$M', wrong: [e * (m + 1), e * (m - 1), e * m * 10] };
    } },
    pe: { cat: 'val', lv: [0, 1], make(r) {
      const eps = pick(r, [2, 3, 4, 5, 6, 8]), m = pick(r, [10, 12, 15, 18, 20, 25, 30]);
      return { prompt: 'Share price $' + fmtNum(eps * m) + ', earnings per share $' + eps + '. P/E?', answer: m, unit: 'x', wrong: [m + 2, m - 2, m + 5] };

  const SCEN_BY_ID = {}; SCENARIOS.forEach(s => { SCEN_BY_ID[s.id] = s; });
  const plural = noun => /s$/.test(noun) && !/^cash from/i.test(noun);
  const upDown = (n, noun) => {

  function liveBoard(players, answers, seed, mix, upTo, secs) {
