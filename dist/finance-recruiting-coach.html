assumptions (hours, busy and slow periods, ticket size, summer break) and sanity-checks the result.\n","answers":{"Cold open":"Working capital is current assets minus current liabilities. For operations, the part that matters is receivables plus inventory minus payables: the cash tied up in running the business. When a company grows, it usually has to build inventory and give customers credit before it gets paid, while suppliers expect to be paid on their own schedule, so more sales means more cash tied up. Net income can be positive, but if the increase in working capital is bigger than net income plus non-cash expenses, operating cash flow turns negative. If the company can't fund that gap with debt or equity, it can run out of cash while still profitable on paper. Businesses with negative working capital, like Amazon, are the opposite: customers pay before suppliers do, so growth actually brings in cash.","Say it out loud":"Collect receivables faster, hold less inventory, negotiate longer payment terms with suppliers, cut costs, or sell assets it doesn't need. A strong answer mentions the trade-offs, like losing customers by tightening credit or straining suppliers.","Rapid fire a":"Days sales outstanding plus days inventory outstanding minus days payables outstanding.","Rapid fire b":"It falls by $30.","Rapid fire c":"Customers pay up front, which creates deferred revenue, before the company has delivered the service or paid many of its costs.","Rewind":"Cash goes up by $2.50, the tax saved.","Brain teaser":"One approach: about 300 customers a day at an average of $6 is $1,800 a day; times about 360 days is roughly $650,000 a year. A strong answer states its assumptions (hours, busy and slow periods, ticket size, summer break) and sanity-checks the result."}},"acc-ebitda-why-bankers-love-it-and-why-buffett-and-m":{"title":"EBITDA: why bankers love it and why Buffett and Munger didn't","cat":"acc","slug":"ebitda-why-bankers-love-it-and-why-buffett-and-munger-didn-t","md":"# EBITDA: why bankers love it and why Buffett and Munger didn't\n*Comes up in:* Banking, private equity and credit interviews, and any valuation question that uses EV/EBITDA.\n\n## Cold open\n\"Why is EBITDA so widely used, and what are its flaws?\"\n\nAnswer it out loud before you read on.\n\n## The big idea\nEBITDA is earnings before interest, taxes, depreciation and amortization: roughly operating income plus D&A. Bankers love it because it strips out how a company is financed (interest), where it pays taxes, and how it depreciates its assets, so it's an easy way to compare the core operations of different companies. Its critics point out that it also strips out real costs. Think of judging a restaurant by its sales minus food and staff costs while ignoring that the kitchen needs replacing every few years.\n\n## How it works\nFor Coffee Co., operating income is 250 and D&A is 50, so EBITDA is 300. It's used for three big things: valuation multiples (enterprise value divided by EBITDA), leverage measures (debt divided by EBITDA, which lenders use to size and limit loans), and quick comparisons across companies.\n\nThe problem is what it leaves out. Two companies can have identical EBITDA and very different cash:\n\n| | Software company | Steel mill |\n|---|---|---|\n| EBITDA | 300 | 300 |\n| Capital expenditures | (20) | (200) |\n| **EBITDA minus capex** | **280** | **100** |\n\nEBITDA ignores capex, changes in working capital, taxes and interest, all of which are real cash. And because it isn't defined by accounting rules, companies report \"adjusted EBITDA\" that adds back whatever they consider one-time, which needs checking.\n\n## In the real world\nWarren Buffett put the objection memorably in his 2000 letter to Berkshire shareholders: references to EBITDA make us shudder, he wrote, asking whether management thinks the tooth fairy pays for capital expenditures. Charlie Munger was blunter still. Adjustments can go too far: in 2018, WeWork sold bonds using a measure it called \"community-adjusted EBITDA,\" which left out costs such as marketing and general and administrative expenses. Critics mocked it, and the company's 2019 IPO collapsed. In any earnings release, compare adjusted EBITDA with GAAP operating income and read the list of what was added back.\n\n## The interview trap\nThe trap is calling EBITDA \"cash flow.\" It's a rough proxy for operating cash flow before capex, and only that.\n\n> EBITDA is earnings before interest, taxes, depreciation and amortization, roughly operating income plus D&A. People use it because it removes the effects of capital structure, tax rates and depreciation policy, so it's a quick way to compare the core operating performance of different companies, and it's the basis for multiples like EV to EBITDA and leverage measures like debt to EBITDA. The flaws are that it ignores real cash costs: capital expenditures, working capital needs, taxes and interest. A capital-intensive business can have a lot of EBITDA and very little free cash flow, which is Buffett's point when he asked whether management thinks the tooth fairy pays for capex. And because it isn't a GAAP measure, companies can adjust it aggressively, so you always check what's been added back.\n\n## Your line\n\"EBITDA is a fine place to start and a terrible place to stop.\" **Follow-up you'll get:** \"Which is better for valuation, EBITDA or free cash flow?\" **The other side:** For lenders and buyout firms, EBITDA remains the standard, because it approximates the cash available to pay debt before capex, and it's comparable across deals.\n\n## Your turn\n1. **Say it out loud:** Two companies both have $300 of EBITDA. Why might one be worth far more than the other?\n2. **Rapid fire:**\n   a. Operating income is 250 and D&A is 50. What's EBITDA?\n   b. Name two real costs EBITDA ignores.\n   c. How do lenders commonly use EBITDA?\n3. **Rewind:** In one sentence, what is working capital?\n4. **Brain teaser:** If you double a number and then increase the result by 50%, what's the total percentage increase?\n\n## Answers\n- **Say it out loud:** Differences in capex needs, working capital, growth, the stability of the business, risk, debt and taxes, which all show up in free cash flow but not EBITDA. A strong answer gives a concrete contrast, like an asset-light software company versus a steel mill.\n- **a.** 300.\n- **b.** Any two of capital expenditures, working capital, taxes and interest.\n- **c.** To size loans and set limits, such as a maximum ratio of debt to EBITDA in loan agreements.\n- **Rewind:** Current assets minus current liabilities; for operations, receivables plus inventory minus payables.\n- **Brain teaser:** 200%. Doubling and then multiplying by 1.5 triples the number.\n","answers":{"Cold open":"EBITDA is earnings before interest, taxes, depreciation and amortization, roughly operating income plus D&A. People use it because it removes the effects of capital structure, tax rates and depreciation policy, so it's a quick way to compare the core operating performance of different companies, and it's the basis for multiples like EV to EBITDA and leverage measures like debt to EBITDA. The flaws are that it ignores real cash costs: capital expenditures, working capital needs, taxes and interest. A capital-intensive business can have a lot of EBITDA and very little free cash flow, which is Buffett's point when he asked whether management thinks the tooth fairy pays for capex. And because it isn't a GAAP measure, companies can adjust it aggressively, so you always check what's been added back.","Say it out loud":"Differences in capex needs, working capital, growth, the stability of the business, risk, debt and taxes, which all show up in free cash flow but not EBITDA. A strong answer gives a concrete contrast, like an asset-light software company versus a steel mill.","Rapid fire a":"300.","Rapid fire b":"Any two of capital expenditures, working capital, taxes and interest.","Rapid fire c":"To size loans and set limits, such as a maximum ratio of debt to EBITDA in loan agreements.","Rewind":"Current assets minus current liabilities; for operations, receivables plus inventory minus payables.","Brain teaser":"200%. Doubling and then multiplying by 1.5 triples the number."}},"acc-free-cash-flow-unlevered-vs-levered-and-why-inve":{"title":"Free cash flow: unlevered vs. levered, and why investors care most about it","cat":"acc","slug":"free-cash-flow-unlevered-vs-levered-and-why-investors-care","md":"# Free cash flow: unlevered vs. levered, and why investors care most about it\n*Comes up in:* Every valuation discussion, and almost every DCF question.\n\n## Cold open\n\"What's the difference between levered and unlevered free cash flow, and which discount rate goes with each?\"\n\nAnswer it out loud before you read on.\n\n## The big idea\nFree cash flow is the cash a business generates after the investments it needs to keep running and growing. **Unlevered free cash flow** is measured before any payments to lenders, so it belongs to everyone who funds the company, debt and equity alike. **Levered free cash flow** is what's left for shareholders after interest and required debt repayments. Think of a rental property: the rent minus upkeep is unlevered cash flow; what's left after the mortgage payment is levered cash flow, the part that's yours.\n\n## How it works\nThe formulas:\n\n- **Unlevered FCF** = EBIT × (1 − tax rate) + D&A − capex − increase in net working capital\n- **Levered FCF** = net income + D&A − capex − increase in net working capital − required debt repayment\n\nFor Coffee Co., with EBIT of 250, a 25% tax rate, D&A of 50, capex of 100, a working capital increase of 30, interest of 50 and a 20 debt repayment:\n\n| Unlevered | | Levered | |\n|---|---|---|---|\n| EBIT × (1 − 25%) | 187.5 | Net income (after interest) | 150 |\n| + D&A | 50 | + D&A | 50 |\n| − Capex | (100) | − Capex | (100) |\n| − Increase in working capital | (30) | − Increase in working capital | (30) |\n| | | − Debt repayment | (20) |\n| **Unlevered FCF** | **107.5** | **Levered FCF** | **50** |\n\nThe matching rule is the part interviewers test. Unlevered free cash flow goes to all capital providers, so you discount it at the **weighted average cost of capital (WACC)** and get **enterprise value**. Levered free cash flow goes to shareholders, so you discount it at the **cost of equity** and get **equity value**. Bankers usually build unlevered DCFs, because the result doesn't depend on how the company happens to be financed.\n\n## In the real world\nApple is the textbook free cash flow machine. In recent fiscal years it has generated roughly $100 billion of free cash flow a year (operating cash flow above $110 billion, minus about $10 billion of capex), and it has handed most of that back through buybacks and dividends. Investors watch free cash flow because it's the cash a company can actually use: to pay down debt, return to shareholders or reinvest. For a company you follow, divide its free cash flow by its market value to get its free cash flow yield, and compare it with the 10-year Treasury yield.\n\n## The interview trap\nThe trap is mixing the pieces: discounting levered cash flow at WACC, or unlevered cash flow at the cost of equity.\n\n> Free cash flow is the cash a business generates after the investments it needs to sustain and grow. Unlevered free cash flow is calculated before interest: you take operating income, subtract taxes as if the company had no debt, add back depreciation and other non-cash charges, and subtract capex and the increase in working capital. Because it's available to both lenders and shareholders, you discount it at the weighted average cost of capital, which gives you enterprise value. Levered free cash flow is what's left for shareholders after interest and required debt repayments, so you discount it at the cost of equity, which gives you equity value directly. Bankers usually use unlevered free cash flow in a DCF because it doesn't depend on how the company is financed.\n\n## Your line\n\"Unlevered goes with WACC and enterprise value; levered goes with the cost of equity and equity value.\" **Follow-up you'll get:** \"Why do bankers prefer unlevered DCFs?\" **The other side:** For banks and other businesses where debt is part of operations, levered cash flow or dividend models often make more sense.\n\n## Your turn\n1. **Say it out loud:** Walk me through how to calculate unlevered free cash flow, starting from revenue.\n2. **Rapid fire:**\n   a. EBIT is 200, the tax rate is 25%, D&A is 30, capex is 50 and working capital rises by 10. What's unlevered free cash flow?\n   b. Which discount rate goes with levered free cash flow?\n   c. Why is interest left out of unlevered free cash flow?\n3. **Rewind:** Why do people use EBITDA, and what's its main flaw?\n4. **Brain teaser:** Roughly what is 1.07 to the 10th power? Explain your shortcut.\n\n## Answers\n- **Say it out loud:** Revenue minus operating costs, including D&A, gives EBIT; multiply by (1 − tax rate) to get after-tax operating profit; add back D&A and other non-cash charges; subtract capex and the increase in net working capital.\n- **a.** 120: 200 × 0.75 = 150, plus 30, minus 50, minus 10.\n- **b.** The cost of equity.\n- **c.** Unlevered cash flow belongs to all capital providers; the cost of paying lenders is captured in the discount rate (WACC) instead.\n- **Rewind:** It compares operating performance across companies with different debt, taxes and depreciation; its main flaw is ignoring real cash costs like capex, working capital and taxes.\n- **Brain teaser:** About 1.97, so roughly double. By the rule of 72, money growing at 7% doubles in about 72 ÷ 7 ≈ 10 years.\n","answers":{"Cold open":"Free cash flow is the cash a business generates after the investments it needs to sustain and grow. Unlevered free cash flow is calculated before interest: you take operating income, subtract taxes as if the company had no debt, add back depreciation and other non-cash charges, and subtract capex and the increase in working capital. Because it's available to both lenders and shareholders, you discount it at the weighted average cost of capital, which gives you enterprise value. Levered free cash flow is what's left for shareholders after interest and required debt repayments, so you discount it at the cost of equity, which gives you equity value directly. Bankers usually use unlevered free cash flow in a DCF because it doesn't depend on how the company is financed.","Say it out loud":"Revenue minus operating costs, including D&A, gives EBIT; multiply by (1 − tax rate) to get after-tax operating profit; add back D&A and other non-cash charges; subtract capex and the increase in net working capital.","Rapid fire a":"120: 200 × 0.75 = 150, plus 30, minus 50, minus 10.","Rapid fire b":"The cost of equity.","Rapid fire c":"Unlevered cash flow belongs to all capital providers; the cost of paying lenders is captured in the discount rate (WACC) instead.","Rewind":"It compares operating performance across companies with different debt, taxes and depreciation; its main flaw is ignoring real cash costs like capex, working capital and taxes.","Brain teaser":"About 1.97, so roughly double. By the rule of 72, money growing at 7% doubles in about 72 ÷ 7 ≈ 10 years."}},"val-time-value-of-money-why-100-today-beats-100-next":{"title":"Time value of money: why $100 today beats $100 next year","cat":"val","slug":"time-value-of-money-why-100-today-beats-100-next-year","md":"# Time value of money: why $100 today beats $100 next year\n*Comes up in:* The foundation of every valuation question, and a common warm-up in wealth management and asset management interviews.\n\n## Cold open\n\"Would you rather have $100 today or $105 a year from now? What does your answer depend on?\"\n\nAnswer it out loud before you read on.\n\n## The big idea\nA dollar today is worth more than a dollar later, for three reasons. You can invest today's dollar and earn a return. Inflation erodes what a future dollar can buy. And a promised future dollar might not arrive. So before you compare money at different dates, you move it to the same date: forward by compounding, or back to today by discounting. Think of today's dollar as a seed you can plant now, and next year's dollar as a seedling someone promised to hand you later.\n\n## How it works\nTwo formulas do all the work:\n\n- **Future value** = present value × (1 + r)ⁿ\n- **Present value** = future value ÷ (1 + r)ⁿ\n\nAt 5%, $100 today grows to $105 in one year and $110.25 in two. Going the other way, $105 received in one year is worth exactly $100 today at a 5% rate, but only about $97.22 at 8%. The higher the rate you could earn elsewhere, the less a future payment is worth today.\n\nCompounding is what makes time so powerful. Here's $1,000 growing at 7% a year:\n\n| Years | Value |\n|---|---|\n| 10 | $1,967 |\n| 20 | $3,870 |\n| 30 | $7,612 |\n\nA handy shortcut is the **rule of 72**: divide 72 by the annual rate to estimate how many years money takes to double. At 7%, that's a little over 10 years, which matches the table.\n\n## In the real world\nThe rate you could earn elsewhere changed dramatically between 2021 and 2023. When the Fed raised rates, yields on three-month Treasury bills went from near zero to above 5%. Suddenly $100 today could earn 5% with almost no risk, so a promise of $105 next year stopped looking generous. The same math hit asset prices: in 2022, as rates rose, the Nasdaq fell about 33% and the broad U.S. bond market lost about 13%, its worst year on record, because future cash flows were worth less in today's dollars. Before an interview, look up the current three-month Treasury bill yield; it's the simplest answer to \"what could I earn safely?\"\n\n## The interview trap\nThe trap is answering \"the $105, because it's more\" without comparing it to anything, or forgetting that the future payment carries risk.\n\n> It depends on what I could do with the $100 today. Money today is worth more than the same amount later because I could invest it, because inflation erodes what future dollars can buy, and because a future payment carries some risk of not arriving. So I'd compare the 5% return implied by the $105 with what I could earn on something equally safe. If one-year Treasury bills pay more than 5%, I'd take the $100 now and invest it; if they pay less, the $105 is the better deal, as long as I'm confident it will be paid. In general, the present value of a future amount is that amount divided by one plus the discount rate, raised to the number of years.\n\n## Your line\n\"You can only compare dollars once you've moved them to the same date.\" **Follow-up you'll get:** \"What discount rate would you use, and why?\" **The other side:** People often prefer money now even when waiting pays more, which is why real decisions don't always follow the formula.\n\n## Your turn\n1. **Say it out loud:** Explain to a friend with no finance background why $1,000 in five years is worth less than $1,000 today.\n2. **Rapid fire:**\n   a. What is $100 growing at 10% a year worth in two years?\n   b. What's the present value of $110 received in one year at a 10% discount rate?\n   c. Using the rule of 72, about how long does money take to double at 9%?\n3. **Rewind:** What's the difference between levered and unlevered free cash flow?\n4. **Brain teaser:** What is 1.05 squared?\n\n## Answers\n- **Say it out loud:** A strong answer gives all three reasons in plain words (you could invest it, inflation shrinks what it buys, and the future payment might not come) and uses a simple example, like $1,000 invested at 5% growing to about $1,276 in five years.\n- **a.** $121.\n- **b.** $100.\n- **c.** About 8 years: 72 ÷ 9.\n- **Rewind:** Unlevered free cash flow is before interest and belongs to all capital providers; levered free cash flow is after interest and debt repayment and belongs to shareholders.\n- **Brain teaser:** 1.1025.\n","answers":{"Cold open":"It depends on what I could do with the $100 today. Money today is worth more than the same amount later because I could invest it, because inflation erodes what future dollars can buy, and because a future payment carries some risk of not arriving. So I'd compare the 5% return implied by the $105 with what I could earn on something equally safe. If one-year Treasury bills pay more than 5%, I'd take the $100 now and invest it; if they pay less, the $105 is the better deal, as long as I'm confident it will be paid. In general, the present value of a future amount is that amount divided by one plus the discount rate, raised to the number of years.","Say it out loud":"A strong answer gives all three reasons in plain words (you could invest it, inflation shrinks what it buys, and the future payment might not come) and uses a simple example, like $1,000 invested at 5% growing to about $1,276 in five years.","Rapid fire a":"$121.","Rapid fire b":"$100.","Rapid fire c":"About 8 years: 72 ÷ 9.","Rewind":"Unlevered free cash flow is before interest and belongs to all capital providers; levered free cash flow is after interest and debt repayment and belongs to shareholders.","Brain teaser":"1.1025."}},"val-present-value-discount-rates-npv-and-irr-the-eng":{"title":"Present value, discount rates, NPV and IRR: the engine behind every valuation","cat":"val","slug":"present-value-discount-rates-npv-and-irr-the-engine-behind","md":"# Present value, discount rates, NPV and IRR: the engine behind every valuation\n*Comes up in:* Corporate finance and private equity interviews especially, and as a building block for every DCF question.\n\n## Cold open\n\"What's the difference between NPV and IRR?\"\n\nAnswer it out loud before you read on.\n\n## The big idea\n**Net present value (NPV)** adds up the present value of a project's future cash flows, at the return you require, and subtracts what it costs today. Positive NPV means the project earns more than your required return, and the number tells you how much value it creates in today's dollars. **Internal rate of return (IRR)** is the discount rate that makes NPV exactly zero: the project's own implied annual return. Think of NPV as the profit in today's dollars and IRR as the interest rate the project pays you.\n\n## How it works\nSay a project costs $1,000 today and pays $400 at the end of each of the next three years.\n\n| Year | Cash flow | Present value at 8% | Present value at 10% |\n|---|---|---|---|\n| 1 | 400 | 370.37 | 363.64 |\n| 2 | 400 | 342.94 | 330.58 |\n| 3 | 400 | 317.53 | 300.53 |\n| **Total** | | **1,030.84** | **994.74** |\n| **NPV (minus 1,000)** | | **+30.84** | **−5.26** |\n\nAt an 8% required return the project creates value; at 10% it doesn't. The IRR sits in between, at about 9.7%: the rate where the present value of the cash flows equals exactly $1,000. The decision rules: accept if NPV is positive, or equivalently if IRR beats your required return.\n\nThey usually agree, but not always. IRR ignores size: a $10 project with a 50% IRR creates less value than a $10 million project with a 15% IRR. IRR assumes cash flows are reinvested at the IRR itself. And when cash flows switch between positive and negative more than once, a project can have more than one IRR. When the two conflict, NPV is the better guide to value.\n\n## In the real world\nPrivate equity funds report IRR alongside MOIC (multiple on invested capital), and the gap between the two is worth watching. Many funds borrow on short-term credit lines before calling money from their investors, which shortens the time investors' cash is at work and raises IRR without raising the actual profit. The Institutional Limited Partners Association, the main investor trade group, published guidance in 2017 asking funds to disclose that effect. When you read a fund's results, check the multiple as well as the IRR: a high IRR on a small multiple can mean a quick trade rather than a great investment.\n\n## The interview trap\nThe trap is saying IRR is \"better\" than NPV, or not knowing that IRR is the rate at which NPV equals zero.\n\n> NPV is the present value of a project's future cash flows minus what it costs today, using the return you require as the discount rate. If NPV is positive, the project earns more than your required return and creates value, measured in dollars. IRR is the discount rate that makes NPV exactly zero, so it's the project's implied annual return, and you accept a project if its IRR beats your required return. They usually agree, but when they conflict, NPV is the better guide, because IRR ignores the size of a project and can mislead when cash flows change sign more than once. A small project with a 50% IRR can create less value than a large one with a 15% IRR.\n\n## Your line\n\"NPV tells you how much value a project creates; IRR tells you how fast.\" **Follow-up you'll get:** \"Why do private equity firms care so much about IRR?\" **The other side:** IRR assumes cash flows can be reinvested at the same high rate, which is often unrealistic; the modified IRR fixes that by assuming a more modest reinvestment rate.\n\n## Your turn\n1. **Say it out loud:** A project costs $1,000 and pays $400 a year for three years. Would you do it with a 10% required return? Explain how you'd decide.\n2. **Rapid fire:**\n   a. What's the IRR of an investment that turns $100 into $121 in two years?\n   b. If NPV is positive at a 10% discount rate, is the IRR above or below 10%?\n   c. Name one weakness of IRR.\n3. **Rewind:** What three things make money today worth more than money later?\n4. **Brain teaser:** Roughly what is 1 ÷ 1.1, and why is it a useful number to know?\n\n## Answers\n- **Say it out loud:** Discount each $400 at 10%: about $364, $331 and $301, for a total of about $995. NPV is about −$5, so at a 10% required return it narrowly destroys value, and the IRR, about 9.7%, falls just short. A strong answer also notes that the decision is close, so the assumptions matter.\n- **a.** 10%.\n- **b.** Above 10%.\n- **c.** Any of: it ignores the size of the project, it assumes reinvestment at the IRR, it can produce more than one answer when cash flows change sign, and it's sensitive to timing.\n- **Rewind:** You could invest it and earn a return, inflation erodes future dollars, and a future payment carries risk.\n- **Brain teaser:** About 0.909. It's the present value of $1 received in one year at a 10% discount rate.\n","answers":{"Cold open":"NPV is the present value of a project's future cash flows minus what it costs today, using the return you require as the discount rate. If NPV is positive, the project earns more than your required return and creates value, measured in dollars. IRR is the discount rate that makes NPV exactly zero, so it's the project's implied annual return, and you accept a project if its IRR beats your required return. They usually agree, but when they conflict, NPV is the better guide, because IRR ignores the size of a project and can mislead when cash flows change sign more than once. A small project with a 50% IRR can create less value than a large one with a 15% IRR.","Say it out loud":"Discount each $400 at 10%: about $364, $331 and $301, for a total of about $995. NPV is about −$5, so at a 10% required return it narrowly destroys value, and the IRR, about 9.7%, falls just short. A strong answer also notes that the decision is close, so the assumptions matter.","Rapid fire a":"10%.","Rapid fire b":"Above 10%.","Rapid fire c":"Any of: it ignores the size of the project, it assumes reinvestment at the IRR, it can produce more than one answer when cash flows change sign, and it's sensitive to timing.","Rewind":"You could invest it and earn a return, inflation erodes future dollars, and a future payment carries risk.","Brain teaser":"About 0.909. It's the present value of $1 received in one year at a 10% discount rate."}},"val-equity-value-vs-enterprise-value-the-house-and-m":{"title":"Equity value vs. enterprise value (the house-and-mortgage analogy)","cat":"val","slug":"equity-value-vs-enterprise-value-the-house-and-mortgage","md":"# Equity value vs. enterprise value (the house-and-mortgage analogy)\n*Comes up in:* Nearly every banking, private equity and equity research first round, usually as one of the first technical questions.\n\n## Cold open\n\"What's the difference between equity value and enterprise value?\"\n\nAnswer it out loud before you read on.\n\n## The big idea\n**Equity value** is what the shares are worth: the share price times diluted shares outstanding. It belongs to shareholders. **Enterprise value (EV)** is what the core business is worth to everyone who funds it: equity value plus debt and other investor claims, minus cash. Think of a house worth $500,000 with a $400,000 mortgage. The owner's equity is $100,000, but the house itself is worth $500,000. If you bought it, you'd pay the owner $100,000 and take on the $400,000 mortgage, so the total cost is $500,000.\n\n## How it works\nHere's a company with a $50 share price.\n\n| Step | Amount |\n|---|---|\n| Share price | $50 |\n| × Diluted shares | 10 million |\n| **= Equity value** | **$500 million** |\n| + Debt | $200 million |\n| − Cash | $50 million |\n| **= Enterprise value** | **$650 million** |\n\nWhy bother with EV? Because buying an entire business means taking on its debt, and because it lets you compare companies with different amounts of debt on an equal footing. It also tells you which metrics to pair it with. EV represents all investors, so it goes with measures calculated before interest, like revenue and EBITDA. Equity value represents only shareholders, so it goes with measures after interest, like net income and earnings per share.\n\n## In the real world\nWhen Broadcom agreed to buy VMware in May 2022, its announcement gave both numbers. It would pay about $61 billion in cash and stock for VMware's shares, its equity value, and assume $8 billion of VMware's net debt, putting the total enterprise value at roughly $69 billion. The deal closed in November 2023. Headlines often quote one number without saying which it is, so when you read about a deal, check whether the figure includes the target's debt.\n\n## The interview trap\nThe traps are saying enterprise value is \"what the company is worth to everyone\" with nothing more specific, forgetting to subtract cash, or treating EV and market capitalization as the same thing.\n\n> Equity value is the value of a company's shares: the share price times diluted shares outstanding, which is the part that belongs to shareholders. Enterprise value is the value of the company's core operations to all of its capital providers: equity value plus debt, preferred stock and noncontrolling interests, minus cash. Think of a house worth $500,000 with a $400,000 mortgage: the owner's equity is $100,000, but the house itself is worth $500,000. We use enterprise value to compare companies with different amounts of debt, and we pair it with metrics that belong to all investors, like revenue or EBITDA, while equity value pairs with metrics that belong only to shareholders, like net income.\n\n## Your line\n\"Equity value is what the shareholders own; enterprise value is what the business is worth to everyone who funded it.\" **Follow-up you'll get:** \"Can enterprise value be lower than equity value?\" **The other side:** EV treats all cash as surplus, but some cash is needed to run the business, so some analysts subtract only the excess.\n\n## Your turn\n1. **Say it out loud:** Use the house analogy to explain why you add debt to get to enterprise value.\n2. **Rapid fire:**\n   a. Share price $20, 50 million diluted shares, $300 million of debt and $100 million of cash. What's EV?\n   b. Can enterprise value be negative?\n   c. Which goes with EBITDA: enterprise value or equity value?\n3. **Rewind:** What does IRR measure?\n4. **Brain teaser:** A company's share price rises 10%, and its debt and cash don't change. Does its EV rise by more or less than 10%?\n\n## Answers\n- **Say it out loud:** A house worth $500,000 with a $400,000 mortgage has $100,000 of equity. A buyer pays the owner $100,000 and takes on the mortgage, so the house costs $500,000 in total. In the same way, buying a company means paying its shareholders and taking on its debt, so EV adds debt to equity value.\n- **a.** $1.2 billion: equity value of $1 billion, plus $300 million of debt, minus $100 million of cash.\n- **b.** Yes, if a company's cash is larger than its equity value plus debt, which happens occasionally with cash-rich companies the market has given up on.\n- **c.** Enterprise value.\n- **Rewind:** A project's implied annual return: the discount rate at which its NPV equals zero.\n- **Brain teaser:** It depends on net debt. EV rises by the same dollar amount as equity value; with net debt, EV is larger, so the percentage rise is less than 10%. With net cash, it's more than 10%.\n","answers":{"Cold open":"Equity value is the value of a company's shares: the share price times diluted shares outstanding, which is the part that belongs to shareholders. Enterprise value is the value of the company's core operations to all of its capital providers: equity value plus debt, preferred stock and noncontrolling interests, minus cash. Think of a house worth $500,000 with a $400,000 mortgage: the owner's equity is $100,000, but the house itself is worth $500,000. We use enterprise value to compare companies with different amounts of debt, and we pair it with metrics that belong to all investors, like revenue or EBITDA, while equity value pairs with metrics that belong only to shareholders, like net income.","Say it out loud":"A house worth $500,000 with a $400,000 mortgage has $100,000 of equity. A buyer pays the owner $100,000 and takes on the mortgage, so the house costs $500,000 in total. In the same way, buying a company means paying its shareholders and taking on its debt, so EV adds debt to equity value.","Rapid fire a":"$1.2 billion: equity value of $1 billion, plus $300 million of debt, minus $100 million of cash.","Rapid fire b":"Yes, if a company's cash is larger than its equity value plus debt, which happens occasionally with cash-rich companies the market has given up on.","Rapid fire c":"Enterprise value.","Rewind":"A project's implied annual return: the discount rate at which its NPV equals zero.","Brain teaser":"It depends on net debt. EV rises by the same dollar amount as equity value; with net debt, EV is larger, so the percentage rise is less than 10%. With net cash, it's more than 10%."}},"val-the-ev-bridge-why-you-add-debt-and-subtract-cash":{"title":"The EV bridge: why you add debt and subtract cash (and the trick questions)","cat":"val","slug":"the-ev-bridge-why-you-add-debt-and-subtract-cash-and-the","md":"# The EV bridge: why you add debt and subtract cash (and the trick questions)\n*Comes up in:* Banking and private equity technicals, often as a follow-up to the enterprise value question, with a trick question attached.\n\n## Cold open\n\"Why do you add debt and subtract cash to get from equity value to enterprise value?\"\n\nAnswer it out loud before you read on.\n\n## The big idea\nEnterprise value adds every claim on the business and subtracts everything that isn't part of the business. If you bought a whole company, you'd pay the shareholders and then also have to take on or repay its debt and other investor claims, so those get added. You'd also get its cash, which you could use to pay down that debt, so it reduces your real cost and gets subtracted. Think of buying a used car that comes with a $2,000 loan attached and $300 in the glove box: the real price is what you pay the seller, plus the loan, minus the $300.\n\n## How it works\nHere's the bridge, item by item:\n\n| Item | Direction | Why |\n|---|---|---|\n| Equity value | Start | The value to common shareholders |\n| + Debt | Add | Lenders' claim; a buyer must repay or assume it |\n| + Preferred stock | Add | Another investor claim, ranked ahead of common shareholders |\n| + Noncontrolling interests | Add | The parent reports 100% of a subsidiary's EBITDA but owns less, so add the outside owners' stake to match |\n| − Cash | Subtract | It isn't part of operations, and the buyer gets it |\n| − Non-operating assets | Subtract | Investments that don't produce operating profit |\n\nThe trick questions test whether you understand the logic or memorized a formula:\n\n- **A company borrows $100 and holds it as cash.** EV doesn't change: debt rises by $100 and cash rises by $100.\n- **A company uses $100 of cash to repay debt.** EV doesn't change.\n- **A company issues $100 of stock and keeps the cash.** Equity value rises $100 and cash rises $100, so EV doesn't change.\n- **A company pays a $50 dividend.** Cash falls $50 and, in theory, equity value falls $50, so EV doesn't change.\n- **Why subtract cash but not inventory?** Inventory is part of operations and helps produce EBITDA; excess cash doesn't.\n\n## In the real world\nMicrosoft's 2022 agreement to buy Activision Blizzard is a clean example of the bridge in a press release. Activision shareholders were to receive $95 a share in cash, and Microsoft described the deal as \"valued at $68.7 billion, inclusive of Activision Blizzard's net cash.\" In other words, the payment to shareholders added up to more than $68.7 billion, and the headline value netted out the cash Microsoft would get along with the company. When the next big deal is announced, read the release and find which number is equity value and which includes debt or cash.\n\n## The interview trap\nThe trap is reciting the formula with no logic, or saying you subtract cash \"because it's an asset.\" So is a factory, and you don't subtract that.\n\n> Enterprise value is the value of the core business to everyone with a claim on it. If you bought the whole company, you'd pay the shareholders the equity value, but you'd also have to take on or repay its debt, so you add debt, along with other investor claims like preferred stock and noncontrolling interests. You subtract cash because it isn't part of the operating business, and you'd get it along with the company; you could use it to pay down debt, so it reduces your effective cost. That's also why EV doesn't change when a company borrows money and holds it as cash: debt goes up and cash goes up by the same amount.\n\n## Your line\n\"Add every claim on the business, and subtract everything that isn't the business.\" **Follow-up you'll get:** \"A company borrows $100 to build a $100 factory. What happens to EV?\" **The other side:** Some analysts also add debt-like items such as lease obligations and pension deficits; what matters is staying consistent with the EBITDA you pair EV with.\n\n## Your turn\n1. **Say it out loud:** A company borrows $100 and keeps it as cash. What happens to its enterprise value, and why?\n2. **Rapid fire:**\n   a. Why do you add noncontrolling interests?\n   b. Equity value is 500, debt is 200, preferred stock is 50 and cash is 100. What's EV?\n   c. A company pays a $30 dividend. What happens to EV?\n3. **Rewind:** Explain the house-and-mortgage analogy for enterprise value.\n4. **Brain teaser:** What's 35 × 35?\n\n## Answers\n- **Say it out loud:** Nothing happens to EV: debt rises by $100 and cash rises by $100, so they offset, and equity value doesn't change either. It's a financing decision, not a change to the operating business.\n- **a.** The parent reports 100% of a majority-owned subsidiary's revenue and EBITDA even though it owns less than all of it, so you add the outside owners' stake to make EV match the EBITDA.\n- **b.** 650.\n- **c.** In theory, nothing: cash falls by $30 and equity value falls by $30.\n- **Rewind:** A house worth $500,000 with a $400,000 mortgage has $100,000 of equity; buying it means paying the owner $100,000 and taking on the mortgage, so the total cost is $500,000.\n- **Brain teaser:** 1,225. For numbers ending in 5: 3 × 4 = 12, then add 25.\n","answers":{"Cold open":"Enterprise value is the value of the core business to everyone with a claim on it. If you bought the whole company, you'd pay the shareholders the equity value, but you'd also have to take on or repay its debt, so you add debt, along with other investor claims like preferred stock and noncontrolling interests. You subtract cash because it isn't part of the operating business, and you'd get it along with the company; you could use it to pay down debt, so it reduces your effective cost. That's also why EV doesn't change when a company borrows money and holds it as cash: debt goes up and cash goes up by the same amount.","Say it out loud":"Nothing happens to EV: debt rises by $100 and cash rises by $100, so they offset, and equity value doesn't change either. It's a financing decision, not a change to the operating business.","Rapid fire a":"The parent reports 100% of a majority-owned subsidiary's revenue and EBITDA even though it owns less than all of it, so you add the outside owners' stake to make EV match the EBITDA.","Rapid fire b":"650.","Rapid fire c":"In theory, nothing: cash falls by $30 and equity value falls by $30.","Rewind":"A house worth $500,000 with a $400,000 mortgage has $100,000 of equity; buying it means paying the owner $100,000 and taking on the mortgage, so the total cost is $500,000.","Brain teaser":"1,225. For numbers ending in 5: 3 × 4 = 12, then add 25."}},"val-valuation-multiples-p-e-ev-ebitda-ev-revenue-and":{"title":"Valuation multiples: P/E, EV/EBITDA, EV/Revenue, and which ones go together","cat":"val","slug":"valuation-multiples-p-e-ev-ebitda-ev-revenue-and-which-ones","md":"# Valuation multiples: P/E, EV/EBITDA, EV/Revenue, and which ones go together\n*Comes up in:* Every valuation discussion, from banking technicals to \"pitch me a stock\" in asset management.\n\n## Cold open\n\"Why do you pair enterprise value with EBITDA but equity value with net income?\"\n\nAnswer it out loud before you read on.\n\n## The big idea\nA multiple divides a value by a measure of performance, so you can compare companies of different sizes, like comparing houses by price per square foot. The one rule: the top and the bottom have to belong to the same investors. Enterprise value belongs to everyone who funds the company, so it goes with measures calculated before interest is paid: revenue, EBITDA and EBIT. Equity value belongs to shareholders, so it goes with measures after interest: net income and earnings per share.\n\n## How it works\nThe common multiples:\n\n| Multiple | Good for | Watch out for |\n|---|---|---|\n| P/E (price ÷ earnings per share) | Mature, profitable companies | Distorted by debt, taxes and one-time items; useless when earnings are negative |\n| EV/EBITDA | Most industries; comparing companies with different debt | Ignores capex |\n| EV/EBIT | Capital-heavy businesses, since it counts depreciation | Still ignores working capital |\n| EV/Revenue | Young or unprofitable companies | Ignores profitability entirely |\n| Price/book | Banks and insurers | Book values can be stale |\n\nA quick example: a stock at $40 with earnings per share of $2 trades at 20 times earnings. A company with an EV of $1.2 billion and EBITDA of $150 million trades at 8 times EBITDA.\n\nWhy does mismatching break? EV divided by net income compares the value to all investors with a profit that has already had the lenders' interest taken out. The numerator and denominator are measuring different things.\n\nWhat makes one company deserve a higher multiple than another: faster growth, higher and more stable margins, better returns on capital and lower risk.\n\n## In the real world\nMultiples are how the market expresses its mood. By FactSet's count, the S&P 500 has averaged about 19 times the next year's expected earnings over the past ten years. It ran above 20 for much of 2024 and 2025 as investors paid up for the largest technology companies, then drifted back to about 19 by September 2026. A high multiple isn't automatically a bubble: it can reflect faster expected growth. It does mean the market has less room for disappointment. Look up the S&P 500's current forward P/E in FactSet's weekly Earnings Insight report before an asset management interview.\n\n## The interview trap\nThe traps are using P/E on a company with negative earnings, and pairing EV with net income or equity value with EBITDA.\n\n> A multiple should compare a value and a metric that belong to the same group of investors. Enterprise value represents everyone who funds the company, debt holders and shareholders, so it goes with metrics calculated before interest is paid, like revenue, EBITDA or EBIT. Equity value belongs only to shareholders, so it goes with metrics after interest, like net income or earnings per share, which gives you the P/E ratio. Mixing them, like dividing enterprise value by net income, compares the value to all investors with a profit that has already had the lenders' share taken out. EV to EBITDA is also popular because it isn't distorted by differences in debt and taxes, so you can compare companies with very different capital structures.\n\n## Your line\n\"Match the numerator and the denominator to the same investors.\" **Follow-up you'll get:** \"Why might two companies in the same industry trade at very different EV/EBITDA multiples?\" **The other side:** Multiples are shortcuts that hide assumptions about growth and risk; a DCF forces you to state them.\n\n## Your turn\n1. **Say it out loud:** Company A trades at 10 times EBITDA and Company B at 15 times. What could explain the gap?\n2. **Rapid fire:**\n   a. A stock is at $30 with earnings per share of $1.50. What's its P/E?\n   b. Which multiple would you use for a company with negative earnings but growing revenue?\n   c. Why is price-to-book common for banks?\n3. **Rewind:** What goes into the EV bridge?\n4. **Brain teaser:** A company's P/E is 20. What's its earnings yield?\n\n## Answers\n- **Say it out loud:** Company B may be growing faster, have higher or steadier margins, earn better returns on capital, carry less risk or hold a stronger market position. Its EBITDA might also be temporarily depressed, or the market might expect a takeover. A strong answer names several and says how you'd check.\n- **a.** 20 times.\n- **b.** EV/Revenue, or EV/gross profit.\n- **c.** A bank's assets and liabilities are mostly financial and carried near market value, and debt is part of its operations, so enterprise value doesn't work well; book value and return on equity are more meaningful.\n- **Rewind:** Equity value, plus debt, preferred stock and noncontrolling interests, minus cash and non-operating assets.\n- **Brain teaser:** 5%. Earnings yield is the inverse of P/E: 1 ÷ 20.\n","answers":{"Cold open":"A multiple should compare a value and a metric that belong to the same group of investors. Enterprise value represents everyone who funds the company, debt holders and shareholders, so it goes with metrics calculated before interest is paid, like revenue, EBITDA or EBIT. Equity value belongs only to shareholders, so it goes with metrics after interest, like net income or earnings per share, which gives you the P/E ratio. Mixing them, like dividing enterprise value by net income, compares the value to all investors with a profit that has already had the lenders' share taken out. EV to EBITDA is also popular because it isn't distorted by differences in debt and taxes, so you can compare companies with very different capital structures.","Say it out loud":"Company B may be growing faster, have higher or steadier margins, earn better returns on capital, carry less risk or hold a stronger market position. Its EBITDA might also be temporarily depressed, or the market might expect a takeover. A strong answer names several and says how you'd check.","Rapid fire a":"20 times.","Rapid fire b":"EV/Revenue, or EV/gross profit.","Rapid fire c":"A bank's assets and liabilities are mostly financial and carried near market value, and debt is part of its operations, so enterprise value doesn't work well; book value and return on equity are more meaningful.","Rewind":"Equity value, plus debt, preferred stock and noncontrolling interests, minus cash and non-operating assets.","Brain teaser":"5%. Earnings yield is the inverse of P/E: 1 ÷ 20."}},"val-comparable-companies-analysis-comps":{"title":"Comparable companies analysis (\"comps\")","cat":"val","slug":"comparable-companies-analysis-comps","md":"# Comparable companies analysis (\"comps\")\n*Comes up in:* Banking and equity research technicals, and any conversation about how a company or an IPO gets priced.\n\n## Cold open\n\"Walk me through a comparable companies analysis.\"\n\nAnswer it out loud before you read on.\n\n## The big idea\nComps value a company by looking at how the market values similar public companies. You find a group of peers, calculate their valuation multiples, and apply those multiples to your company. Think of pricing a house by looking at what similar houses on the same street sold for per square foot, then adjusting for the extra bedroom.\n\n## How it works\nFive steps:\n\n1. **Pick the peer group.** Same industry, but also similar size, growth, margins, business model and geography.\n2. **Gather the data.** Share prices, diluted shares, debt and cash for each peer, to get equity value and enterprise value; then revenue, EBITDA and earnings, both for the last twelve months and for next year's consensus estimates.\n3. **Calculate the multiples,** such as EV/Revenue, EV/EBITDA and P/E.\n4. **Look at the range.** Focus on the median and the middle of the range rather than the average, which outliers distort.\n5. **Apply them** to your company's own numbers to get a range of implied values.\n\nAn example. Five peers trade at 8x, 9x, 10x, 11x and 12x EBITDA.\n\n| Step | Low | Median | High |\n|---|---|---|---|\n| EV/EBITDA multiple | 9x | 10x | 11x |\n| × Target's EBITDA of $50 million | | | |\n| = Implied enterprise value | $450M | $500M | $550M |\n| − Net debt of $100 million | $350M | $400M | $450M |\n| ÷ 20 million shares = value per share | $17.50 | $20.00 | $22.50 |\n\nThe strength of comps is that they're based on real market prices and are quick to build. The weaknesses: no two companies are identical, the peer group drives the answer, and if the whole sector is overvalued, so is your result.\n\n## In the real world\nIPOs are priced largely off comps. When Arm, the chip designer, went public in September 2023 at $51 a share, valuing it at about $54.5 billion, much of the debate was about which peers it resembled. Investors who compared it with fast-growing chip and software companies thought the multiple was reasonable; those who compared it with slower-growing chip designers thought it was expensive. Same company, different peer group, different answer. When a company files to go public, its prospectus and the analyst coverage that follows show which peers the bankers chose.\n\n## The interview trap\nThe traps are choosing peers by industry alone, averaging multiples that include wild outliers, and mixing last year's numbers with next year's.\n\n> In a comps analysis, you value a company based on how the market values similar public companies. First, you pick a peer group: companies in the same industry with similar size, growth, margins and geography. Then you calculate each peer's equity value and enterprise value and divide by metrics like revenue, EBITDA and earnings, for both the last twelve months and next year's estimates. You look at the range of those multiples, focusing on the median and the middle of the range, and apply them to your company's own metrics to get a range of implied enterprise values, which you convert to equity value and a price per share. It's quick and reflects current market sentiment, but it's only as good as the peer group, and it inherits whatever the market is getting wrong.\n\n## Your line\n\"Comps tell you what the market will pay today, not what a business is truly worth.\" **Follow-up you'll get:** \"How would you pick peers if there's no perfect comparable?\" **The other side:** For pricing a deal in the near term, comps are often more useful than a DCF, because they're anchored in real trades.\n\n## Your turn\n1. **Say it out loud:** How would you choose a peer group for a company with no direct public competitors?\n2. **Rapid fire:**\n   a. Peers trade at 8x to 12x EBITDA, with a median of 10x. The target's EBITDA is $40 million. What's the implied EV at the median?\n   b. Why use the median instead of the average?\n   c. Name one advantage and one drawback of comps.\n3. **Rewind:** Why do you pair enterprise value with EBITDA?\n4. **Brain teaser:** What's 15 × 16?\n\n## Answers\n- **Say it out loud:** Widen the search to companies with a similar business model, customers, end markets, growth and margins, even in adjacent industries; weight the closest ones most; and cross-check with private deals in the space. A strong answer admits the trade-off between a bigger peer group and a more similar one.\n- **a.** $400 million.\n- **b.** A few outliers can pull the average far from what's typical; the median isn't affected by them.\n- **c.** Advantage: it's based on real market prices and quick to build. Drawback: the answer depends heavily on the peer group, and it inherits any mispricing in the market.\n- **Rewind:** Both belong to all capital providers: EV includes debt and equity, and EBITDA is calculated before interest.\n- **Brain teaser:** 240.\n","answers":{"Cold open":"In a comps analysis, you value a company based on how the market values similar public companies. First, you pick a peer group: companies in the same industry with similar size, growth, margins and geography. Then you calculate each peer's equity value and enterprise value and divide by metrics like revenue, EBITDA and earnings, for both the last twelve months and next year's estimates. You look at the range of those multiples, focusing on the median and the middle of the range, and apply them to your company's own metrics to get a range of implied enterprise values, which you convert to equity value and a price per share. It's quick and reflects current market sentiment, but it's only as good as the peer group, and it inherits whatever the market is getting wrong.","Say it out loud":"Widen the search to companies with a similar business model, customers, end markets, growth and margins, even in adjacent industries; weight the closest ones most; and cross-check with private deals in the space. A strong answer admits the trade-off between a bigger peer group and a more similar one.","Rapid fire a":"$400 million.","Rapid fire b":"A few outliers can pull the average far from what's typical; the median isn't affected by them.","Rapid fire c":"Advantage: it's based on real market prices and quick to build. Drawback: the answer depends heavily on the peer group, and it inherits any mispricing in the market.","Rewind":"Both belong to all capital providers: EV includes debt and equity, and EBITDA is calculated before interest.","Brain teaser":"240."}},"val-dcf-part-1-the-big-idea-and-projecting-free-cash":{"title":"DCF, part 1: the big idea and projecting free cash flow","cat":"val","slug":"dcf-part-1-the-big-idea-and-projecting-free-cash-flow","md":"# DCF, part 1: the big idea and projecting free cash flow\n*Comes up in:* Every banking, private equity and equity research process, and many asset management interviews.\n\n## Cold open\n\"What's the idea behind a DCF?\"\n\nAnswer it out loud before you read on.\n\n## The big idea\nA company is worth the cash it will produce in the future, adjusted for the fact that future cash is worth less than cash today. A discounted cash flow analysis (DCF) projects the company's free cash flow for several years, estimates the value of everything after that, and discounts it all back to today. Think of valuing an apple orchard: it's worth the apples it will grow over the years, discounted because you have to wait for them and because some years the harvest will disappoint.\n\n## How it works\nPart one is the projection. You build unlevered free cash flow year by year, usually for five to ten years:\n\n1. **Revenue:** start from history, the industry's growth and analysts' estimates.\n2. **Operating margin:** how much of each dollar of revenue becomes operating income (EBIT).\n3. **Taxes:** EBIT × (1 − tax rate).\n4. **Add back** depreciation and amortization.\n5. **Subtract** capital expenditures and the increase in working capital, the investment growth requires.\n\nHere's an example: revenue of 1,000 growing 10% a year, a 20% EBIT margin, a 25% tax rate, D&A at 5% of revenue, capex at 6% of revenue, and working capital investment equal to 10% of each year's revenue increase.\n\n| Year | 1 | 2 | 3 | 4 | 5 |\n|---|---|---|---|---|---|\n| Revenue | 1,100 | 1,210 | 1,331 | 1,464 | 1,611 |\n| EBIT (20%) | 220 | 242 | 266 | 293 | 322 |\n| After-tax EBIT | 165 | 182 | 200 | 220 | 242 |\n| **Unlevered free cash flow** | **144.0** | **158.4** | **174.2** | **191.7** | **210.8** |\n\nIn year 1, for instance: 165 of after-tax EBIT, plus 55 of D&A, minus 66 of capex, minus 10 of working capital investment, equals 144. Parts two and three, the discount rate and the terminal value, turn these cash flows into a value.\n\nThe big judgment calls are revenue growth, margins and how much reinvestment that growth needs. Small changes compound over the years, which is why the assumptions matter more than the spreadsheet.\n\n## In the real world\nIn June 2014, NYU professor Aswath Damodaran published a DCF valuing Uber at about $5.9 billion, at the same moment investors were putting money in at a $17 billion valuation. Bill Gurley, an Uber investor, replied that Damodaran had assumed far too small a market: Uber could grow the market for rides, not just take share of the taxi business. Same method, very different assumptions, very different answers, and Uber went on to be worth far more than either number. Damodaran's blog, \"Musings on Markets,\" posts full valuations with every assumption shown, and it's one of the best free ways to learn the craft.\n\n## The interview trap\nThe trap is jumping straight to formulas without explaining what a DCF is trying to capture, or being vague about which cash flow you project.\n\n> A DCF values a company based on the present value of the cash it will generate. You project the company's unlevered free cash flow, usually for five to ten years, starting with revenue growth and margins, then subtracting taxes, capex and the investment in working capital, while adding back depreciation. Because the company keeps going after the projection period, you estimate a terminal value for everything beyond it. Then you discount the projected cash flows and the terminal value back to today at the weighted average cost of capital, which reflects the risk and the time value of money. The sum is the enterprise value; subtract net debt to get equity value, and divide by diluted shares to get a value per share.\n\n## Your line\n\"A DCF is only as good as its assumptions, and that's exactly why it's useful: it forces you to say them out loud.\" **Follow-up you'll get:** \"What are the most important assumptions in a DCF?\" **The other side:** Critics say you can get almost any answer by tweaking growth and the discount rate, which is why good analysts show sensitivity tables.\n\n## Your turn\n1. **Say it out loud:** Why might two analysts get very different DCF values for the same company?\n2. **Rapid fire:**\n   a. Revenue is 1,000, the EBIT margin is 20%, the tax rate is 25%, D&A is 40, capex is 60 and working capital rises by 10. What's unlevered free cash flow?\n   b. Why project five to ten years instead of thirty?\n   c. Which discount rate goes with unlevered free cash flow?\n3. **Rewind:** What's the formula for unlevered free cash flow?\n4. **Brain teaser:** Revenue grows 10% a year for two years. What's the total growth?\n\n## Answers\n- **Say it out loud:** They can assume different revenue growth, margins, reinvestment, discount rates and terminal values, and small differences compound over many years. A strong answer adds that this is why you show sensitivity tables and cross-check with comps.\n- **a.** 120: EBIT of 200 × 0.75 = 150, plus 40, minus 60, minus 10.\n- **b.** Forecasts become unreliable after five to ten years; the terminal value captures everything after that.\n- **c.** The weighted average cost of capital (WACC).\n- **Rewind:** EBIT × (1 − tax rate) + D&A − capex − increase in net working capital.\n- **Brain teaser:** 21%: 1.1 × 1.1 = 1.21.\n","answers":{"Cold open":"A DCF values a company based on the present value of the cash it will generate. You project the company's unlevered free cash flow, usually for five to ten years, starting with revenue growth and margins, then subtracting taxes, capex and the investment in working capital, while adding back depreciation. Because the company keeps going after the projection period, you estimate a terminal value for everything beyond it. Then you discount the projected cash flows and the terminal value back to today at the weighted average cost of capital, which reflects the risk and the time value of money. The sum is the enterprise value; subtract net debt to get equity value, and divide by diluted shares to get a value per share.","Say it out loud":"They can assume different revenue growth, margins, reinvestment, discount rates and terminal values, and small differences compound over many years. A strong answer adds that this is why you show sensitivity tables and cross-check with comps.","Rapid fire a":"120: EBIT of 200 × 0.75 = 150, plus 40, minus 60, minus 10.","Rapid fire b":"Forecasts become unreliable after five to ten years; the terminal value captures everything after that.","Rapid fire c":"The weighted average cost of capital (WACC).","Rewind":"EBIT × (1 − tax rate) + D&A − capex − increase in net working capital.","Brain teaser":"21%: 1.1 × 1.1 = 1.21."}},"val-dcf-part-2-the-discount-rate-wacc-capm-and-beta":{"title":"DCF, part 2: the discount rate (WACC, CAPM and beta)","cat":"val","slug":"dcf-part-2-the-discount-rate-wacc-capm-and-beta","md":"# DCF, part 2: the discount rate (WACC, CAPM and beta)\n*Comes up in:* Banking and corporate finance technicals, and any question about what rising interest rates do to valuations.\n\n## Cold open\n\"How do you calculate WACC, and why is the cost of equity usually higher than the cost of debt?\"\n\nAnswer it out loud before you read on.\n\n## The big idea\nThe discount rate is the return investors require for the risk of owning the business. The **weighted average cost of capital (WACC)** blends what shareholders require and what lenders require, weighted by how much of each the company uses. Think of a blended interest rate when you pay for a house partly with a cheap mortgage and partly with a pricier loan from a relative who's taking more risk.\n\n## How it works\nThe formula:\n\n**WACC** = (equity share × cost of equity) + (debt share × cost of debt × (1 − tax rate))\n\nThe **cost of equity** usually comes from the capital asset pricing model (CAPM):\n\n**Cost of equity** = risk-free rate + beta × equity risk premium\n\n- The **risk-free rate** is usually the 10-year Treasury yield.\n- **Beta** measures how much a stock moves with the market: 1.0 moves with it, above 1.0 swings more.\n- The **equity risk premium** is the extra return investors demand for owning stocks instead of Treasuries, often estimated at 4% to 6%.\n\nHere's an example:\n\n| Input | Value |\n|---|---|\n| Risk-free rate | 4% |\n| Beta | 1.2 |\n| Equity risk premium | 5% |\n| **Cost of equity** = 4% + 1.2 × 5% | **10%** |\n| Pre-tax cost of debt | 6% |\n| **After-tax cost of debt** = 6% × (1 − 25%) | **4.5%** |\n| Weights | 70% equity, 30% debt |\n| **WACC** = 70% × 10% + 30% × 4.5% | **8.35%** |\n\nEquity costs more than debt because shareholders are paid last and have no guaranteed return, and interest is tax-deductible, which makes debt cheaper still. But more debt doesn't keep lowering WACC: past a point, both lenders and shareholders see more risk and demand more.\n\n## In the real world\nThe risk-free rate moved more in 2022 than in any recent year. The 10-year Treasury yield started the year at about 1.5% and ended near 3.9%, and it touched 5% in October 2023. Every DCF's starting point shifted with it: higher risk-free rates mean higher costs of equity and debt, a higher WACC and lower present values, especially for companies whose cash flows sit far in the future. That's a big reason growth stocks fell so hard in 2022. Before any valuation question, know roughly where the 10-year yield is today.\n\n## The interview trap\nThe traps are forgetting the tax shield on debt, using book values for the weights instead of market values, and claiming that adding debt always lowers WACC.\n\n> WACC is the weighted average of what each type of investor requires: the cost of equity times equity's share of total capital, plus the after-tax cost of debt times debt's share. The cost of equity usually comes from CAPM: the risk-free rate, typically the 10-year Treasury yield, plus beta times the equity risk premium, where beta measures how much the stock moves with the market. The cost of debt is what the company pays to borrow, multiplied by one minus the tax rate, because interest is tax-deductible. Equity costs more than debt because shareholders are paid last and have no guaranteed return, so they demand more. That's also why adding debt lowers WACC only up to a point: past that, lenders and shareholders both see more risk and raise their required returns.\n\n## Your line\n\"WACC is the hurdle a company has to clear to create value for everyone who funds it.\" **Follow-up you'll get:** \"What happens to a DCF valuation if interest rates rise?\" **The other side:** CAPM is a simplification: beta is noisy and the equity risk premium is debated, so practitioners cross-check with other methods.\n\n## Your turn\n1. **Say it out loud:** If interest rates rise, what happens to a DCF valuation, and why?\n2. **Rapid fire:**\n   a. The risk-free rate is 4%, beta is 1.5 and the equity risk premium is 5%. What's the cost of equity?\n   b. The pre-tax cost of debt is 8% and the tax rate is 25%. What's the after-tax cost of debt?\n   c. A company is 60% equity at a 10% cost and 40% debt at a 5% after-tax cost. What's its WACC?\n3. **Rewind:** What's the idea behind a DCF, in one sentence?\n4. **Brain teaser:** What is 0.7 × 0.3 + 0.3 × 0.7?\n\n## Answers\n- **Say it out loud:** A higher risk-free rate raises the cost of equity and the cost of debt, so WACC rises and future cash flows are worth less today. The terminal value, usually most of the value, falls the most, so companies whose cash flows sit far in the future get hit hardest. A strong answer may add that higher rates can also slow growth.\n- **a.** 11.5%: 4% + 1.5 × 5%.\n- **b.** 6%: 8% × 0.75.\n- **c.** 8%: 0.6 × 10% + 0.4 × 5%.\n- **Rewind:** A company is worth the present value of the cash it will generate in the future.\n- **Brain teaser:** 0.42.\n","answers":{"Cold open":"WACC is the weighted average of what each type of investor requires: the cost of equity times equity's share of total capital, plus the after-tax cost of debt times debt's share. The cost of equity usually comes from CAPM: the risk-free rate, typically the 10-year Treasury yield, plus beta times the equity risk premium, where beta measures how much the stock moves with the market. The cost of debt is what the company pays to borrow, multiplied by one minus the tax rate, because interest is tax-deductible. Equity costs more than debt because shareholders are paid last and have no guaranteed return, so they demand more. That's also why adding debt lowers WACC only up to a point: past that, lenders and shareholders both see more risk and raise their required returns.","Say it out loud":"A higher risk-free rate raises the cost of equity and the cost of debt, so WACC rises and future cash flows are worth less today. The terminal value, usually most of the value, falls the most, so companies whose cash flows sit far in the future get hit hardest. A strong answer may add that higher rates can also slow growth.","Rapid fire a":"11.5%: 4% + 1.5 × 5%.","Rapid fire b":"6%: 8% × 0.75.","Rapid fire c":"8%: 0.6 × 10% + 0.4 × 5%.","Rewind":"A company is worth the present value of the cash it will generate in the future.","Brain teaser":"0.42."}},"val-dcf-part-3-terminal-value-and-why-it-s-most-of-t":{"title":"DCF, part 3: terminal value, and why it's most of the answer","cat":"val","slug":"dcf-part-3-terminal-value-and-why-it-s-most-of-the-answer","md":"# DCF, part 3: terminal value, and why it's most of the answer\n*Comes up in:* Banking and private equity technicals, often as the follow-up to \"walk me through a DCF.\"\n\n## Cold open\n\"What is terminal value, and what are the two ways to calculate it?\"\n\nAnswer it out loud before you read on.\n\n## The big idea\nA company doesn't stop operating when your five-year projection ends, so the terminal value captures everything after that, in one number. It's usually the largest part of a DCF. Think of buying a house to rent out for five years and then sell: the rent matters, but the sale price at the end usually matters more.\n\n## How it works\nTwo methods:\n\n- **Perpetuity growth:** terminal value = final-year free cash flow × (1 + g) ÷ (WACC − g), where g is a long-term growth rate, usually 2% to 3%, below the long-run growth of the economy.\n- **Exit multiple:** terminal value = final-year EBITDA × an EV/EBITDA multiple taken from comparable companies.\n\nEither way, you then discount the terminal value back to today, just like the yearly cash flows.\n\nUsing the five-year projection from part one (final-year free cash flow of 210.8), with a 9% WACC and 2.5% growth:\n\n| Step | Amount |\n|---|---|\n| Terminal value = 210.8 × 1.025 ÷ (0.09 − 0.025) | 3,324.6 |\n| Discounted five years: 3,324.6 ÷ 1.09⁵ | 2,160.8 |\n| Present value of years 1 to 5 | 672.8 |\n| **Enterprise value** | **2,833.6** |\n| Terminal value's share of the total | **76%** |\n\nCross-check: that terminal value is about 8.3 times year-five EBITDA of 402.6, a believable multiple. Now see how sensitive it is:\n\n| Enterprise value | g = 2.0% | g = 2.5% | g = 3.0% |\n|---|---|---|---|\n| WACC 8% | 3,131 | 3,366 | 3,648 |\n| WACC 9% | 2,669 | 2,834 | 3,025 |\n| WACC 10% | 2,324 | 2,444 | 2,581 |\n\nA one-point change in WACC moves the value by roughly 15%, and growth must always stay below WACC, or the formula breaks.\n\n## In the real world\nCompanies whose value sits mostly in the distant future live and die by the terminal value, and 2022 showed it. As interest rates rose and discount rates went up with them, the ARK Innovation ETF, a fund of high-growth companies with little current profit, fell about 67% that year, far more than the overall market. Most of those companies' value had been terminal value, and terminal value is the part most sensitive to the discount rate. When you look at any DCF, check what share of the value comes from the terminal value and what exit multiple it implies.\n\n## The interview trap\nThe traps are using a growth rate of 5% or more forever, picking a growth rate above WACC, and forgetting to discount the terminal value back to today.\n\n> Terminal value captures the value of all the cash flows after the projection period, since a company doesn't stop operating after five or ten years. There are two ways to calculate it. The perpetuity growth method takes the final year's free cash flow, grows it by a long-term growth rate, and divides by the discount rate minus that growth rate; the growth rate should be modest, usually below long-run economic growth. The exit multiple method applies a multiple, like EV to EBITDA from comparable companies, to the final year's EBITDA. Either way, you then discount the terminal value back to today. It often makes up well over half of a DCF's value, which is why analysts cross-check the two methods and run sensitivity tables on the growth rate, the multiple and the discount rate.\n\n## Your line\n\"In most DCFs, the terminal value is the valuation; the projection years are the setup.\" **Follow-up you'll get:** \"Which method do you prefer, and how do you sanity-check it?\" **The other side:** The exit multiple method imports today's market mood into a value years from now, which some see as circular.\n\n## Your turn\n1. **Say it out loud:** Why does terminal value usually make up most of a DCF's value, and why is that a problem?\n2. **Rapid fire:**\n   a. Final-year free cash flow is 100, WACC is 10% and long-term growth is 2%. What's the perpetuity growth terminal value?\n   b. Final-year EBITDA is 50 and the exit multiple is 9x. What's the terminal value?\n   c. Why must the growth rate be lower than WACC?\n3. **Rewind:** What's the CAPM formula for the cost of equity?\n4. **Brain teaser:** What is 1 ÷ 0.08, and why is that number useful?\n\n## Answers\n- **Say it out loud:** It represents every year after the projection period, often decades of cash flows, so it's naturally large. The problem is that it rests on the least certain assumptions, long-term growth and the discount rate, and small changes in either swing the whole valuation. A strong answer mentions sensitivity tables and the exit multiple cross-check.\n- **a.** 1,275: 100 × 1.02 ÷ 0.08.\n- **b.** 450.\n- **c.** Otherwise the formula gives an infinite or negative value; no company can grow faster than the economy forever.\n- **Rewind:** Cost of equity = risk-free rate + beta × equity risk premium.\n- **Brain teaser:** 12.5. It's the value of a perpetuity paying $1 a year at 8%, so a steady cash flow at an 8% discount rate is worth 12.5 times one year's payment.\n","answers":{"Cold open":"Terminal value captures the value of all the cash flows after the projection period, since a company doesn't stop operating after five or ten years. There are two ways to calculate it. The perpetuity growth method takes the final year's free cash flow, grows it by a long-term growth rate, and divides by the discount rate minus that growth rate; the growth rate should be modest, usually below long-run economic growth. The exit multiple method applies a multiple, like EV to EBITDA from comparable companies, to the final year's EBITDA. Either way, you then discount the terminal value back to today. It often makes up well over half of a DCF's value, which is why analysts cross-check the two methods and run sensitivity tables on the growth rate, the multiple and the discount rate.","Say it out loud":"It represents every year after the projection period, often decades of cash flows, so it's naturally large. The problem is that it rests on the least certain assumptions, long-term growth and the discount rate, and small changes in either swing the whole valuation. A strong answer mentions sensitivity tables and the exit multiple cross-check.","Rapid fire a":"1,275: 100 × 1.02 ÷ 0.08.","Rapid fire b":"450.","Rapid fire c":"Otherwise the formula gives an infinite or negative value; no company can grow faster than the economy forever.","Rewind":"Cost of equity = risk-free rate + beta × equity risk premium.","Brain teaser":"12.5. It's the value of a perpetuity paying $1 a year at 8%, so a steady cash flow at an 8% discount rate is worth 12.5 times one year's payment."}},"val-walk-me-through-a-dcf-the-60-second-answer-and-t":{"title":"\"Walk me through a DCF\": the 60-second answer and the follow-ups","cat":"val","slug":"walk-me-through-a-dcf-the-60-second-answer-and-the-follow","md":"# \"Walk me through a DCF\": the 60-second answer and the follow-ups\n*Comes up in:* One of the most common technical questions in banking and private equity, and frequent in equity research and asset management.\n\n## Cold open\n\"Walk me through a DCF.\"\n\nAnswer it out loud before you read on.\n\n## The big idea\nThis question tests structure as much as knowledge. Interviewers want the steps in order, in about a minute, with the right cash flow matched to the right discount rate. Then they'll probe with follow-ups. Think of it as giving directions: the order of the turns matters more than describing every building.\n\n## How it works\nThe structure, in six steps:\n\n1. **Project** unlevered free cash flow for five to ten years.\n2. **Estimate a terminal value**, with perpetuity growth or an exit multiple.\n3. **Discount** both to today at WACC.\n4. **Add them up** to get enterprise value.\n5. **Bridge to equity value** by subtracting net debt and other claims, then divide by diluted shares.\n6. **Sensitize** the result to WACC, growth and the exit multiple.\n\nAnd the follow-ups you're likely to get:\n\n| Follow-up | Short answer |\n|---|---|\n| Rates rise: what happens? | WACC rises and value falls, especially the terminal value |\n| Levered or unlevered? | Unlevered with WACC gives EV; levered with the cost of equity gives equity value |\n| What's the mid-year convention? | Discounting each year's cash flow as if it arrives mid-year, which raises value slightly |\n| Which assumptions matter most? | The terminal value inputs and WACC, then growth and margins |\n| When is a DCF a poor tool? | Early startups with no predictable cash flow, and banks |\n| How do you get to a share price? | Subtract net debt and other claims, then divide by diluted shares |\n\n## In the real world\nYou can read real DCFs for free. When a public company agrees to be sold, its proxy statement, filed with the SEC, summarizes its bankers' fairness opinions, and those summaries usually include a discounted cash flow analysis with the discount rates, terminal growth rates or exit multiples and the resulting value ranges. Search SEC EDGAR for a recent merger proxy (the filing type is DEFM14A) and read the section on the financial advisors' opinions. You'll see exactly how professionals frame each step, and the ranges they're comfortable defending.\n\n## The interview trap\nThe traps are rambling past 90 seconds, skipping the terminal value or the net debt step, and reciting formulas without a structure.\n\n> A DCF values a company based on the present value of its future cash flows. First, I'd project unlevered free cash flow for five to ten years: revenue growth and margins to get operating income, then subtract taxes, add back depreciation, and subtract capex and the investment in working capital. Second, I'd calculate a terminal value for the years after that, using either the perpetuity growth method or an exit multiple of EBITDA. Third, I'd discount the cash flows and the terminal value back to today using the weighted average cost of capital, with the cost of equity from CAPM and the after-tax cost of debt. The sum is the enterprise value. Then I'd subtract net debt to get equity value, divide by diluted shares for an implied share price, and run sensitivity tables on the discount rate and terminal assumptions.\n\n## Your line\n\"Project the cash flows, add a terminal value, discount at WACC, bridge to equity, then test the assumptions.\" **Follow-up you'll get:** \"Which assumption would you stress-test first?\" **The other side:** Many bankers trust comps and precedent transactions more than a DCF for pricing a deal, and use the DCF as a cross-check.\n\n## Your turn\n1. **Say it out loud:** Walk me through a DCF in under 60 seconds.\n2. **Rapid fire:**\n   a. What's the mid-year convention?\n   b. How do you get from enterprise value to a share price?\n   c. Name a type of company for which a DCF works poorly.\n3. **
