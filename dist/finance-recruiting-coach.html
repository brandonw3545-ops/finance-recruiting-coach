Rewind:** What are the two ways to calculate terminal value?\n4. **Brain teaser:** A company's EV is $900, its net debt is $300 and it has 60 shares. What's the implied share price?\n\n## Answers\n- **Say it out loud:** A strong answer hits the six steps in order, pairs unlevered free cash flow with WACC, includes the terminal value and the bridge to equity value, mentions sensitivity tables, and finishes in under 60 seconds.\n- **a.** Discounting each year's cash flow as if it arrives in the middle of the year rather than the end, since cash comes in throughout the year.\n- **b.** Subtract net debt and other claims, like preferred stock and noncontrolling interests, from enterprise value to get equity value, then divide by diluted shares.\n- **c.** An early-stage startup with no predictable cash flow, or a bank, whose debt is part of its operations.\n- **Rewind:** The perpetuity growth method and the exit multiple method.\n- **Brain teaser:** $10: ($900 − $300) ÷ 60.\n","answers":{"Cold open":"A DCF values a company based on the present value of its future cash flows. First, I'd project unlevered free cash flow for five to ten years: revenue growth and margins to get operating income, then subtract taxes, add back depreciation, and subtract capex and the investment in working capital. Second, I'd calculate a terminal value for the years after that, using either the perpetuity growth method or an exit multiple of EBITDA. Third, I'd discount the cash flows and the terminal value back to today using the weighted average cost of capital, with the cost of equity from CAPM and the after-tax cost of debt. The sum is the enterprise value. Then I'd subtract net debt to get equity value, divide by diluted shares for an implied share price, and run sensitivity tables on the discount rate and terminal assumptions.","Say it out loud":"A strong answer hits the six steps in order, pairs unlevered free cash flow with WACC, includes the terminal value and the bridge to equity value, mentions sensitivity tables, and finishes in under 60 seconds.","Rapid fire a":"Discounting each year's cash flow as if it arrives in the middle of the year rather than the end, since cash comes in throughout the year.","Rapid fire b":"Subtract net debt and other claims, like preferred stock and noncontrolling interests, from enterprise value to get equity value, then divide by diluted shares.","Rapid fire c":"An early-stage startup with no predictable cash flow, or a bank, whose debt is part of its operations.","Rewind":"The perpetuity growth method and the exit multiple method.","Brain teaser":"$10: ($900 − $300) ÷ 60."}},"mkt-what-a-stock-actually-is-and-how-the-stock-marke":{"title":"What a stock actually is, and how the stock market works","cat":"mkt","slug":"what-a-stock-actually-is-and-how-the-stock-market-works","md":"# What a stock actually is, and how the stock market works\n*Comes up in:* Sales and trading, asset management and equity research first rounds, and as a warm-up anywhere.\n\n## Cold open\n\"What actually happens when you buy a share of stock, and why do stock prices move?\"\n\nAnswer it out loud before you read on.\n\n## The big idea\nA share of stock is a small slice of ownership in a company: a claim on its profits after everyone else, from lenders to suppliers to the tax authorities, has been paid, usually with a vote on big decisions. A company sells shares to raise money, first in an initial public offering (IPO). After that, almost all trading is between investors. When you buy a share of Apple on your phone, Apple doesn't get your money; whoever sold you the share does. The price is set by buyers and sellers, and it reflects what they expect the company to earn in the future. Think of a betting line on a game: it moves with new information, and it already reflects what everyone expects.\n\n## How it works\n- **Primary market:** the company sells new shares, in an IPO or a later offering, and receives the money.\n- **Secondary market:** investors trade existing shares with each other on exchanges such as the New York Stock Exchange and Nasdaq. Market makers stand ready to buy and sell all day and earn the small gap between the two prices.\n- **Market order vs. limit order:** a market order buys or sells right away at the best available price; a limit order trades only at your price or better.\n\n| Term | What it means | Example |\n|---|---|---|\n| Bid | The highest price a buyer is offering | $49.98 |\n| Ask | The lowest price a seller will accept | $50.02 |\n| Spread | The gap between them | $0.04 |\n| Market cap | Share price × shares outstanding | $50 × 200 million = $10 billion |\n\nWhat moves prices is a change in expectations, not results alone. If investors expect a company to earn $2 a share and it earns $2, the stock may not move at all; that result was \"priced in.\" If it earns $2 but says next year will be weaker than hoped, the stock can fall on a record quarter. Interest rates and the overall market mood move prices too.\n\nYou'll hear about three indexes. The **S&P 500** tracks 500 large U.S. companies, weighted by market value, and is the usual benchmark for \"the market.\" The **Dow Jones Industrial Average** tracks 30 large companies, weighted by share price, an older and quirkier method. The **Nasdaq Composite** includes nearly everything listed on Nasdaq and leans heavily toward technology.\n\n## In the real world\nOn May 24, 2023, Nvidia forecast about $11 billion of revenue for its next quarter, roughly 50% more than analysts expected, thanks to demand for its artificial intelligence chips. The next day the stock jumped about 24%, adding roughly $184 billion of market value in a single session. Two lessons. Nvidia didn't receive a cent of that money; the gains went to whoever owned the shares. And what moved the price wasn't the quarter it had just reported but the jump in what investors expected next. This earnings season, pick a company that reports, compare its results and forecast with what analysts expected, and see whether the stock's move makes more sense against the expectations than against the raw numbers.\n\n## The interview trap\nThe traps are saying a stock rose \"because the company did well,\" and thinking the company receives money every time its shares trade.\n\n> A share of stock is a small piece of ownership in a company: a claim on its future profits after its lenders and other obligations are paid, usually with a vote on major decisions. Companies sell shares to raise money, first in an IPO, but after that almost all trading happens between investors on exchanges like the NYSE and Nasdaq, so the company doesn't receive anything when shares change hands. The price is set by supply and demand, and it reflects what investors expect the company to earn in the future, discounted back to today. That's why prices move on changes in expectations rather than results alone: a company can report record profits and still fall if investors expected more.\n\n## Your line\n\"A stock price isn't a grade on last quarter; it's a bet on everything after it.\" **Follow-up you'll get:** \"Why might a stock fall after a strong earnings report?\" **The other side:** In the short run, prices also move on fear, momentum and money flowing in and out of funds; as the investor Benjamin Graham put it, the market is a voting machine in the short run and a weighing machine in the long run.\n\n## Your turn\n1. **Say it out loud:** Explain why a company's stock can fall on the day it reports record profits.\n2. **Rapid fire:**\n   a. A stock trades at $25 with 400 million shares outstanding. What's its market cap?\n   b. The bid is $19.95 and the ask is $20.05. What's the spread?\n   c. When you buy a share on the Nasdaq, does the company get your money?\n3. **Rewind:** In one breath, walk me through a DCF.\n4. **Brain teaser:** A stock falls 50% and then rises 50%. Where does it end up compared with where it started?\n\n## Answers\n- **Say it out loud:** The price already reflected high expectations. If the results or, more often, the forecast for next quarter fall short of what investors expected, the price drops even though profits hit a record. A strong answer uses the words \"priced in\" and explains that the market reacts to the future, not the past.\n- **a.** $10 billion.\n- **b.** $0.10.\n- **c.** No. You're buying from another investor. The company only receives money when it sells new shares, as in an IPO or a later offering.\n- **Rewind:** Project unlevered free cash flow, add a terminal value, discount both at WACC to get enterprise value, subtract net debt to get equity value, and divide by diluted shares.\n- **Brain teaser:** Down 25%: 0.5 × 1.5 = 0.75.\n","answers":{"Cold open":"A share of stock is a small piece of ownership in a company: a claim on its future profits after its lenders and other obligations are paid, usually with a vote on major decisions. Companies sell shares to raise money, first in an IPO, but after that almost all trading happens between investors on exchanges like the NYSE and Nasdaq, so the company doesn't receive anything when shares change hands. The price is set by supply and demand, and it reflects what investors expect the company to earn in the future, discounted back to today. That's why prices move on changes in expectations rather than results alone: a company can report record profits and still fall if investors expected more.","Say it out loud":"The price already reflected high expectations. If the results or, more often, the forecast for next quarter fall short of what investors expected, the price drops even though profits hit a record. A strong answer uses the words \"priced in\" and explains that the market reacts to the future, not the past.","Rapid fire a":"$10 billion.","Rapid fire b":"$0.10.","Rapid fire c":"No. You're buying from another investor. The company only receives money when it sells new shares, as in an IPO or a later offering.","Rewind":"Project unlevered free cash flow, add a terminal value, discount both at WACC to get enterprise value, subtract net debt to get equity value, and divide by diluted shares.","Brain teaser":"Down 25%: 0.5 × 1.5 = 0.75."}},"mkt-bonds-101-coupons-maturities-and-why-prices-and-":{"title":"Bonds 101: coupons, maturities, and why prices and yields move in opposite directions","cat":"mkt","slug":"bonds-101-coupons-maturities-and-why-prices-and-yields-move","md":"# Bonds 101: coupons, maturities, and why prices and yields move in opposite directions\n*Comes up in:* Sales and trading and asset management interviews, any markets question, and banking interviews that touch on debt.\n\n## Cold open\n\"If interest rates rise, what happens to the price of a bond you already own, and why?\"\n\nAnswer it out loud before you read on.\n\n## The big idea\nA bond is a loan you make to a government or a company. In return, it pays you interest, called the coupon, on a set schedule and repays the face value, usually $1,000, on the maturity date. Because those payments are fixed, the price has to do the adjusting when market rates change. If new bonds pay 5%, nobody will pay full price for your old bond paying 4%, so its price falls until a buyer's total return works out to 5%. It's a seesaw: rates up, prices down; rates down, prices up.\n\n## How it works\nThe key terms:\n\n- **Face value (par):** the amount repaid at maturity, usually $1,000.\n- **Coupon rate:** the annual interest as a percentage of face value. A 4% coupon on $1,000 pays $40 a year.\n- **Maturity:** when the loan is repaid.\n- **Yield to maturity:** the total annual return if you buy at today's price and hold to the end. It's the discount rate that makes the present value of the bond's payments equal its price, the same idea as an IRR.\n\nTake bonds with a 4% coupon, issued at $1,000, paying $40 a year. Here's what happens to their prices if market rates move:\n\n| Maturity | Price if rates rise to 5% | Change | Price if rates fall to 3% | Change |\n|---|---|---|---|---|\n| 2 years | $981 | −1.9% | $1,019 | +1.9% |\n| 10 years | $923 | −7.7% | $1,085 | +8.5% |\n| 30 years | $846 | −15.4% | $1,196 | +19.6% |\n\nTwo lessons from the table. First, longer bonds swing much more, because more of their payments sit far in the future. The measure of this sensitivity is **duration**: roughly, a bond with a duration of 8 loses about 8% of its value when rates rise by one percentage point. Second, prices rise more when rates fall than they drop when rates rise by the same amount, a property called **convexity**.\n\nCredit risk is the other big driver. U.S. Treasuries are treated as essentially free of default risk. Companies pay extra yield over Treasuries, called a **credit spread**, depending on how likely they are to pay. Bonds rated BBB− or higher by S&P and Fitch (Baa3 at Moody's) are **investment grade**; anything lower is **high yield**, also called junk.\n\n## In the real world\nSilicon Valley Bank put much of a flood of new deposits into long-term Treasuries and mortgage bonds in 2020 and 2021, when rates were near zero. When rates rose in 2022, those bonds lost value. On March 8, 2023, SVB said it had sold about $21 billion of securities at a loss of about $1.8 billion and needed to raise capital. Depositors tried to pull $42 billion the next day, and regulators closed the bank on March 10, at the time the second-largest bank failure in U.S. history. Nothing was wrong with the bonds' credit; they were mostly government-backed. The danger was interest rate risk. Before your next interview, look up today's 2-year and 10-year Treasury yields so you can quote them.\n\n## The interview trap\nThe traps are saying bond prices fall when rates rise \"because the bond gets riskier,\" and mixing up the coupon rate with the yield.\n\n> Bond prices and yields move in opposite directions because a bond's payments are fixed. If I own a bond with a 4% coupon and market rates rise to 5%, new buyers can get 5% on newly issued bonds, so they'll only buy mine at a discount: low enough that the fixed payments plus the gain back to face value add up to a 5% return. When rates fall, the reverse happens and my bond trades at a premium. The effect is bigger for longer bonds, because more of their cash flows are far in the future. That's what duration measures: a bond with a duration of about 8 loses roughly 8% of its value for a one-point rise in rates.\n\n## Your line\n\"A bond's payments are fixed, so its price does the adjusting.\" **Follow-up you'll get:** \"If you expect rates to fall, would you rather own a 2-year or a 30-year bond?\" **The other side:** If you hold a high-quality bond to maturity, price swings along the way don't change what you get back, but as SVB showed, that only works if you're never forced to sell early.\n\n## Your turn\n1. **Say it out loud:** Explain to someone who has never owned a bond why its price falls when interest rates rise.\n2. **Rapid fire:**\n   a. A $1,000 bond with a 5% coupon pays how much interest a year?\n   b. Rates rise by one percentage point. Which loses more value: a 2-year bond or a 30-year bond?\n   c. A bond with a $40 annual coupon trades at $950. What's its current yield?\n3. **Rewind:** What is market capitalization, and how do you calculate it?\n4. **Brain teaser:** A one-year zero-coupon bond pays $1,000 at maturity and yields 5%. What's its price today?\n\n## Answers\n- **Say it out loud:** A strong answer uses a simple example: your bond pays $40 a year, new bonds pay $50, so a buyer will only pay less than $1,000 for yours, until the fixed $40 plus the gain back to $1,000 matches what new bonds offer. It avoids jargon until the idea lands.\n- **a.** $50.\n- **b.** The 30-year bond. It has a much longer duration.\n- **c.** About 4.2%: $40 ÷ $950.\n- **Rewind:** The market value of a company's equity: share price × shares outstanding.\n- **Brain teaser:** About $952.38: $1,000 ÷ 1.05.\n","answers":{"Cold open":"Bond prices and yields move in opposite directions because a bond's payments are fixed. If I own a bond with a 4% coupon and market rates rise to 5%, new buyers can get 5% on newly issued bonds, so they'll only buy mine at a discount: low enough that the fixed payments plus the gain back to face value add up to a 5% return. When rates fall, the reverse happens and my bond trades at a premium. The effect is bigger for longer bonds, because more of their cash flows are far in the future. That's what duration measures: a bond with a duration of about 8 loses roughly 8% of its value for a one-point rise in rates.","Say it out loud":"A strong answer uses a simple example: your bond pays $40 a year, new bonds pay $50, so a buyer will only pay less than $1,000 for yours, until the fixed $40 plus the gain back to $1,000 matches what new bonds offer. It avoids jargon until the idea lands.","Rapid fire a":"$50.","Rapid fire b":"The 30-year bond. It has a much longer duration.","Rapid fire c":"About 4.2%: $40 ÷ $950.","Rewind":"The market value of a company's equity: share price × shares outstanding.","Brain teaser":"About $952.38: $1,000 ÷ 1.05."}},"mkt-inflation-cpi-vs-pce-and-why-the-fed-targets-2":{"title":"Inflation: CPI vs. PCE, and why the Fed targets 2%","cat":"mkt","slug":"inflation-cpi-vs-pce-and-why-the-fed-targets-2","md":"# Inflation: CPI vs. PCE, and why the Fed targets 2%\n*Comes up in:* Markets questions in sales and trading, asset management and wealth management interviews, and \"what's going on in the economy\" small talk anywhere.\n\n## Cold open\n\"What's the difference between CPI and PCE, and which one does the Fed target?\"\n\nAnswer it out loud before you read on.\n\n## The big idea\nInflation is the rise in the general level of prices, so each dollar buys less. There are two main gauges. The **Consumer Price Index (CPI)**, published monthly by the Bureau of Labor Statistics, tracks a basket of goods and services that urban consumers pay for out of pocket. The **PCE price index** (personal consumption expenditures), published by the Bureau of Economic Analysis, covers a wider range of spending, including things paid for on households' behalf, like employer-provided health insurance. The Fed targets 2% annual inflation as measured by PCE. Think of CPI as your own receipts, and PCE as the receipts for everything spent on you, including what your employer and the government pay.\n\n## How it works\n| | CPI | PCE price index |\n|---|---|---|\n| Published by | Bureau of Labor Statistics | Bureau of Economic Analysis |\n| Covers | What urban consumers pay out of pocket | All consumer spending, including what's paid on households' behalf |\n| Weights | Updated once a year | Shift as people switch between products |\n| Housing's share | About a third | About a sixth |\n| Usually runs | A bit higher | A bit lower |\n| Used for | Social Security raises, inflation-protected Treasuries (TIPS), tax brackets | The Fed's 2% target |\n\n**Headline vs. core:** core inflation leaves out food and energy, whose prices jump around. The Fed's target is headline PCE, but it watches core PCE as a better guide to where inflation is heading.\n\n**Nominal vs. real:** a real return is roughly the nominal return minus inflation. A savings account paying 4% when inflation is 3% earns a real return of about 1%.\n\n**Why 2%, and not zero?**\n1. A little inflation leaves room to cut interest rates in a downturn. With zero inflation, rates would sit closer to zero, with less room to cut.\n2. Deflation, falling prices, is dangerous: people put off purchases, and debts get heavier in real terms.\n3. Price indexes tend to overstate inflation slightly, because they don't fully capture quality improvements.\n4. A stable, well-known target anchors expectations, so businesses and workers set prices and wages around it.\n\nThe Fed formally adopted the 2% target in January 2012. In 2020, it said it would let inflation run moderately above 2% after periods below it, to make up the difference; in August 2025, it dropped that make-up approach but kept the 2% PCE target.\n\n## In the real world\nInflation surged after the pandemic, driven by snarled supply chains, stimulus-fueled demand and an energy price spike after Russia invaded Ukraine. CPI inflation hit 9.1% in June 2022, its highest since November 1981. The Fed had called the rise \"transitory\" in 2021; by the time inflation peaked, it was in the middle of its fastest run of rate increases in four decades. The episode is why interviewers still ask about inflation, and why \"is inflation back to 2%?\" remains a live question. The Bureau of Labor Statistics releases CPI around the middle of each month; know the latest headline and core numbers, and which way they're heading.\n\n## The interview trap\nThe traps are saying the Fed targets CPI, saying the Fed wants zero inflation, and thinking that falling inflation means falling prices. It doesn't: inflation dropping from 6% to 3% means prices are still rising, just more slowly.\n\n> Both measure how fast consumer prices are rising. CPI, from the Bureau of Labor Statistics, tracks a basket of goods and services that urban consumers pay for out of pocket. PCE, from the Bureau of Economic Analysis, is broader: it includes spending made on households' behalf, like employer-paid health insurance, and it adjusts its weights as people switch between products, so it usually runs a little below CPI. The Fed targets 2% inflation as measured by PCE, and it watches core PCE, which excludes food and energy, as a guide to the underlying trend. It aims for 2% rather than zero because a little inflation gives it room to cut rates in a downturn and protects against deflation.\n\n## Your line\n\"The Fed's target is 2% on PCE: not CPI, and not zero.\" **Follow-up you'll get:** \"If inflation falls from 6% to 3%, are prices falling?\" **The other side:** Some economists argue for a higher target, like 3%, to give the Fed more room to cut rates in a recession; others say changing the target would damage the Fed's credibility.\n\n## Your turn\n1. **Say it out loud:** Why doesn't the Fed aim for zero inflation?\n2. **Rapid fire:**\n   a. A basket of goods cost $200 last year and $210 this year. What's the inflation rate?\n   b. Your savings account pays 4% and inflation is 3%. What's your real return?\n   c. What does core inflation leave out?\n3. **Rewind:** Why does a 30-year bond lose more value than a 2-year bond when rates rise?\n4. **Brain teaser:** At 3% inflation, roughly how many years until prices double?\n\n## Answers\n- **Say it out loud:** A little inflation gives the Fed room to cut rates in a downturn, guards against deflation, which makes people delay spending and makes debts heavier, and offsets the slight overstatement in price indexes. A strong answer adds that a stable, known target anchors expectations.\n- **a.** 5%.\n- **b.** About 1%.\n- **c.** Food and energy.\n- **Rewind:** More of its cash flows are far in the future, so a change in the discount rate affects their present value much more. It has a longer duration.\n- **Brain teaser:** About 24 years: 72 ÷ 3.\n","answers":{"Cold open":"Both measure how fast consumer prices are rising. CPI, from the Bureau of Labor Statistics, tracks a basket of goods and services that urban consumers pay for out of pocket. PCE, from the Bureau of Economic Analysis, is broader: it includes spending made on households' behalf, like employer-paid health insurance, and it adjusts its weights as people switch between products, so it usually runs a little below CPI. The Fed targets 2% inflation as measured by PCE, and it watches core PCE, which excludes food and energy, as a guide to the underlying trend. It aims for 2% rather than zero because a little inflation gives it room to cut rates in a downturn and protects against deflation.","Say it out loud":"A little inflation gives the Fed room to cut rates in a downturn, guards against deflation, which makes people delay spending and makes debts heavier, and offsets the slight overstatement in price indexes. A strong answer adds that a stable, known target anchors expectations.","Rapid fire a":"5%.","Rapid fire b":"About 1%.","Rapid fire c":"Food and energy.","Rewind":"More of its cash flows are far in the future, so a change in the discount rate affects their present value much more. It has a longer duration.","Brain teaser":"About 24 years: 72 ÷ 3."}},"mkt-the-federal-reserve-the-fed-funds-rate-the-fomc-":{"title":"The Federal Reserve: the fed funds rate, the FOMC and the dual mandate","cat":"mkt","slug":"the-federal-reserve-the-fed-funds-rate-the-fomc-and-the","md":"# The Federal Reserve: the fed funds rate, the FOMC and the dual mandate\n*Comes up in:* Almost every markets conversation, from sales and trading to wealth management, and in \"what's happening in the markets\" questions.\n\n## Cold open\n\"What does the Fed do, and how does a rate hike actually slow the economy?\"\n\nAnswer it out loud before you read on.\n\n## The big idea\nThe Federal Reserve is the U.S. central bank. Congress gave it a **dual mandate**: maximum employment and stable prices, which the Fed defines as 2% inflation. Its main tool is the **federal funds rate**, the interest rate banks charge each other for overnight loans. The Fed doesn't set your mortgage or car loan rate directly, but moving the shortest rate in the economy ripples out to all the others. Think of a thermostat in a big building: turn it up to cool an overheating economy, down to warm a cold one, knowing the rooms take months to respond.\n\n## How it works\nThe **Federal Open Market Committee (FOMC)** sets policy. It has 12 voting members: the seven governors of the Federal Reserve Board, the president of the New York Fed, and four of the other eleven regional Fed presidents, who rotate each year. It meets eight times a year and sets a target range for the fed funds rate, like 4.25% to 4.50%. It keeps the market rate inside that range mainly through the interest it pays banks on the reserves they hold at the Fed.\n\nIts other tools: buying bonds to push long-term rates down (**quantitative easing**, or QE), shrinking its bond holdings to let them rise (**quantitative tightening**, or QT), and **forward guidance**, signaling where rates are headed.\n\nHow a rate hike works its way through the economy:\n\n| Step | What happens |\n|---|---|\n| 1 | The Fed raises its target range |\n| 2 | Short-term rates rise: credit cards, adjustable-rate loans, savings accounts, Treasury bills |\n| 3 | Long-term rates, like mortgages, often rise too, if markets expect rates to stay high |\n| 4 | Borrowing costs more, so households and companies spend and invest less |\n| 5 | Stock and bond prices tend to fall and the dollar strengthens, cooling demand further |\n| 6 | Hiring slows and, with a lag of months, so does inflation |\n\nRates are quoted in **basis points**: one basis point is 0.01%, so a \"quarter-point\" hike is 25 basis points.\n\n## In the real world\nFrom March 2022 to July 2023, the FOMC raised its target range from 0%–0.25% to 5.25%–5.50%, the fastest run of increases since the early 1980s, including four straight hikes of three-quarters of a point in 2022. It started cutting in September 2024. Markets now hang on every meeting: the statement, the \"dot plot\" of officials' rate projections, released four times a year, and the chair's press conference. Before any interview, know three things: the current target range, who chairs the Fed, and what markets expect at the next meeting. The CME FedWatch tool shows market-implied odds for free.\n\n## The interview trap\nThe traps are saying the Fed sets mortgage rates, describing its job as fighting inflation alone, and not being able to explain how a rate hike actually reaches the economy.\n\n> The Federal Reserve is the U.S. central bank, and Congress gave it a dual mandate: maximum employment and stable prices, which it defines as 2% inflation. Its main tool is the federal funds rate, the overnight rate banks charge each other, which the FOMC sets as a target range at its eight meetings a year. When the Fed raises that rate, borrowing costs rise across the economy, from credit cards to business loans and often mortgages, so households and companies spend and invest less, asset prices tend to fall and the dollar strengthens. That cools demand, which over time slows hiring and inflation. It can also buy or shrink its holdings of bonds, known as quantitative easing and tightening, and it uses forward guidance to shape what markets expect.\n\n## Your line\n\"The Fed controls the shortest interest rate in the economy; markets set the rest.\" **Follow-up you'll get:** \"What's the risk of raising rates too far, or cutting too early?\" **The other side:** The Fed's tools work with long and variable lags, so it's always steering partly by the rear-view mirror; critics say it moved too late in 2021.\n\n## Your turn\n1. **Say it out loud:** How does a Fed rate hike slow inflation? Walk through it step by step.\n2. **Rapid fire:**\n   a. What are the two parts of the dual mandate?\n   b. How many times a year does the FOMC meet?\n   c. What is quantitative tightening?\n3. **Rewind:** What's the difference between CPI and PCE, and which does the Fed target?\n4. **Brain teaser:** The Fed's target range went from 0%–0.25% to 5.25%–5.50%. How many basis points is that?\n\n## Answers\n- **Say it out loud:** A strong answer goes in order: the Fed raises the fed funds rate; short-term borrowing costs rise, and often long-term ones too; households and businesses borrow, spend and invest less; asset prices fall and the dollar strengthens; demand cools, hiring slows, and inflation eases after a lag of months.\n- **a.** Maximum employment and stable prices.\n- **b.** Eight.\n- **c.** The Fed shrinking its balance sheet, mainly by letting bonds mature without replacing them, which tends to push long-term interest rates up.\n- **Rewind:** CPI, from the Bureau of Labor Statistics, tracks what urban consumers pay out of pocket; PCE, from the Bureau of Economic Analysis, is broader and adjusts as people switch products. The Fed targets 2% PCE inflation.\n- **Brain teaser:** 525 basis points.\n","answers":{"Cold open":"The Federal Reserve is the U.S. central bank, and Congress gave it a dual mandate: maximum employment and stable prices, which it defines as 2% inflation. Its main tool is the federal funds rate, the overnight rate banks charge each other, which the FOMC sets as a target range at its eight meetings a year. When the Fed raises that rate, borrowing costs rise across the economy, from credit cards to business loans and often mortgages, so households and companies spend and invest less, asset prices tend to fall and the dollar strengthens. That cools demand, which over time slows hiring and inflation. It can also buy or shrink its holdings of bonds, known as quantitative easing and tightening, and it uses forward guidance to shape what markets expect.","Say it out loud":"A strong answer goes in order: the Fed raises the fed funds rate; short-term borrowing costs rise, and often long-term ones too; households and businesses borrow, spend and invest less; asset prices fall and the dollar strengthens; demand cools, hiring slows, and inflation eases after a lag of months.","Rapid fire a":"Maximum employment and stable prices.","Rapid fire b":"Eight.","Rapid fire c":"The Fed shrinking its balance sheet, mainly by letting bonds mature without replacing them, which tends to push long-term interest rates up.","Rewind":"CPI, from the Bureau of Labor Statistics, tracks what urban consumers pay out of pocket; PCE, from the Bureau of Economic Analysis, is broader and adjusts as people switch products. The Fed targets 2% PCE inflation.","Brain teaser":"525 basis points."}},"mkt-why-interest-rates-move-stock-prices":{"title":"Why interest rates move stock prices","cat":"mkt","slug":"why-interest-rates-move-stock-prices","md":"# Why interest rates move stock prices\n*Comes up in:* Sales and trading, asset management and equity research interviews, especially \"what's going on in the markets\" questions.\n\n## Cold open\n\"Why do stocks often fall when interest rates rise?\"\n\nAnswer it out loud before you read on.\n\n## The big idea\nHigher interest rates pull stock prices down through three channels. First, **valuation**: rates are the base of every discount rate, so when they rise, future profits are worth less today. Second, **competition**: when safe Treasuries pay 5%, stocks have to offer a higher expected return to be worth the risk, and the only way an existing stock's expected return rises is for its price to fall. Third, **the economy**: higher borrowing costs slow spending and raise companies' interest bills, which cuts earnings. Think of interest rates as gravity for asset prices: the stronger the pull, the lower prices sit.\n\n## How it works\nThe valuation channel hits hardest when a company's profits lie far in the future. Here's the simple formula for a company growing steadily forever: value = next year's cash flow ÷ (discount rate − growth rate).\n\n| | Steady company | Growth company |\n|---|---|---|\n| Cash flow next year | 100 | 100 |\n| Growth rate | 1% | 4% |\n| Value at an 8% discount rate | 1,429 | 2,500 |\n| Value at a 9% discount rate | 1,250 | 2,000 |\n| **Change** | **−12.5%** | **−20%** |\n\nA one-point rise in the discount rate cuts the growth company's value by much more, because more of its value comes from cash flows far in the future. It behaves like a long-duration bond.\n\nThe competition channel shows up in the **earnings yield**, the inverse of the P/E ratio. A market at 20 times earnings has an earnings yield of 5%. When 10-year Treasuries yielded 1.5%, as they did at the start of 2022, that 5% looked generous; with Treasuries at 4.5%, the extra return for taking stock market risk is thin.\n\nNot every stock reacts the same way. Banks can earn more when rates rise, because they can charge more on loans than they pay on deposits, at least for a while. Utilities and real estate stocks, owned for their steady dividends, behave like bonds and tend to fall. Unprofitable growth companies usually get hit hardest.\n\nAnd the reason rates are moving matters. Rates rising because the economy is strong can go hand in hand with rising earnings and stock prices. Rates rising because of inflation fears usually hurt.\n\n## In the real world\nOn December 18, 2024, the Fed cut interest rates by a quarter point, and stocks fell anyway: the S&P 500 dropped about 3% and the Dow lost more than 1,100 points. Officials had signaled fewer cuts in 2025 than investors had hoped for, and markets trade on the expected path of rates, not on any single decision. In 2022, the reverse logic played out over a whole year: as the Fed raised rates far faster than expected, the S&P 500 fell about 19% and the tech-heavy Nasdaq about 33%. At the next Fed meeting, check the market-implied odds beforehand on CME FedWatch and see how stocks react to the statement and the press conference.\n\n## The interview trap\nThe traps are claiming that higher rates always mean lower stocks, and ignoring the fact that markets react to changes in expectations, not to rates alone.\n\n> Higher rates hurt stock prices through three channels. First, valuation: interest rates are the base of the discount rate, so when they rise, future profits are worth less today, and companies whose profits are far in the future, like high-growth tech, get hit hardest. Second, competition: when safe Treasuries pay more, investors demand a higher expected return from stocks, and prices fall until they offer it. Third, the economy: higher borrowing costs slow consumer spending and business investment and raise companies' interest expense, which cuts into earnings. But it depends on why rates are moving and what was expected. If rates rise because growth is strong, stocks can still do fine, and markets react to the expected path of rates more than to any single decision.\n\n## Your line\n\"Interest rates are gravity for asset prices: the higher they go, the less future cash is worth today.\" **Follow-up you'll get:** \"Why did growth stocks fall so much more than value stocks in 2022?\" **The other side:** In 2023 and 2024, stocks rallied even with rates at their highest in years, because earnings grew and inflation cooled, which shows rates are only one input.\n\n## Your turn\n1. **Say it out loud:** Why do growth stocks usually fall more than value stocks when rates rise?\n2. **Rapid fire:**\n   a. A company's cash flow next year is 50, it grows 3% a year forever, and the discount rate is 8%. What's it worth?\n   b. Name a sector that can benefit from higher interest rates.\n   c. A stock index trades at 25 times earnings. What's its earnings yield?\n3. **Rewind:** Who votes on the FOMC?\n4. **Brain teaser:** A company's value falls from 2,500 to 2,000. What's the percentage drop?\n\n## Answers\n- **Say it out loud:** More of a growth company's value comes from cash flows far in the future, and the further out a cash flow is, the more a higher discount rate shrinks its present value. A strong answer compares growth stocks to long-term bonds and mentions that unprofitable companies may also need to raise money at higher cost.\n- **a.** 1,000: 50 ÷ (0.08 − 0.03).\n- **b.** Banks, and often insurers.\n- **c.** 4%: 1 ÷ 25.\n- **Rewind:** The seven Fed governors, the president of the New York Fed, and four of the other eleven regional Fed presidents on a rotating basis: 12 in all.\n- **Brain teaser:** 20%.\n","answers":{"Cold open":"Higher rates hurt stock prices through three channels. First, valuation: interest rates are the base of the discount rate, so when they rise, future profits are worth less today, and companies whose profits are far in the future, like high-growth tech, get hit hardest. Second, competition: when safe Treasuries pay more, investors demand a higher expected return from stocks, and prices fall until they offer it. Third, the economy: higher borrowing costs slow consumer spending and business investment and raise companies' interest expense, which cuts into earnings. But it depends on why rates are moving and what was expected. If rates rise because growth is strong, stocks can still do fine, and markets react to the expected path of rates more than to any single decision.","Say it out loud":"More of a growth company's value comes from cash flows far in the future, and the further out a cash flow is, the more a higher discount rate shrinks its present value. A strong answer compares growth stocks to long-term bonds and mentions that unprofitable companies may also need to raise money at higher cost.","Rapid fire a":"1,000: 50 ÷ (0.08 − 0.03).","Rapid fire b":"Banks, and often insurers.","Rapid fire c":"4%: 1 ÷ 25.","Rewind":"The seven Fed governors, the president of the New York Fed, and four of the other eleven regional Fed presidents on a rotating basis: 12 in all.","Brain teaser":"20%."}},"mkt-the-yield-curve-and-what-an-inversion-is-suppose":{"title":"The yield curve, and what an inversion is supposed to signal","cat":"mkt","slug":"the-yield-curve-and-what-an-inversion-is-supposed-to-signal","md":"# The yield curve, and what an inversion is supposed to signal\n*Comes up in:* Sales and trading and asset management interviews, and any \"what's your view on the economy\" question.\n\n## Cold open\n\"What's an inverted yield curve, and why do people think it predicts recessions?\"\n\nAnswer it out loud before you read on.\n\n## The big idea\nThe yield curve plots Treasury yields from short maturities, a few months, to long ones, up to 30 years. Normally it slopes upward, because lenders want extra yield for tying up their money longer. It **inverts** when short-term yields rise above long-term ones. That usually happens when the Fed has pushed short-term rates up to fight inflation while investors expect growth to slow and the Fed to cut later, so long-term yields stay lower. Long-term yields are roughly the market's forecast of where short-term rates will average, plus a bit extra; an inversion is the market saying today's rates are too high to last.\n\n## How it works\nThe common shapes:\n\n- **Normal:** upward sloping; long-term yields above short-term ones.\n- **Flat:** little difference across maturities.\n- **Inverted:** short-term yields above long-term ones.\n- **Steep:** long-term yields well above short-term ones, often early in a recovery, after the Fed has cut.\n\n| Maturity | A normal curve (illustration) | An inverted curve (roughly mid-2023) |\n|---|---|---|\n| 3 months | 2.0% | 5.4% |\n| 2 years | 2.5% | 4.9% |\n| 10 years | 3.5% | 3.9% |\n| 30 years | 3.8% | 4.0% |\n\nThe two most-watched spreads are the 10-year yield minus the 2-year, and the 10-year minus the 3-month, which the New York Fed uses in its recession model. They're quoted in basis points.\n\nWhy might an inversion predict a recession?\n1. **Expectations:** markets expect the Fed to cut, which it usually does when the economy weakens.\n2. **Bank lending:** banks borrow short, through deposits, and lend long. When short rates are above long ones, lending earns less, so credit tightens.\n3. **Tight policy:** it shows the Fed holding short rates well above where markets think they'll settle.\n\nBefore 2022, an inversion had come before every U.S. recession since the 1950s, with one false alarm in the mid-1960s, usually six months to two years ahead.\n\n## In the real world\nThe 10-year minus 2-year spread inverted in July 2022 and stayed inverted for about two years, an unusually long stretch, reaching about a full percentage point below zero at its deepest in July 2023. It turned positive again in September 2024. Yet the U.S. economy kept growing through 2023 and 2024, and unemployment stayed low. Was the signal broken, or just slow? Some argue pandemic-era savings and the Fed's huge bond purchases distorted long-term yields; others point out that past recessions often began after the curve had already turned positive again. It's a favorite discussion question because there's no settled answer. Check today's curve on the Treasury's daily yield curve page and decide whether it's normal, flat or inverted.\n\n## The interview trap\nThe traps are saying an inversion causes recessions, treating it as a precise timer, and getting backwards which yield is higher.\n\n> The yield curve plots Treasury yields across maturities. Normally it slopes up, because investors want extra yield for lending for longer. It inverts when short-term yields rise above long-term ones, which usually happens when the Fed has raised short rates to fight inflation while investors expect growth to slow and rates to come down later, so long-term yields stay lower. It's watched because an inversion has come before nearly every U.S. recession since the 1950s, usually by six months to two years, and because it squeezes banks, which borrow short and lend long, so credit can tighten. But it's a signal, not a cause or a timer: the curve inverted in 2022, and the economy kept growing through 2024.\n\n## Your line\n\"An inversion is the bond market betting the Fed will have to cut, usually because growth is about to slow.\" **Follow-up you'll get:** \"The curve inverted in 2022 and no recession followed right away. Why might that be?\" **The other side:** Some argue the extra yield investors demand for long-term bonds has shrunk for structural reasons, like central bank bond buying and global demand for Treasuries, making inversions less informative than they used to be.\n\n## Your turn\n1. **Say it out loud:** Why might an inverted yield curve signal a coming recession?\n2. **Rapid fire:**\n   a. The 2-year Treasury yields 4.8% and the 10-year yields 4.2%. What's the spread, and is the curve inverted?\n   b. What shape is a normal yield curve?\n   c. Why do banks dislike an inverted curve?\n3. **Rewind:** Give two reasons stocks often fall when interest rates rise.\n4. **Brain teaser:** How many basis points are in 1.25 percentage points?\n\n## Answers\n- **Say it out loud:** An inversion means markets expect short-term rates to fall, which usually happens when the Fed cuts because the economy is weakening. It also squeezes banks, which borrow short and lend long, so they lend less. A strong answer adds that it's a signal with a long and variable lag, not a cause, and mentions the 2022–2024 inversion that wasn't quickly followed by a recession.\n- **a.** −60 basis points; yes, it's inverted.\n- **b.** Upward sloping.\n- **c.** They pay short-term rates on deposits and earn long-term rates on loans, so an inversion squeezes their profit margin.\n- **Rewind:** Any two of: future profits are discounted at a higher rate; safe bonds become more attractive competition; and higher borrowing costs slow the economy and cut earnings.\n- **Brain teaser:** 125.\n","answers":{"Cold open":"The yield curve plots Treasury yields across maturities. Normally it slopes up, because investors want extra yield for lending for longer. It inverts when short-term yields rise above long-term ones, which usually happens when the Fed has raised short rates to fight inflation while investors expect growth to slow and rates to come down later, so long-term yields stay lower. It's watched because an inversion has come before nearly every U.S. recession since the 1950s, usually by six months to two years, and because it squeezes banks, which borrow short and lend long, so credit can tighten. But it's a signal, not a cause or a timer: the curve inverted in 2022, and the economy kept growing through 2024.","Say it out loud":"An inversion means markets expect short-term rates to fall, which usually happens when the Fed cuts because the economy is weakening. It also squeezes banks, which borrow short and lend long, so they lend less. A strong answer adds that it's a signal with a long and variable lag, not a cause, and mentions the 2022–2024 inversion that wasn't quickly followed by a recession.","Rapid fire a":"−60 basis points; yes, it's inverted.","Rapid fire b":"Upward sloping.","Rapid fire c":"They pay short-term rates on deposits and earn long-term rates on loans, so an inversion squeezes their profit margin.","Rewind":"Any two of: future profits are discounted at a higher rate; safe bonds become more attractive competition; and higher borrowing costs slow the economy and cut earnings.","Brain teaser":"125."}},"awm-asset-management-vs-wealth-management-what-each-":{"title":"Asset management vs. wealth management: what each does, and how each makes money","cat":"awm","slug":"asset-management-vs-wealth-management-what-each-does-and","md":"# Asset management vs. wealth management: what each does, and how each makes money\n*Comes up in:* Every asset management and wealth management interview, and \"why this division?\" questions at big banks.\n\n## Cold open\n\"What's the difference between asset management and wealth management?\"\n\nAnswer it out loud before you read on.\n\n## The big idea\n**Asset managers** build and run investment portfolios, such as mutual funds, ETFs, hedge funds and accounts for pension funds, for many clients at once. Their job is the portfolio: beat a benchmark, or track it cheaply. **Wealth managers** work with individuals and families. Their job is the client: understanding their goals and building an overall plan across investments, taxes, retirement and estate planning, often using asset managers' funds as building blocks. Think of an asset manager as a company that makes running shoes, and a wealth manager as a coach who works out which shoes, training plan and diet fit one particular runner.\n\n## How it works\n| | Asset management | Wealth management |\n|---|---|---|\n| Clients | Institutions, like pension funds, endowments, insurers and sovereign wealth funds, plus individuals through funds | Individuals and families, often wealthy ones |\n| Focus | The portfolio: performance against a benchmark | The client: goals, taxes, retirement, estate, borrowing |\n| How it's paid | A management fee as a percentage of assets under management (AUM), sometimes plus a share of profits | An advisory fee, often around 1% of assets a year, plus commissions, lending and banking fees |\n| Typical roles | Research analyst, portfolio manager, trader, sales | Financial advisor, private banker, wealth planner, investment analyst |\n| Examples | BlackRock, Vanguard, Fidelity, Capital Group, Wellington, PIMCO | Morgan Stanley Wealth Management, Merrill, J.P. Morgan Private Bank, UBS, Goldman Sachs |\n\nFees vary widely. An index fund can charge as little as 0.03% of assets a year; an actively managed stock fund often charges 0.5% to 1%; hedge funds historically charged \"2 and 20,\" meaning 2% of assets plus 20% of profits, though fees have come down. The math: a $1 billion fund charging 0.5% earns $5 million a year. An advisor whose clients have $200 million with them at 1% brings in $2 million a year in revenue.\n\nWhy both businesses like fees on assets: the revenue recurs, and it grows as markets rise and new money comes in, unlike trading and deal fees, which swing with the markets. The flip side is that revenue falls when markets do.\n\n## In the real world\nMorgan Stanley remade itself after the 2008 crisis by leaning into wealth management. Under James Gorman, CEO from 2010 through 2023, it bought out Citigroup's share of the Smith Barney brokerage, completing the purchase in 2013, then bought the online broker E*Trade in 2020 and the asset manager Eaton Vance in 2021. The bet was that fees on client assets would be far steadier than trading and deal revenue. Goldman Sachs has since reorganized around a similar push into asset and wealth management. Pick a bank you're interviewing with, open its latest quarterly earnings release, and find how much of its revenue comes from wealth and asset management.\n\n## The interview trap\nThe traps are treating the two as the same, describing asset management as \"managing money for rich people\" (that's closer to wealth management), and not knowing how either one gets paid.\n\n> Asset management is about running portfolios: firms like BlackRock or Fidelity manage funds and accounts for pension funds, endowments, insurers and individuals investing through mutual funds and ETFs, and their job is to beat or track a benchmark. They mostly earn a fee based on assets under management. Wealth management is about the client: advisors work with individuals and families on their whole financial life, including how their money is invested, taxes, retirement and estate planning, often using asset managers' funds as building blocks. They typically earn an advisory fee, often around 1% of assets a year, plus commissions and lending income. So the asset manager builds the products, and the wealth manager builds the client's plan.\n\n## Your line\n\"Asset managers build the products; wealth managers build the plan, often out of those products.\" **Follow-up you'll get:** \"Which would you rather do, and why?\" **The other side:** The line is blurring: many big firms run both businesses, and wealth managers increasingly build their own model portfolios instead of simply picking funds.\n\n## Your turn\n1. **Say it out loud:** Why might someone prefer a career in asset management over wealth management, or the other way around?\n2. **Rapid fire:**\n   a. A $2 billion fund charges 0.75% a year. What's its annual fee revenue?\n   b. What does AUM stand for?\n   c. Name one way a wealth manager gets paid other than a percentage of assets.\n3. **Rewind:** What does an inverted yield curve mean?\n4. **Brain teaser:** What does a 1% annual fee cost on a $750,000 portfolio?\n\n## Answers\n- **Say it out loud:** A strong answer connects each path to the work itself. Asset management suits someone who loves analyzing companies and markets and wants to be judged on investment results; wealth management suits someone who loves working with people, building long relationships and solving whole financial problems, and it rewards building a client base. The best answers tie the choice to something specific from the candidate's own experience.\n- **a.** $15 million.\n- **b.** Assets under management.\n- **c.** Any of: commissions on trades or products, interest on loans such as mortgages or loans against a portfolio, banking fees, or flat fees for financial planning.\n- **Rewind:** Short-term Treasury yields are above long-term ones. Markets expect rates to fall, usually because growth is expected to slow, and it has historically come before most recessions.\n- **Brain teaser:** $7,500 a year.\n","answers":{"Cold open":"Asset management is about running portfolios: firms like BlackRock or Fidelity manage funds and accounts for pension funds, endowments, insurers and individuals investing through mutual funds and ETFs, and their job is to beat or track a benchmark. They mostly earn a fee based on assets under management. Wealth management is about the client: advisors work with individuals and families on their whole financial life, including how their money is invested, taxes, retirement and estate planning, often using asset managers' funds as building blocks. They typically earn an advisory fee, often around 1% of assets a year, plus commissions and lending income. So the asset manager builds the products, and the wealth manager builds the client's plan.","Say it out loud":"A strong answer connects each path to the work itself. Asset management suits someone who loves analyzing companies and markets and wants to be judged on investment results; wealth management suits someone who loves working with people, building long relationships and solving whole financial problems, and it rewards building a client base. The best answers tie the choice to something specific from the candidate's own experience.","Rapid fire a":"$15 million.","Rapid fire b":"Assets under management.","Rapid fire c":"Any of: commissions on trades or products, interest on loans such as mortgages or loans against a portfolio, banking fees, or flat fees for financial planning.","Rewind":"Short-term Treasury yields are above long-term ones. Markets expect rates to fall, usually because growth is expected to slow, and it has historically come before most recessions.","Brain teaser":"$7,500 a year."}},"awm-asset-classes-stocks-bonds-cash-real-estate-and-":{"title":"Asset classes: stocks, bonds, cash, real estate and alternatives","cat":"awm","slug":"asset-classes-stocks-bonds-cash-real-estate-and-alternatives","md":"# Asset classes: stocks, bonds, cash, real estate and alternatives\n*Comes up in:* Asset management and wealth management interviews, and \"how would you invest $10,000?\" questions anywhere.\n\n## Cold open\n\"Walk me through the main asset classes. What role does each one play in a portfolio?\"\n\nAnswer it out loud before you read on.\n\n## The big idea\nAn asset class is a group of investments that behave in similar ways. The main ones are stocks, bonds, cash, real estate and alternatives, and each has a job. Stocks grow wealth over the long run. Bonds provide income and usually cushion a portfolio when stocks fall. Cash keeps money safe and available. Real estate provides income and some protection against inflation. Alternatives try to earn returns that don't move with the stock market. Choosing among them always means trading off return, risk and liquidity, which is how quickly you can sell without taking a loss.\n\n## How it works\nHere's how the three classic U.S. asset classes have done since 1928, using NYU professor Aswath Damodaran's data through 2024:\n\n| Asset class | Main job | Average annual return since 1928 | Worst calendar year | Liquidity |\n|---|---|---|---|---|\n| Stocks (S&P 500) | Growth | About 10% | −44% (1931) | High |\n| Bonds (10-year Treasuries) | Income and stability | About 4.5% | −18% (2022) | High |\n| Cash (3-month Treasury bills) | Safety and liquidity | About 3.3% | Never negative | Highest |\n\nInflation averaged about 3% a year over that period, so cash has barely kept up, while stocks have grown real wealth, with frightening drops along the way.\n\nThe other two:\n\n- **Real estate:** rental income plus price gains, with some protection against inflation. Owning property directly is illiquid; real estate investment trusts (REITs) trade like stocks.\n- **Alternatives:** private equity, hedge funds, private credit, infrastructure and commodities. They aim for returns that don't move with public markets, usually with higher fees and much less liquidity. A private equity fund typically locks up investors' money for ten years or more.\n\n## In the real world\n2022 broke a rule many investors took for granted. Inflation drove interest rates sharply higher, which hurt stocks and bonds at the same time: the S&P 500 lost about 18% including dividends, U.S. investment-grade bonds lost about 13%, and a classic mix of 60% stocks and 40% bonds lost about 16%, its worst year since 2008. Commodities, meanwhile, rose. The lesson: bonds cushion stocks when the problem is weak growth, but when the problem is inflation, they can fall together. And cash, often dismissed as dead money, paid about 5% in 2023. To see how professionals mix asset classes for someone your age, look up the holdings of a target-date retirement fund dated around 2070.\n\n## The interview trap\nThe traps are listing asset classes without saying what job each one does, assuming bonds always rise when stocks fall, and ignoring liquidity.\n\n> The main asset classes are stocks, bonds, cash, real estate and alternatives, and each plays a different role. Stocks are for long-term growth: historically they've returned around 10% a year in the U.S., but with big drops along the way. Bonds provide income and usually cushion a portfolio when stocks fall, though they can fall together when inflation pushes rates up, as in 2022. Cash is for safety and liquidity, with low returns. Real estate offers income and some inflation protection but is less liquid, unless you own it through REITs. Alternatives, like private equity, hedge funds, private credit and commodities, aim for returns that don't move with public markets, usually in exchange for higher fees and less liquidity. How you mix them depends on the investor's goals, time horizon and tolerance for risk.\n\n## Your line\n\"Every asset class has a job; building a portfolio is deciding how much of each job you need.\" **Follow-up you'll get:** \"How would you invest $10,000 for someone who needs it in one year, compared with someone who needs it in 40?\" **The other side:** Critics argue private assets only look steady because they aren't priced every day, a problem AQR's Cliff Asness calls \"volatility laundering,\" so their diversification benefit may be overstated.\n\n## Your turn\n1. **Say it out loud:** How would you split money between asset classes for a 25-year-old saving for retirement, and why?\n2. **Rapid fire:**\n   a. Which is least liquid: Treasury bonds, a private equity fund or an S&P 500 index fund?\n   b. What does REIT stand for?\n   c. Why did stocks and bonds fall together in 2022?\n3. **Rewind:** How do asset managers make money?\n4. **Brain teaser:** In a portfolio of 60% stocks and 40% bonds, stocks return 10% and bonds 4%. What does the portfolio return?\n\n## Answers\n- **Say it out loud:** A strong answer leans heavily toward stocks, often 80% to 100%, because a 25-year-old has decades to ride out downturns and needs growth, with a small cash cushion for emergencies and possibly some bonds. It explains the reasoning, time horizon and risk tolerance, rather than just naming percentages, and mentions low-cost diversified funds.\n- **a.** The private equity fund.\n- **b.** Real estate investment trust.\n- **c.** Inflation pushed interest rates sharply higher, which lowered the value of both: future profits were discounted more heavily, and existing bonds fell as new ones paid more.\n- **Rewind:** Mostly through a management fee charged as a percentage of assets under management, sometimes plus performance fees.\n- **Brain teaser:** 7.6%: 0.6 × 10% + 0.4 × 4%.\n","answers":{"Cold open":"The main asset classes are stocks, bonds, cash, real estate and alternatives, and each plays a different role. Stocks are for long-term growth: historically they've returned around 10% a year in the U.S., but with big drops along the way. Bonds provide income and usually cushion a portfolio when stocks fall, though they can fall together when inflation pushes rates up, as in 2022. Cash is for safety and liquidity, with low returns. Real estate offers income and some inflation protection but is less liquid, unless you own it through REITs. Alternatives, like private equity, hedge funds, private credit and commodities, aim for returns that don't move with public markets, usually in exchange for higher fees and less liquidity. How you mix them depends on the investor's goals, time horizon and tolerance for risk.","Say it out loud":"A strong answer leans heavily toward stocks, often 80% to 100%, because a 25-year-old has decades to ride out downturns and needs growth, with a small cash cushion for emergencies and possibly some bonds. It explains the reasoning, time horizon and risk tolerance, rather than just naming percentages, and mentions low-cost diversified funds.","Rapid fire a":"The private equity fund.","Rapid fire b":"Real estate investment trust.","Rapid fire c":"Inflation pushed interest rates sharply higher, which lowered the value of both: future profits were discounted more heavily, and existing bonds fell as new ones paid more.","Rewind":"Mostly through a management fee charged as a percentage of assets under management, sometimes plus performance fees.","Brain teaser":"7.6%: 0.6 × 10% + 0.4 × 4%."}},"awm-diversification-and-correlation-the-only-free-lu":{"title":"Diversification and correlation: the only free lunch in investing","cat":"awm","slug":"diversification-and-correlation-the-only-free-lunch-in","md":"# Diversification and correlation: the only free lunch in investing\n*Comes up in:* Asset management and wealth management interviews, and portfolio questions in sales and trading.\n\n## Cold open\n\"Why is diversification called the only free lunch in investing?\"\n\nAnswer it out loud before you read on.\n\n## The big idea\nCombining investments that don't move in lockstep lowers a portfolio's ups and downs without lowering its expected return. The key measure is **correlation**, a number from −1 to +1 that describes how closely two investments move together. Harry Markowitz worked this out in a 1952 paper, the start of modern portfolio theory, and later shared a Nobel Prize for it; the \"free lunch\" line is usually credited to him. Think of a shop that sells both umbrellas and sunscreen: its sales are steadier than a shop that sells only one, whatever the weather.\n\n## How it works\nTake two investments, each expected to return 8% a year with the same volatility, a standard deviation of 20%, and split your money 50/50 between them:\n\n| Correlation | Portfolio's expected return | Portfolio's volatility |\n|---|---|---|\n| +1 (move in lockstep) | 8% | 20.0% |\n| +0.5 | 8% | 17.3% |\n| 0 (unrelated) | 8% | 14.1% |\n| −1 (exact opposites) | 8% | 0% |\n\nThe expected return is 8% in every case; only the risk changes. That's the free lunch.\n\nThere are two kinds of risk:\n\n- **Company-specific risk:** a failed product, a fraud, a lawsuit. Diversification can mostly remove it. Owning a few dozen stocks across different industries eliminates much of it.\n- **Market risk:** recessions, interest rate shocks, panics. It hits nearly everything at once, so diversification can't remove it. That's why investors expect to be paid for bearing it, and why beta, from the WACC lesson, measures only this kind of risk.\n\nThe catch: correlations tend to rise during a crisis, just when you need them low. In the fall of 2008, almost everything except Treasuries fell together.\n\n## In the real world\nAt the end of 2000, 62% of the money in Enron's 401(k) retirement plan was invested in Enron's own stock. A year later, the company had collapsed in an accounting fraud and filed for bankruptcy, and the stock was nearly worthless. Many employees lost their jobs and their retirement savings at the same time, because both depended on the same company: about as correlated as two risks can be. The lesson stuck: don't concentrate your savings in the company that also pays your salary. If you help run a student investment fund or a paper portfolio, check how much of it would fall at once if a single sector crashed.\n\n## The interview trap\nThe traps are saying diversification means owning lots of stocks (30 tech stocks are still one big bet) and claiming it eliminates all risk.\n\n> Diversification lowers a portfolio's risk without necessarily lowering its expected return, as long as the assets don't move perfectly together. That's measured by correlation, which runs from −1 to +1. If two assets with the same expected return and volatility have a correlation below 1, a mix of them has the same expected return but lower volatility, because their ups and downs partly cancel out. It removes company-specific risk, like one firm's fraud or failed product, but not market risk, like a recession that hits everything, which is why investors are paid for bearing market risk. And it's not about the number of holdings: 30 tech stocks are still one big bet, and correlations tend to rise in a crisis.\n\n## Your line\n\"What matters isn't how many things you own, but how differently they move.\" **Follow-up you'll get:** \"Why do correlations rise in a crisis, and what does that mean for diversification?\" **The other side:** Concentrated investors like Warren Buffett argue that diversification mainly protects against not knowing what you own, and that spreading money across many holdings dilutes your best ideas.\n\n## Your turn\n1. **Say it out loud:** Is a portfolio of 30 technology stocks diversified? Explain.\n2. **Rapid fire:**\n   a. What does a correlation of +1 mean?\n   b. Which kind of risk can't be diversified away?\n   c. Two assets each have 20% volatility and zero correlation. What's the volatility of a 50/50 mix?\n3. **Rewind:** What job does each of the main asset classes do in a portfolio?\n4. **Brain teaser:** Roughly what is the square root of 0.02?\n\n## Answers\n- **Say it out loud:** Not really. It removes some company-specific risk, but the stocks share the same industry risks, like interest rates, regulation and tech spending cycles, so they tend to move together. A strong answer explains that diversification depends on correlation, not the number of holdings.\n- **a.** The two always move in the same direction, in proportion.\n- **b.** Market risk, also called systematic risk.\n- **c.** About 14%.\n- **Rewind:** Stocks for long-term growth, bonds for income and stability, cash for safety and liquidity, real estate for income and inflation protection, and alternatives for returns that don't move with public markets.\n- **Brain teaser:** About 0.141.\n","answers":{"Cold open":"Diversification lowers a portfolio's risk without necessarily lowering its expected return, as long as the assets don't move perfectly together. That's measured by correlation, which runs from −1 to +1. If two assets with the same expected return and volatility have a correlation below 1, a mix of them has the same expected return but lower volatility, because their ups and downs partly cancel out. It removes company-specific risk, like one firm's fraud or failed product, but not market risk, like a recession that hits everything, which is why investors are paid for bearing market risk. And it's not about the number of holdings: 30 tech stocks are still one big bet, and correlations tend to rise in a crisis.","Say it out loud":"Not really. It removes some company-specific risk, but the stocks share the same industry risks, like interest rates, regulation and tech spending cycles, so they tend to move together. A strong answer explains that diversification depends on correlation, not the number of holdings.","Rapid fire a":"The two always move in the same direction, in proportion.","Rapid fire b":"Market risk, also called systematic risk.","Rapid fire c":"About 14%.","Rewind":"Stocks for long-term growth, bonds for income and stability, cash for safety and liquidity, real estate for income and inflation protection, and alternatives for returns that don't move with public markets.","Brain teaser":"About 0.141."}},"awm-active-vs-passive-the-index-fund-revolution-and-":{"title":"Active vs. passive: the index fund revolution, and why most pros trail the index","cat":"awm","slug":"active-vs-passive-the-index-fund-revolution-and-why-most","md":"# Active vs. passive: the index fund revolution, and why most pros trail the index\n*Comes up in:* Nearly every asset management interview, plus wealth management and equity research.\n\n## Cold open\n\"Do you believe in active or passive investing?\"\n\nAnswer it out loud before you read on.\n\n## The big idea\n**Passive** investing means buying the whole market through an index fund and accepting the market's return at very low cost. **Active** investing means picking securities to try to beat a benchmark. The economist William Sharpe laid out the core math in 1991: before costs, the average actively managed dollar must earn exactly the market's return, because all investors together are the market. After fees and trading costs, the average active dollar must trail it. Some managers do beat the market, but they're hard to identify in advance, and few keep doing it. Think of a poker game where the house takes a cut of every pot: the players can't collectively beat the table, and after the house's cut, most of them lose.\n\n## How it works\n| | Passive | Active |\n|---|---|---|\n| Goal | Match the index | Beat the index |\n| Typical cost | As little as 0.03% a year | Often 0.5% to 1% a year |\n| Trading | Only when the index changes | Whenever the manager sees an opportunity |\n| Results vs. the index | Almost identical | Can be much better or much worse |\n\nFees compound. Invest $10,000 for 30 years at 7% a year and you end up with about $76,100. Take 0.6% a year off that return for fees and you end up with about $64,300, roughly $11,800 less, for the fee difference alone.\n\nJohn Bogle founded Vanguard and launched the first index mutual fund for individual investors in 1976; critics called it \"Bogle's folly.\" By the end of 2023, according to Morningstar, passive U.S. mutual funds and ETFs held more money than active ones for the first time: about $13.3 trillion against $13.2 trillion.\n\nActive management has its best case in less crowded corners of the market, like small companies, emerging markets and corporate bonds, during market dislocations, when forced sellers create bargains, and for investors with specific needs, like managing taxes. And markets need active investors: if everyone simply indexed, nobody would be setting prices.\n\n## In the real world\nIn 2008, Warren Buffett made a $1 million bet, with the winnings going to charity, that an S&P 500 index fund would beat a selection of hedge funds over ten years. Protégé Partners took the other side with five funds of hedge funds. From 2008 through 2017, the index fund gained about 126%, roughly 8.5% a year. The best of the five gained about 88%, roughly 6.5% a year, and the rest did far worse. The broader data agrees: S&P Dow Jones Indices' SPIVA scorecard found that about 90% of actively managed U.S. large-cap funds trailed the S&P 500 over the 15 years through 2024, and 79% trailed it in 2025 alone. If you're interviewing at an active manager, read what that firm has published about where active investing works; most have a view.\n\n## The interview trap\nThe trap is giving a dogmatic answer, especially \"active is dead\" in an interview at an active manager. The other is not knowing why most active funds trail.\n\n> I think passive is the right default for most people's core savings, because the math is hard to beat: before costs, active managers as a group earn the market return, so after fees most of them trail it, and SPIVA data shows roughly nine in ten large-cap U.S. funds underperforming the S&P 500 over fifteen years. But I don't think active is dead. Markets need active investors to set prices, and skilled managers have a better shot in less efficient areas, like small companies, emerging markets and credit, or during dislocations when forced sellers create bargains. So I'd look for active managers with a clear, repeatable edge, reasonable fees and a process I can evaluate, and I'd use passive everywhere else.\n\n## Your line\n\"Passive is the right default; active has to earn its fee, and it can, in the less crowded corners of the market.\" **Follow-up you'll get:** \"If index funds keep growing, what happens to how efficiently markets are priced?\" **The other side:** Some argue that as passive investing grows, money flows mechanically into the biggest stocks and prices become less efficient, creating more opportunities for active managers.\n\n## Your turn\n1. **Say it out loud:** You're interviewing at an active fund manager, and they ask whether passive is better. Answer in 30 seconds.\n2. **Rapid fire:**\n   a. Who founded Vanguard and launched the first index mutual fund for individual investors?\n   b. Why must the average active dollar trail the index after costs?\n   c. Name a market where active management has a better chance.\n3. **Rewind:** What does correlation measure, and why does it matter for diversification?\n4. **Brain teaser:** What does a 0.6% annual fee cost on $1 million?\n\n## Answers\n- **Say it out loud:** A strong answer respects both sides: it acknowledges the math and the data on fees, then explains where and how skilled active management adds value, ideally tied to that firm's strategy, and ends with a clear view rather than a shrug.\n- **a.** John Bogle, in 1976.\n- **b.** Before costs, all active investors together hold the market and earn its return; fees and trading costs then pull the average below it.\n- **c.** Any of: small companies, emerging markets, corporate or high-yield bonds, or private markets.\n- **Rewind:** How closely two investments move together, from −1 to +1. The lower the correlation, the more their ups and downs cancel out, so mixing them reduces risk without reducing expected return.\n- **Brain teaser:** $6,000 a year.\n","answers":{"Cold open":"I think passive is the right default for most people's core savings, because the math is hard to beat: before costs, active managers as a group earn the market return, so after fees most of them trail it, and SPIVA data shows roughly nine in ten large-cap U.S. funds underperforming the S&P 500 over fifteen years. But I don't think active is dead. Markets need active investors to set prices, and skilled managers have a better shot in less efficient areas, like small companies, emerging markets and credit, or during dislocations when forced sellers create bargains. So I'd look for active managers with a clear, repeatable edge, reasonable fees and a process I can evaluate, and I'd use passive everywhere else.","Say it out loud":"A strong answer respects both sides: it acknowledges the math and the data on fees, then explains where and how skilled active management adds value, ideally tied to that firm's strategy, and ends with a clear view rather than a shrug.","Rapid fire a":"John Bogle, in 1976.","Rapid fire b":"Before costs, all active investors together hold the market and earn its return; fees and trading costs then pull the average below it.","Rapid fire c":"Any of: small companies, emerging markets, corporate or high-yield bonds, or private markets.","Rewind":"How closely two investments move together, from −1 to +1. The lower the correlation, the more their ups and downs cancel out, so mixing them reduces risk without reducing expected return.","Brain teaser":"$6,000 a year."}},"inv-how-to-pitch-a-stock-thesis-catalysts-valuation-":{"title":"How to pitch a stock: thesis, catalysts, valuation, risks","cat":"inv","slug":"how-to-pitch-a-stock-thesis-catalysts-valuation-risks","md":"# How to pitch a stock: thesis, catalysts, valuation, risks\n*Comes up in:* Asset management, equity research, hedge fund and investment club interviews, and sometimes as a curveball in banking.\n\n## Cold open\n\"Pitch me a stock.\"\n\nAnswer it out loud before you read on.\n\n## The big idea\nA stock pitch is an argument, not a company profile. The interviewer wants to know what the market is getting wrong, why that will change, what the stock is worth and what could prove you wrong. Most students stumble by describing the business (\"Apple makes iPhones\") instead of making a case. Think of a lawyer's closing argument, not an encyclopedia entry.\n\n## How it works\nStructure a two-minute pitch in five parts:\n\n1. **Recommendation:** buy or sell, today's price, your price target and the time frame.\n2. **Thesis:** two or three reasons the market is mispricing the stock, ideally a \"variant view\": something you believe that most investors don't.\n3. **Catalysts:** specific events that will make the market see what you see, like an earnings report, a product launch, a cost-cutting plan or a spinoff.\n4. **Valuation:** how you got your target, usually a multiple applied to next year's numbers, checked against peers or a DCF.\n5. **Risks:** what would make you wrong, and the signal that would make you change your mind.\n\nHere's the structure applied to an imaginary gym chain, Harbor Fitness:\n\n| Part | Example |\n|---|---|\n| Recommendation | Buy at $40, target $52.50 in 12 months: about 31% upside |\n| Thesis | The market fears new gyms will steal members from existing ones, but new locations are breaking even within 18 months, and a recent price increase stuck without members leaving |\n| Catalysts | Next quarter's results, when new-location numbers become visible; an investor day in the spring |\n| Valuation | Next year's earnings of $3.50 a share × 15, the low end of peers' 15 to 17 times, = $52.50; it trades at about 11 times today |\n| Risks | A recession cuts memberships; a low-cost rival opens nearby. I'd sell if existing gyms lost members two quarters in a row |\n\nA few tips:\n- Pick a company you can really defend, ideally not the most famous giants, unless you have a genuinely unusual angle. A mid-sized company in an industry you know is ideal.\n- Know the numbers cold: share price, market value, P/E or EV/EBITDA, revenue growth, and how they compare with peers.\n- Prepare a one-sentence version, a two-minute version and enough depth for 20 minutes of questions.\n- Have a stock to sell ready too; some interviewers ask for one.\n- Update it the week of the interview. If the stock has moved 20%, they'll ask what changed.\n\n## In the real world\nIn December 2012, the hedge fund manager Bill Ackman presented a 342-slide case that Herbalife, a seller of nutrition shakes and supplements, was a pyramid scheme, and bet about $1 billion against its stock. Carl Icahn took the other side and bought shares. In 2016, the Federal Trade Commission made Herbalife pay $200 million and change how it paid its distributors, but stopped short of calling it a pyramid scheme, and the stock rose. Ackman closed out his bet in 2018 with a large loss. The research was deep; what the thesis lacked was a catalyst that actually arrived. Ask the same question of your own pitch: what event makes the market agree with you, and when?\n\n## The interview trap\nThe traps
